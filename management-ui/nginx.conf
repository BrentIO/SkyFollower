server {
    listen 80;

    # nginx's stock mime.types has no .mjs entry (only .js), so it falls
    # back to default_type (application/octet-stream) -- browsers refuse
    # to execute a worker/module script served with that MIME type.
    # maplibre-gl's worker chunk (see AreasView.tsx's `?url` import of
    # maplibre-gl-worker.mjs) is a real .mjs file Vite emits as a static
    # asset, so it needs this explicit mapping to actually load.
    types {
        application/javascript mjs;
    }

    # React app: history-mode routing, so any path not matching a static
    # file falls back to index.html and react-router-dom's BrowserRouter
    # resolves it client-side (e.g. a reload on /rules).
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
