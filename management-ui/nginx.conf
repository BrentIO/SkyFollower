server {
    listen 80;

    # React app: history-mode routing, so any path not matching a static
    # file falls back to index.html and react-router-dom's BrowserRouter
    # resolves it client-side (e.g. a reload on /rules).
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
