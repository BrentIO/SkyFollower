# Plain HTTP is redirect-only -- keeps port 80 working for old bookmarks/
# muscle memory rather than dropping it outright, but every real request
# ends up on the HTTPS server block below.
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Self-signed by default (generated by scripts/install.sh's TLS step,
    # ~10-year validity) or an operator-supplied cert/key dropped into the
    # same bind-mounted directory under the same filenames -- see
    # management-ui/README.md's TLS section. No HSTS: pairing it with a
    # self-signed cert on a LAN host that's often reached by bare IP is a
    # foot-gun (a renewed/replaced cert, or a client that hasn't trusted it
    # yet, gets locked out with no override).
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # React app: history-mode routing, so any path not matching a static
    # file falls back to index.html and react-router-dom's BrowserRouter
    # resolves it client-side (e.g. a reload on /rules).
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # nginx's stock mime.types has no .mjs entry (only .js), so it falls
    # back to default_type (application/octet-stream) -- browsers refuse
    # to execute a worker/module script served with that MIME type.
    # maplibre-gl's worker chunk (see AreasView.tsx's `?url` import of
    # maplibre-gl-worker.mjs) is a real .mjs file Vite emits as a static
    # asset, so it needs this explicit mapping to actually load. Scoped to
    # its own location (not a server-level `types {}` block) because a
    # `types {}` block *replaces* the inherited MIME table for its context
    # rather than merging with it -- at the server level that would have
    # wiped out every other extension's mapping (.html, .css, .js, ...),
    # falling everything back to application/octet-stream and making the
    # browser try to download pages instead of rendering them.
    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
