name: skyfollower-message-processor

# Interpolated from this host's .env (written by
# scripts/install.sh). Named one variable at a time rather than
# `env_file: .env`, so a container only ever holds the values it reads.
# MESSAGE_PROCESSOR_ID is not here: it differs per instance and comes from
# each instance's own message-processors/{id}.env.
x-message-processor-environment: &message-processor-environment
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LATITUDE: ${LATITUDE}
  LONGITUDE: ${LONGITUDE}
  RABBITMQ_HOST: ${RABBITMQ_HOST}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  MQTT_HOST: ${MQTT_HOST}
  MQTT_PORT: ${MQTT_PORT:-1883}
  MQTT_USERNAME: ${MQTT_USERNAME}
  MQTT_PASSWORD: ${MQTT_PASSWORD}
  # Optional live position/metadata feed toward the future map component
  # (not yet built). Leave MAP_UDP_HOST unset to disable entirely --
  # same optional-endpoint convention as MQTT_HOST above.
  MAP_UDP_HOST: ${MAP_UDP_HOST}
  MAP_UDP_PORT: ${MAP_UDP_PORT}
  CAPTURE_RAW_FRAMES: ${CAPTURE_RAW_FRAMES}

# Template every message processor extends. What differs per instance is its
# fleet-wide ID, used verbatim -- with no local/global translation -- as the
# compose service name, container name, RabbitMQ queue name, Redis
# heartbeat key, and data directory. scripts/install.sh generates
# docker-compose.instances.yaml next to this file with one service per ID
# (container name, ./data/skyfollower-message-processor-{id} data
# directory, env_file ./message-processors/{id}.env), so this file holds no
# per-host content.
#
# deploy.replicas cannot substitute for this. A replica's hostname is its
# container ID rather than an ordinal, so there is nothing inside the
# container to derive a distinct MESSAGE_PROCESSOR_ID from; the per-replica
# index that would solve it ({{.Task.Slot}}) is Swarm-mode templating and is
# not substituted by `docker compose up`. Replicas would also share one
# volume definition, which means one SQLite active store written by N
# processes with N independent recovery loops.
services:
  message-processor:
    profiles: ["template"]
    environment: *message-processor-environment
    image: ghcr.io/brentio/skyfollower-message-processor:${SKYFOLLOWER_VERSION:-latest}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # RAM-backed, not the container's writable layer -- the healthcheck
    # heartbeat file is rewritten every 15s and must never hit the host's
    # eMMC/SD storage the way /app/data (the active flight store) legitimately does.
    tmpfs:
      - /app/health
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

# Slots inside the RabbitMQ consistent-hash exchange are positional,
# assigned in the order processors bind, and stable across restarts once
# established. Scaling down, remove the highest-numbered instance:
# unbinding from the middle reshuffles ~68% of aircraft, while merely
# stopping a container leaves its binding intact and costs nothing. See
# receiver/README.md's "Remove from the end, never the middle" guidance.
