name: skyfollower-message-processor

# Interpolated from this host's .env (written by
# scripts/download-host-files.sh). Named one variable at a time rather than
# `env_file: .env`, so a container only ever holds the values it reads.
# MESSAGE_PROCESSOR_ID is not here: it's the one value that differs per
# instance, so each service sets it alongside this block.
x-message-processor-environment: &message-processor-environment
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-30}
  RULE_NOTIFICATION_MAX_LAG_SECONDS: ${RULE_NOTIFICATION_MAX_LAG_SECONDS:-30}
  LATITUDE: ${LATITUDE}
  LONGITUDE: ${LONGITUDE}
  RABBITMQ_HOST: ${RABBITMQ_HOST}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT:-6379}
  MQTT_HOST: ${MQTT_HOST}
  MQTT_PORT: ${MQTT_PORT:-1883}
  MQTT_USERNAME: ${MQTT_USERNAME}
  MQTT_PASSWORD: ${MQTT_PASSWORD}

services:

  message-processor-0:
    image: ghcr.io/brentio/skyfollower-message-processor:${SKYFOLLOWER_VERSION:-latest}
    restart: unless-stopped
    volumes:
      # Bind mount, matching rabbitmq/redis on the core host -- the data
      # directory stays directly readable by the operator on the host.
      - ./data/message-processor-0:/app/data
    # RAM-backed, not the container's writable layer -- the healthcheck
    # heartbeat file is rewritten every 15s and must never hit the host's
    # eMMC/SD storage the way /app/data (the active flight store) legitimately does.
    tmpfs:
      - /app/health
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # The prefix defaults to this node's hostname, written into .env by
    # scripts/download-host-files.sh, so two nodes each running several
    # processors never collide on an ID without anyone coordinating.
    environment:
      <<: *message-processor-environment
      MESSAGE_PROCESSOR_ID: ${MESSAGE_PROCESSOR_PREFIX:-mp}-0

  # To add a second message processor on this host, uncomment the block
  # below. No receiver is touched: a processor declares and binds its own
  # queue, and the exchange starts routing to it as soon as that binding
  # exists.
  #
  # message-processor-1:
  #   image: ghcr.io/brentio/skyfollower-message-processor:${SKYFOLLOWER_VERSION:-latest}
  #   restart: unless-stopped
  #   volumes:
  #     - ./data/message-processor-1:/app/data
  #   tmpfs:
  #     - /app/health
  #   healthcheck:
  #     test: ["CMD", "python", "/app/healthcheck.py"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 30s
  #   environment:
  #     <<: *message-processor-environment
  #     MESSAGE_PROCESSOR_ID: ${MESSAGE_PROCESSOR_PREFIX:-mp}-1
