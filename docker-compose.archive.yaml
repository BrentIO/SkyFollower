name: skyfollower-archive

# Interpolated from this host's .env (written by
# scripts/download-host-files.sh). Named one variable at a time rather than
# `env_file: .env`, so a container only ever holds the values it reads --
# the AWS credentials below in particular.
x-archive-environment: &archive-environment
  LOG_LEVEL: ${LOG_LEVEL:-info}
  S3_BUCKET: ${S3_BUCKET}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  MQTT_HOST: ${MQTT_HOST}
  MQTT_PORT: ${MQTT_PORT:-1883}
  MQTT_USERNAME: ${MQTT_USERNAME}
  MQTT_PASSWORD: ${MQTT_PASSWORD}

services:

  archive-processor:
    image: ghcr.io/brentio/skyfollower-archive:${SKYFOLLOWER_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *archive-environment
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-30}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
    volumes:
      # Bind mount, matching rabbitmq/redis on the core host -- the data
      # directory stays directly readable by the operator on the host.
      - ./data/archive-processor:/app/data
    # RAM-backed, not the container's writable layer -- the healthcheck
    # heartbeat file is rewritten every 15s and must never hit the host's
    # storage the way /app/data (the S3 fallback queue) legitimately does.
    tmpfs:
      - /app/health
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Archive Compaction — scheduled by its own ofelia instance, not the
  # core's (docker-compose.core.yaml). This job only needs S3
  # credentials, which already live on this host via archive-processor;
  # the core has no AWS-facing components today.
  # ---------------------------------------------------------------------------

  # No healthcheck -- a one-shot job that runs to completion and exits, not
  # a long-running service with a state to keep reporting on. It keeps a
  # profile of its own for the same reason: `up -d` must never start it,
  # while `docker compose run --rm archive-compaction` (a manual run,
  # outside the schedule) activates the profile by itself.
  archive-compaction:
    image: ghcr.io/brentio/skyfollower-archive-compaction:${SKYFOLLOWER_VERSION:-latest}
    container_name: skyfollower-archive-compaction
    profiles: ["compaction"]
    environment: *archive-environment
    volumes:
      # Bind mount, matching rabbitmq/redis on the core host -- the data
      # directory stays directly readable by the operator on the host.
      - ./data/archive-compaction:/app/data

  # Runs in label mode (`daemon --docker`), overriding the image's default
  # `daemon --config /etc/ofelia/config.ini` CMD. Ofelia requires job-run
  # definitions to live as labels on its own container, since each run
  # creates a brand new container rather than reusing an existing one --
  # and Compose interpolates ${...} inside label values, which Ofelia's
  # INI parser never did.
  #
  # No depends_on -- the job below creates a fresh, disposable container per
  # scheduled run from its `image` label, so no archive-compaction container
  # needs to exist beforehand. No profile either: the scheduler is a
  # long-running service that always belongs up, which is exactly why the
  # one-shot archive-compaction service above keeps a profile of its own.
  #
  # Ofelia 0.3.x's cron parser REQUIRES 6 fields with a leading seconds
  # value: "sec min hour dom month dow". Standard 5-field cron (no seconds)
  # is only auto-detected starting in Ofelia 0.4.x, which has never left
  # beta -- there is no stable tag to pin to instead. Keep the leading "0"
  # below (or whatever second is actually wanted) if this schedule changes.
  #
  # The schedule targets "the day before yesterday" (see
  # archive-compaction/README.md), so the exact time of day only needs to be
  # well after midnight UTC -- there's no upstream data source to wait on,
  # unlike the core host's runners.
  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: ["daemon", "--docker"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.enabled: "true"
      ofelia.job-run.archive-compaction.schedule: "0 50 4 * * *"
      ofelia.job-run.archive-compaction.image: "ghcr.io/brentio/skyfollower-archive-compaction:${SKYFOLLOWER_VERSION:-latest}"
      ofelia.job-run.archive-compaction.environment: '["LOG_LEVEL=${LOG_LEVEL:-info}", "S3_BUCKET=${S3_BUCKET}", "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}", "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}", "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}", "MQTT_HOST=${MQTT_HOST}", "MQTT_PORT=${MQTT_PORT:-1883}", "MQTT_USERNAME=${MQTT_USERNAME}", "MQTT_PASSWORD=${MQTT_PASSWORD}"]'
      ofelia.job-run.archive-compaction.delete: "true"
