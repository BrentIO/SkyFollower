name: skyfollower-receiver

# Interpolated from this host's .env (written by scripts/install.sh).
# Named one variable at a time rather than `env_file: .env`, so a container
# only ever holds the values it reads. RECEIVER_NAME / RECEIVER_SOURCES are
# not here: they differ per instance and come from each instance's own
# receivers/{name-slug}.env.
x-receiver-environment: &receiver-environment
  LOG_LEVEL: ${LOG_LEVEL:-info}
  RABBITMQ_HOST: ${RABBITMQ_HOST}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  MQTT_HOST: ${MQTT_HOST}
  MQTT_PORT: ${MQTT_PORT:-1883}
  MQTT_USERNAME: ${MQTT_USERNAME}
  MQTT_PASSWORD: ${MQTT_PASSWORD}
  # Optional -- unset REDIS_HOST disables identity claim/heartbeat, message
  # counters, and core-health registration entirely.
  REDIS_HOST: ${REDIS_HOST:-}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}

# Template every receiver instance extends. scripts/install.sh generates
# docker-compose.instances.yaml next to this file with one service per
# instance (container name, ./data/skyfollower-receiver-{name-slug} data
# directory, env_file ./receivers/{name-slug}.env), so this file holds no
# per-host content. deploy.replicas cannot substitute: replicas share one
# /app/data bind mount and have no per-replica RECEIVER_NAME.
services:
  receiver:
    profiles: ["template"]
    environment: *receiver-environment
    image: ghcr.io/brentio/skyfollower-receiver:${SKYFOLLOWER_VERSION:-latest}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # RAM-backed, not the container's writable layer -- the healthcheck
    # heartbeat file is rewritten every 15s and must never hit the host's
    # eMMC/SD storage the way /app/data (the fallback queue) legitimately does.
    tmpfs:
      - /app/health
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
