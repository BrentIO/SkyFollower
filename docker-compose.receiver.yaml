# No name: -- the Compose project name comes from COMPOSE_PROJECT_NAME in
# this host's .env, falling back to the deployment directory's own basename.
# That is what lets more than one receiver run on a single host: each gets
# its own folder, and therefore its own project namespace.

services:

  receiver:
    image: ghcr.io/brentio/skyfollower-receiver:${SKYFOLLOWER_VERSION:-latest}
    restart: unless-stopped
    # Named one by one from this host's .env rather than `env_file: .env`,
    # so a container only ever holds the values it actually reads.
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RECEIVER_NAME: ${RECEIVER_NAME}
      RECEIVER_SOURCES: ${RECEIVER_SOURCES}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      # Optional -- unset REDIS_HOST disables identity claim/heartbeat,
      # message counters, and core-health registration entirely.
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      # Bind mount, matching rabbitmq/redis on the core host -- the data
      # directory stays directly readable by the operator on the host.
      - ./data/receiver:/app/data
    # RAM-backed, not the container's writable layer -- the healthcheck
    # heartbeat file is rewritten every 15s and must never hit the host's
    # eMMC/SD storage the way /app/data (the fallback queue) legitimately does.
    tmpfs:
      - /app/health
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
