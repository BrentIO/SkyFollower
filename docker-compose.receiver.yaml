name: skyfollower-receiver

services:

  receiver:
    image: ghcr.io/brentio/skyfollower-receiver:latest
    restart: unless-stopped
    volumes:
      - ./config/receiver/settings.json:/app/settings.json:ro
      - receiver-queue:/app/data
    # RAM-backed, not the container's writable layer -- the healthcheck
    # heartbeat file is rewritten every 15s and must never hit the host's
    # eMMC/SD storage the way /app/data (the fallback queue) legitimately does.
    tmpfs:
      - /app/health
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/app/health/heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<40 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      RECEIVER_ID: "0"

volumes:
  receiver-queue:
