components:
  schemas:
    AircraftIcaoHexCondition:
      properties:
        type:
          type: string
          const: aircraft_icao_hex
          title: Type
        operator:
          type: string
          const: equals
          title: Operator
        value:
          type: string
          pattern: ^[0-9A-Fa-f]{6}$
          title: Value
      additionalProperties: false
      type: object
      required:
      - type
      - operator
      - value
      title: AircraftIcaoHexCondition
    AircraftPowerplantCountCondition:
      properties:
        type:
          type: string
          const: aircraft_powerplant_count
          title: Type
        operator:
          type: string
          enum:
          - equals
          - minimum
          - maximum
          title: Operator
        value:
          type: string
          pattern: ^([0-9]|[1-9][0-9])$
          title: Value
          description: Number of engines, as a string. Must be an integer 0-99.
      additionalProperties: false
      type: object
      required:
      - type
      - operator
      - value
      title: AircraftPowerplantCountCondition
    AircraftRecord:
      properties:
        icao_hex:
          type: string
          title: Icao Hex
        registration:
          anyOf:
          - type: string
          - type: 'null'
          title: Registration
        type_designator:
          anyOf:
          - type: string
          - type: 'null'
          title: Type Designator
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        manufacturer:
          anyOf:
          - type: string
          - type: 'null'
          title: Manufacturer
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        manufacturer_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Manufacturer Model
        seats:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seats
        powerplant:
          anyOf:
          - $ref: '#/components/schemas/PowerplantInfo'
          - type: 'null'
        military:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Military
        operator:
          anyOf:
          - type: string
          - type: 'null'
          title: Operator
        airline_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Airline Code
        serial_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Serial Number
        manufactured_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Manufactured Date
        is_private_operator:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Private Operator
        registrant:
          anyOf:
          - $ref: '#/components/schemas/RegistrantInfo'
          - type: 'null'
        special_livery:
          anyOf:
          - type: string
          - type: 'null'
          title: Special Livery
        data_sources:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Data Sources
      type: object
      required:
      - icao_hex
      title: AircraftRecord
      description: 'Aircraft registration and type enrichment.

        Written across three Redis keys — aircraft:mictronics:{icao_hex}

        (Mictronics), aircraft:registry:{icao_hex} (country registry runners),

        and aircraft:livery:{icao_hex} (the airportwebcams-special-liveries runner)
        —

        and deep-merged at read time by shared/lua/merge_aircraft.lua, with

        later sources in that list winning on any field overlap. This shape is

        the merged result. Field names match the AROI /registration/icao_hex/{hex}

        response.'
    AircraftRegistrationCondition:
      properties:
        type:
          type: string
          const: aircraft_registration
          title: Type
        operator:
          type: string
          const: equals
          title: Operator
        value:
          type: string
          pattern: ^[0-9A-Za-z][0-9A-Za-z-]*[0-9A-Za-z]$
          title: Value
      additionalProperties: false
      type: object
      required:
      - type
      - operator
      - value
      title: AircraftRegistrationCondition
    AircraftTypeDesignatorCondition:
      properties:
        type:
          type: string
          const: aircraft_type_designator
          title: Type
        operator:
          type: string
          const: equals
          title: Operator
        value:
          type: string
          title: Value
      additionalProperties: false
      type: object
      required:
      - type
      - operator
      - value
      title: AircraftTypeDesignatorCondition
    AirportRecord:
      properties:
        icao_code:
