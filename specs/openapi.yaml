openapi: 3.1.0
info:
  title: SkyFollower Management
  description: Rules and areas configuration API. Message processors poll config:rules/config:areas
    in Redis every 30 seconds for changes written here.
  version: 9999.99.99
paths:
  /api/rules:
    get:
      tags:
      - rules
      summary: List Rules
      operationId: list_rules_api_rules_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Rule'
                type: array
                title: Response List Rules Api Rules Get
        '500':
          description: Redis error
    post:
      tags:
      - rules
      summary: Create Rule
      operationId: create_rule_api_rules_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rule'
            examples:
              All aircraft below 10,000:
                value: &id001
                  name: All aircraft below 10,000
                  description: Any aircraft with an altitude at or below 10,000ft
                  identifier: acft_10k_and_below
                  enabled: true
                  conditions:
                  - type: altitude
                    operator: maximum
                    value: '10000'
              UAL B757-200:
                value: &id002
                  name: UAL B757-200
                  description: United Airlines Boeing 757-200's between 12,000 and
                    15,000ft heading north after takeoff
                  identifier: Northbound_United_B75s_12k-15k
                  enabled: true
                  conditions:
                  - type: altitude
                    operator: maximum
                    value: '15000'
                  - type: altitude
                    operator: minimum
                    value: '12000'
                  - type: operator_airline_designator
                    operator: equals
                    value: UAL
                  - type: aircraft_type_designator
                    operator: equals
                    value: B752
                  - type: heading
                    operator: equals
                    value: 340,020
                  - type: vertical_speed
                    operator: minimum
                    value: '500'
              Grandma's Flight Home:
                value: &id003
                  name: Grandma's Flight Home
                  description: Grandma's Flight Home Arriving on Christmas Eve
                  identifier: grandma
                  enabled: true
                  conditions:
                  - type: ident
                    operator: equals
                    value: DAL2
                  - type: date
                    operator: minimum
                    value: '2022-12-24'
                  - type: date
                    operator: maximum
                    value: '2022-12-24'
                  - type: area
                    operator: equals
                    value: LI
              B-52 Force Persist Window:
                value: &id004
                  name: B-52 Force Persist Window
                  description: Any B-52 (aircraft_type_designator B52) seen between
                    2026-01-16 04:31 UTC and 2027-06-27 18:50 UTC, force-archived
                    even if the flight would otherwise be skipped for being MLAT-only
                  identifier: b52_force_persist_2026_2027
                  enabled: true
                  force_archive: true
                  conditions:
                  - type: aircraft_type_designator
                    operator: equals
                    value: B52
                  - type: date
                    operator: minimum
                    value: 2026-01-16T04:31Z
                  - type: date
                    operator: maximum
                    value: 2027-06-27T18:50Z
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
              examples:
                All aircraft below 10,000:
                  value: *id001
                UAL B757-200:
                  value: *id002
                Grandma's Flight Home:
                  value: *id003
                B-52 Force Persist Window:
                  value: *id004
        '409':
          description: Identifier already exists
        '400':
          description: Validation error
        '500':
          description: Redis error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/rules/{identifier}:
    get:
      tags:
      - rules
      summary: Get Rule
      operationId: get_rule_api_rules__identifier__get
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          title: Identifier
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
              examples:
                All aircraft below 10,000:
                  value: *id001
                UAL B757-200:
                  value: *id002
                Grandma's Flight Home:
                  value: *id003
                B-52 Force Persist Window:
                  value: *id004
        '404':
          description: Not found
        '500':
          description: Redis error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - rules
      summary: Update Rule
      operationId: update_rule_api_rules__identifier__put
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          title: Identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rule'
            examples:
              All aircraft below 10,000:
                value: *id001
              UAL B757-200:
                value: *id002
              Grandma's Flight Home:
                value: *id003
              B-52 Force Persist Window:
                value: *id004
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
              examples:
                All aircraft below 10,000:
                  value: *id001
                UAL B757-200:
                  value: *id002
                Grandma's Flight Home:
                  value: *id003
                B-52 Force Persist Window:
                  value: *id004
        '404':
          description: Not found
        '400':
          description: Validation error
        '500':
          description: Redis error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - rules
      summary: Delete Rule
      operationId: delete_rule_api_rules__identifier__delete
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          title: Identifier
      responses:
        '204':
          description: Successful Response
        '404':
          description: Not found
        '400':
          description: Validation error
        '500':
          description: Redis error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/areas:
    get:
      tags:
      - areas
      summary: List Areas
      operationId: list_areas_api_areas_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Area'
                type: array
                title: Response List Areas Api Areas Get
        '500':
          description: Redis error
    post:
      tags:
      - areas
      summary: Create Area
      operationId: create_area_api_areas_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Area'
            examples:
              Long Island (LI):
                value: &id005
                  identifier: LI
                  name: Long Island
                  geometry:
                    type: Polygon
                    coordinates:
                    - - - -73.8006591796875
                        - 40.82835864973048
                      - - -73.97369384765625
                        - 40.734770989672406
                      - - -74.03961181640625
                        - 40.54720023441049
                      - - -73.7677001953125
                        - 40.538851525354666
                      - - -73.245849609375
                        - 40.58684239087908
                      - - -72.70751953125
                        - 40.73685214795608
                      - - -71.8560791015625
                        - 40.97160353279909
                      - - -71.80938720703125
                        - 41.044145364313174
                      - - -71.89727783203125
                        - 41.14970617453726
                      - - -72.11700439453125
                        - 41.21998578493921
                      - - -72.36145019531249
                        - 41.17038447781618
                      - - -72.70477294921874
                        - 41.03585891144301
                      - - -72.83935546875
                        - 41.04621681452063
                      - - -73.1964111328125
                        - 40.994410999439516
                      - - -73.553466796875
                        - 40.94671366508002
                      - - -73.8006591796875
                        - 40.82835864973048
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
              examples:
                Long Island (LI):
                  value: *id005
        '409':
          description: Identifier already exists
        '400':
          description: Validation error
        '500':
          description: Redis error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/areas/{identifier}:
    get:
      tags:
      - areas
      summary: Get Area
      operationId: get_area_api_areas__identifier__get
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          title: Identifier
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
              examples:
                Long Island (LI):
                  value: *id005
        '404':
          description: Not found
        '500':
          description: Redis error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - areas
      summary: Update Area
      operationId: update_area_api_areas__identifier__put
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          title: Identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Area'
            examples:
              Long Island (LI):
                value: *id005
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
              examples:
                Long Island (LI):
                  value: *id005
        '404':
          description: Not found
        '400':
          description: Validation error
        '500':
          description: Redis error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - areas
      summary: Delete Area
      operationId: delete_area_api_areas__identifier__delete
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          title: Identifier
      responses:
        '204':
          description: Successful Response
        '404':
          description: Not found
        '400':
          description: Validation error
        '500':
          description: Redis error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Area:
      properties:
        identifier:
          type: string
          pattern: ^\S+$
          title: Identifier
        name:
          type: string
          title: Name
          default: ''
        geometry:
          $ref: '#/components/schemas/AreaGeometry'
      type: object
      required:
      - identifier
      - geometry
      title: Area
      description: 'A named GeoJSON polygon area, referenced by rules'' `area` condition

        (matched against `identifier`, not `name`). `identifier` is the routing

        key used in /api/areas/{identifier} and must not contain spaces; `name`

        is a free-text display label and may.'
      examples:
      - geometry:
          coordinates:
          - - - -73.8006591796875
              - 40.82835864973048
            - - -73.97369384765625
              - 40.734770989672406
            - - -74.03961181640625
              - 40.54720023441049
            - - -73.7677001953125
              - 40.538851525354666
            - - -73.245849609375
              - 40.58684239087908
            - - -72.70751953125
              - 40.73685214795608
            - - -71.8560791015625
              - 40.97160353279909
            - - -71.80938720703125
              - 41.044145364313174
            - - -71.89727783203125
              - 41.14970617453726
            - - -72.11700439453125
              - 41.21998578493921
            - - -72.36145019531249
              - 41.17038447781618
            - - -72.70477294921874
              - 41.03585891144301
            - - -72.83935546875
              - 41.04621681452063
            - - -73.1964111328125
              - 40.994410999439516
            - - -73.553466796875
              - 40.94671366508002
            - - -73.8006591796875
              - 40.82835864973048
          type: Polygon
        identifier: LI
        name: Long Island
    AreaGeometry:
      properties:
        type:
          type: string
          const: Polygon
          title: Type
        coordinates:
          items:
            items:
              items:
                type: number
              type: array
            type: array
          type: array
          title: Coordinates
      type: object
      required:
      - type
      - coordinates
      title: AreaGeometry
    Condition:
      properties:
        type:
          type: string
          enum:
          - altitude
          - heading
          - velocity
          - vertical_speed
          - area
          - date
          - ident
          - squawk
          - military
          - operator_airline_designator
          - aircraft_type_designator
          - aircraft_registration
          - aircraft_icao_hex
          - aircraft_powerplant_count
          - wake_turbulence_category
          - matched_rules
          title: Type
        operator:
          type: string
          enum:
          - equals
          - minimum
          - maximum
          - in_list
          - not_in_list
          title: Operator
        value:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          title: Value
      type: object
      required:
      - type
      - operator
      - value
      title: Condition
      description: 'One rule condition; every condition in a rule is AND''d together.

        `value`''s shape depends on `type` -- see CLAUDE.md''s Conditions table.

        Matching SkyFollower-legacy''s convention, this is a string even for

        numeric fields (altitude "10000", heading "340,020" for min,max

        wrap-around, military "true"/"false") -- matched_rules is the one

        exception, taking a real list of rule identifiers.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Rule:
      properties:
        name:
          type: string
          title: Name
          default: ''
        description:
          type: string
          title: Description
          default: ''
        identifier:
          type: string
          pattern: ^\S+$
          title: Identifier
        enabled:
          type: boolean
          title: Enabled
        force_archive:
          type: boolean
          title: Force Archive
          default: false
        conditions:
          items:
            $ref: '#/components/schemas/Condition'
          type: array
          minItems: 1
          title: Conditions
      type: object
      required:
      - identifier
      - enabled
      - conditions
      title: Rule
      description: 'A notification rule. Fires at most once per flight per `identifier`.

        `identifier` is the routing key used in /api/rules/{identifier} and must

        not contain spaces; `name` is a free-text display label and may.

        Documents the shape of a normal (enabled) rule -- the rules engine

        additionally tolerates a disabled placeholder rule with only

        `enabled: false` and nothing else, silently skipping it rather than

        validating it; that leniency is a narrow exception, not reflected here.'
      examples:
      - conditions:
        - operator: maximum
          type: altitude
          value: '10000'
        description: Any aircraft with an altitude at or below 10,000ft
        enabled: true
        identifier: acft_10k_and_below
        name: All aircraft below 10,000
      - conditions:
        - operator: maximum
          type: altitude
          value: '15000'
        - operator: minimum
          type: altitude
          value: '12000'
        - operator: equals
          type: operator_airline_designator
          value: UAL
        - operator: equals
          type: aircraft_type_designator
          value: B752
        - operator: equals
          type: heading
          value: 340,020
        - operator: minimum
          type: vertical_speed
          value: '500'
        description: United Airlines Boeing 757-200's between 12,000 and 15,000ft
          heading north after takeoff
        enabled: true
        identifier: Northbound_United_B75s_12k-15k
        name: UAL B757-200
      - conditions:
        - operator: equals
          type: ident
          value: DAL2
        - operator: minimum
          type: date
          value: '2022-12-24'
        - operator: maximum
          type: date
          value: '2022-12-24'
        - operator: equals
          type: area
          value: LI
        description: Grandma's Flight Home Arriving on Christmas Eve
        enabled: true
        identifier: grandma
        name: Grandma's Flight Home
      - conditions:
        - operator: equals
          type: aircraft_type_designator
          value: B52
        - operator: minimum
          type: date
          value: 2026-01-16T04:31Z
        - operator: maximum
          type: date
          value: 2027-06-27T18:50Z
        description: Any B-52 (aircraft_type_designator B52) seen between 2026-01-16
          04:31 UTC and 2027-06-27 18:50 UTC, force-archived even if the flight would
          otherwise be skipped for being MLAT-only
        enabled: true
        force_archive: true
        identifier: b52_force_persist_2026_2027
        name: B-52 Force Persist Window
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError

