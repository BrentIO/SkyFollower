openapi: 3.1.0
info:
  title: SkyFollower Management UI Backend
  description: Rules and areas configuration API. Message processors poll config:rules/config:areas
    in Redis every 5 seconds for changes written here.
  version: 9999.99.99
paths:
  /api/rules:
    get:
      tags:
      - rules
      summary: Get Rules
      operationId: get_rules_api_rules_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Rule'
                type: array
                title: Response Get Rules Api Rules Get
        '204':
          description: No configuration saved yet
        '500':
          description: Redis error
    put:
      tags:
      - rules
      summary: Put Rules
      operationId: put_rules_api_rules_put
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Rule'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Rule'
                type: array
                title: Response Put Rules Api Rules Put
        '400':
          description: Validation error
        '500':
          description: Redis error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/areas:
    get:
      tags:
      - areas
      summary: Get Areas
      operationId: get_areas_api_areas_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaFeatureCollection'
        '204':
          description: No configuration saved yet
        '500':
          description: Redis error
    put:
      tags:
      - areas
      summary: Put Areas
      operationId: put_areas_api_areas_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaFeatureCollection'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaFeatureCollection'
        '400':
          description: Validation error
        '500':
          description: Redis error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AreaFeature:
      properties:
        type:
          type: string
          const: Feature
          title: Type
          default: Feature
        properties:
          $ref: '#/components/schemas/AreaFeatureProperties'
        geometry:
          $ref: '#/components/schemas/AreaGeometry'
      type: object
      required:
      - properties
      - geometry
      title: AreaFeature
    AreaFeatureCollection:
      properties:
        type:
          type: string
          const: FeatureCollection
          title: Type
          default: FeatureCollection
        features:
          items:
            $ref: '#/components/schemas/AreaFeature'
          type: array
          title: Features
          default: []
      type: object
      title: AreaFeatureCollection
      description: Named GeoJSON polygon areas, referenced by the `area` condition
        type.
    AreaFeatureProperties:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: AreaFeatureProperties
    AreaGeometry:
      properties:
        type:
          type: string
          const: Polygon
          title: Type
        coordinates:
          items:
            items:
              items:
                type: number
              type: array
            type: array
          type: array
          title: Coordinates
      type: object
      required:
      - type
      - coordinates
      title: AreaGeometry
    Condition:
      properties:
        type:
          type: string
          enum:
          - altitude
          - heading
          - velocity
          - vertical_speed
          - area
          - date
          - ident
          - squawk
          - military
          - operator_airline_designator
          - aircraft_type_designator
          - aircraft_registration
          - aircraft_icao_hex
          - aircraft_powerplant_count
          - wake_turbulence_category
          - matched_rules
          title: Type
        operator:
          type: string
          enum:
          - equals
          - minimum
          - maximum
          - in_list
          - not_in_list
          title: Operator
        value:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          title: Value
      type: object
      required:
      - type
      - operator
      - value
      title: Condition
      description: 'One rule condition; every condition in a rule is AND''d together.

        `value`''s shape depends on `type` -- see CLAUDE.md''s Conditions table.

        Matching SkyFollower-legacy''s convention, this is a string even for

        numeric fields (altitude "10000", heading "340,020" for min,max

        wrap-around, military "true"/"false") -- matched_rules is the one

        exception, taking a real list of rule identifiers.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Rule:
      properties:
        name:
          type: string
          title: Name
          default: ''
        description:
          type: string
          title: Description
          default: ''
        identifier:
          type: string
          title: Identifier
        enabled:
          type: boolean
          title: Enabled
        force_archive:
          type: boolean
          title: Force Archive
          default: false
        conditions:
          items:
            $ref: '#/components/schemas/Condition'
          type: array
          minItems: 1
          title: Conditions
      type: object
      required:
      - identifier
      - enabled
      - conditions
      title: Rule
      description: 'A notification rule. Fires at most once per flight per `identifier`.

        Documents the shape of a normal (enabled) rule -- the rules engine

        additionally tolerates a disabled placeholder rule with only

        `enabled: false` and nothing else, silently skipping it rather than

        validating it; that leniency is a narrow exception, not reflected here.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError

