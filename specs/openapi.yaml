  /api/aircraft:
    get:
      tags:
      - reference-data
      summary: Get Aircraft
      operationId: get_aircraft_api_aircraft_get
      parameters:
      - name: icao_hex
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 6-character ICAO hex, e.g. A8AE7F
          title: Icao Hex
        description: 6-character ICAO hex, e.g. A8AE7F
      - name: registration
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Aircraft registration, e.g. N659DL
          title: Registration
        description: Aircraft registration, e.g. N659DL
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AircraftRecord'
        '404':
