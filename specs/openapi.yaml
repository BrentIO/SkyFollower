                      - - -74.03961181640625
                        - 40.54720023441049
                      - - -73.7677001953125
                        - 40.538851525354666
                      - - -73.245849609375
                        - 40.58684239087908
                      - - -72.70751953125
                        - 40.73685214795608
                      - - -71.8560791015625
                        - 40.97160353279909
                      - - -71.80938720703125
                        - 41.044145364313174
                      - - -71.89727783203125
                        - 41.14970617453726
                      - - -72.11700439453125
                        - 41.21998578493921
