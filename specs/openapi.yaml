openapi: 3.1.0
info:
  title: SkyFollower Management
  description: Rules/areas configuration API (writes config:rules/config:areas in
    Redis, read by every message processor) plus read-only reference-data lookups
    (aircraft/operator/airport/route) over the same enrichment Redis already holds
    for rule evaluation.
  version: 9999.99.99
paths:
  /api/rules:
    get:
      tags:
      - rules
      summary: List Rules
      operationId: list_rules_api_rules_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Rule'
                type: array
                title: Response List Rules Api Rules Get
        '500':
          description: Redis error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
    post:
      tags:
      - rules
      summary: Create Rule
      operationId: create_rule_api_rules_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rule'
            examples:
              All aircraft below 10,000:
                value: &id001
                  name: All aircraft below 10,000
                  description: Any aircraft with an altitude at or below 10,000ft
                  identifier: acft_10k_and_below
                  enabled: true
                  conditions:
                  - type: altitude
                    operator: maximum
                    value: '10000'
              UAL B757-200:
                value: &id002
                  name: UAL B757-200
                  description: United Airlines Boeing 757-200's between 12,000 and
                    15,000ft heading north after takeoff
                  identifier: Northbound_United_B75s_12k-15k
                  enabled: true
                  conditions:
                  - type: altitude
                    operator: maximum
                    value: '15000'
                  - type: altitude
                    operator: minimum
                    value: '12000'
                  - type: operator_airline_designator
                    operator: equals
                    value: UAL
                  - type: aircraft_type_designator
                    operator: equals
                    value: B752
                  - type: heading
                    operator: equals
                    value: 340,020
                  - type: vertical_speed
                    operator: minimum
                    value: '500'
              Grandma's Flight Home:
                value: &id003
                  name: Grandma's Flight Home
                  description: Grandma's Flight Home Arriving on Christmas Eve
                  identifier: grandma
                  enabled: true
                  conditions:
                  - type: ident
                    operator: equals
                    value: DAL2
                  - type: date
                    operator: minimum
                    value: '2022-12-24'
                  - type: date
                    operator: maximum
                    value: '2022-12-24'
                  - type: area
                    operator: equals
                    value: LI
              B-52 Force Persist Window:
                value: &id004
                  name: B-52 Force Persist Window
                  description: Any B-52 (aircraft_type_designator B52) seen between
                    2026-01-15 11:31 PM EST and 2027-06-27 2:50 PM EDT (entered in
                    US Eastern time, stored as UTC -- note the date rolls back a day
                    for the first one), force-archived even if the flight would otherwise
                    be skipped for being MLAT-only
                  identifier: b52_force_persist_2026_2027
                  enabled: true
                  force_archive: true
                  conditions:
                  - type: aircraft_type_designator
                    operator: equals
                    value: B52
                  - type: date
                    operator: minimum
                    value: 2026-01-16T04:31Z
                  - type: date
                    operator: maximum
                    value: 2027-06-27T18:50Z
              Air Force One overhead, verified via 1090:
                value: &id005
                  name: Air Force One overhead, verified via 1090
                  description: ADFDF8 (Air Force One) force-archived only when actually
                    received via 1090MHz ADS-B, not merely via MLAT -- it often suppresses
                    its position and is then only visible via MLAT triangulation,
                    which doesn't imply it's actually nearby. If it isn't showing
                    up on 1090, skip the force-archive and let the normal MLAT-only
                    archive skip apply.
                  identifier: af1_1090_verified
                  enabled: true
                  force_archive: true
                  conditions:
                  - type: aircraft_icao_hex
                    operator: equals
                    value: ADFDF8
                  - type: receiver_source
                    operator: equals
                    value:
                    - '1090'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
              examples:
                All aircraft below 10,000:
                  value: *id001
                UAL B757-200:
                  value: *id002
                Grandma's Flight Home:
                  value: *id003
                B-52 Force Persist Window:
                  value: *id004
                Air Force One overhead, verified via 1090:
                  value: *id005
        '409':
          description: Identifier already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Rule has no conditions:
                  value: &id006
                    detail: 'Rule #0 invalid: rule ''bad-rule'' has no conditions'
                Identifier contains spaces:
                  value: &id007
                    detail: 'Rule #0 invalid: identifier ''my rule'' must be non-empty
                      and contain no spaces'
        '500':
          description: Redis error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/rules/{identifier}:
