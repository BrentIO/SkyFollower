            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
              examples:
                All aircraft below 10,000:
                  value: *id001
                UAL B757-200:
                  value: *id002
                Grandma's Flight Home:
                  value: *id003
                B-52 Force Persist Window:
                  value: *id004
                Air Force One overhead, verified via 1090:
                  value: *id005
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '500':
          description: Redis error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - rules
      summary: Update Rule
      operationId: update_rule_api_rules__identifier__put
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          title: Identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rule'
            examples:
              All aircraft below 10,000:
                value: *id001
              UAL B757-200:
                value: *id002
              Grandma's Flight Home:
                value: *id003
              B-52 Force Persist Window:
                value: *id004
              Air Force One overhead, verified via 1090:
                value: *id005
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
              examples:
                All aircraft below 10,000:
                  value: *id001
                UAL B757-200:
                  value: *id002
                Grandma's Flight Home:
                  value: *id003
                B-52 Force Persist Window:
                  value: *id004
                Air Force One overhead, verified via 1090:
                  value: *id005
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Rule has no conditions:
                  value: *id006
                Identifier contains spaces:
                  value: *id007
        '500':
          description: Redis error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - rules
      summary: Delete Rule
      operationId: delete_rule_api_rules__identifier__delete
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          title: Identifier
      responses:
        '204':
          description: Successful Response
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '500':
          description: Redis error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
