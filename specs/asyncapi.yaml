components:

  # ---------------------------------------------------------------------------
  # Messages
  # ---------------------------------------------------------------------------

  messages:

    StatusMessage:
      name: StatusMessage
      title: Component status
      summary: LWT-pattern ONLINE / OFFLINE indicator, retained
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/StatusPayload'

    ReceiverMessagesPerSecondMessage:
      name: ReceiverMessagesPerSecondMessage
      title: Receiver per-connection message rate
      summary: Average message rate for one sources[] connection since last report
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverMessagesPerSecond'

    ReceiverConnectionConnectedMessage:
      name: ReceiverConnectionConnectedMessage
      title: Receiver per-connection connected state
      summary: Whether the TCP connection to one sources[] entry's readsb instance is currently open
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverConnectionConnected'

    ReceiverConnectionReconnectCountMessage:
      name: ReceiverConnectionReconnectCountMessage
      title: Receiver per-connection reconnect count
      summary: Number of times one sources[] connection has dropped and been re-established since process start
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverConnectionReconnectCount'

    ReceiverConnectionMessagesTotalHourMessage:
      name: ReceiverConnectionMessagesTotalHourMessage
      title: Receiver per-connection message count (hour)
      summary: Cumulative message count for one sources[] connection since the current UTC hour began
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverConnectionMessagesTotalHour'

    ReceiverConnectionMessagesTotalTodayMessage:
      name: ReceiverConnectionMessagesTotalTodayMessage
      title: Receiver per-connection message count (today)
      summary: Cumulative message count for one sources[] connection since the current UTC day began
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverConnectionMessagesTotalToday'

    ReceiverConnectionMessagesTotalLifetimeMessage:
      name: ReceiverConnectionMessagesTotalLifetimeMessage
      title: Receiver per-connection message count (lifetime)
      summary: Cumulative message count for one sources[] connection since this process started
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverConnectionMessagesTotalLifetime'

    ReceiverConnectionConnectedAttributesMessage:
      name: ReceiverConnectionConnectedAttributesMessage
      title: Receiver per-connection _connected sensor JSON attributes
      summary: JSON attributes (last_message_received) for one sources[] connection's _connected sensor
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReceiverConnectionConnectedAttributes'

    ReceiverLocalQueueDepthMessage:
      name: ReceiverLocalQueueDepthMessage
      title: Receiver local queue depth
      summary: Messages queued in the local SQLite fallback (queue.db)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverLocalQueueDepth'

    ReceiverDeadLetterQueueDepthMessage:
      name: ReceiverDeadLetterQueueDepthMessage
      title: Receiver dead-letter queue depth
      summary: Messages dead-lettered from the local SQLite fallback after repeatedly failing to publish
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverDeadLetterQueueDepth'

    ReceiverRabbitmqConnectedMessage:
      name: ReceiverRabbitmqConnectedMessage
      title: Receiver RabbitMQ connectivity
      summary: Whether the receiver has an active RabbitMQ connection
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverRabbitmqConnected'

    ReceiverStartedAtMessage:
      name: ReceiverStartedAtMessage
      title: Receiver process start time
      summary: UTC ISO-8601 timestamp of process start
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverStartedAt'

    ReceiverVersionMessage:
      name: ReceiverVersionMessage
      title: Receiver running image version
      summary: Running image version, from the VERSION environment variable
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverVersion'

    MessageProcessorMessagesPerSecondMessage:
      name: MessageProcessorMessagesPerSecondMessage
      title: Message Processor message rate
      summary: Average message processing rate since last report
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorMessagesPerSecond'

    MessageProcessorProcessingTimeHwmMsMessage:
      name: MessageProcessorProcessingTimeHwmMsMessage
      title: Message Processor processing time high-water mark
      summary: End-to-end message processing time high-water mark since last publish
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorProcessingTimeHwmMs'

    MessageProcessorMessageLatencyHwmMsMessage:
      name: MessageProcessorMessageLatencyHwmMsMessage
      title: Message Processor message latency high-water mark
      summary: Receipt-through-processed latency high-water mark since last publish, including RabbitMQ queue wait time
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorMessageLatencyHwmMs'

    MessageProcessorRulesEngineHwmNsMessage:
      name: MessageProcessorRulesEngineHwmNsMessage
      title: Message Processor rules engine duration high-water mark (nanoseconds)
      summary: Rules engine duration high-water mark since last publish, in nanoseconds
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorRulesEngineHwmNs'

    MessageProcessorLocalArchiveQueueDepthMessage:
      name: MessageProcessorLocalArchiveQueueDepthMessage
      title: Message Processor local archive queue depth
      summary: Completed flights queued in the local SQLite fallback (completed_flights.db)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorLocalArchiveQueueDepth'

    MessageProcessorDeadLetterQueueDepthMessage:
      name: MessageProcessorDeadLetterQueueDepthMessage
      title: Message Processor dead-letter queue depth
      summary: Completed flights dead-lettered from the local SQLite archive fallback after repeatedly failing to publish
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorDeadLetterQueueDepth'

    MessageProcessorRegistrationMissesHourMessage:
      name: MessageProcessorRegistrationMissesHourMessage
