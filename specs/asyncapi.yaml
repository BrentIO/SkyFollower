    MapUdpHeartbeatMessage:
      name: MapUdpHeartbeatMessage
      title: Map UDP heartbeat datagram
      summary: Fixed 5s liveness beacon, skipped whenever position/metadata traffic already covered the window
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MapUdpHeartbeat'

    MapWsPositionMessage:
      name: MapWsPositionMessage
      title: Map WebSocket position event
      summary: Live relay of an accepted UDP `position` update
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MapWsPosition'

    MapWsMetadataMessage:
      name: MapWsMetadataMessage
      title: Map WebSocket metadata event
      summary: Live relay of an accepted UDP `metadata` update, broadened to the aircraft's full merged current-state
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MapWsMetadata'

    MapWsStaleMessage:
      name: MapWsStaleMessage
      title: Map WebSocket stale event
      summary: An aircraft's liveness sentinel expired; its detail record is still held
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MapWsStale'

    MapWsHideMessage:
      name: MapWsHideMessage
      title: Map WebSocket hide event
      summary: An aircraft's visibility sentinel expired; drop it from view but keep its record and trail
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MapWsHide'

    MapWsRemoveMessage:
      name: MapWsRemoveMessage
      title: Map WebSocket remove event
      summary: An aircraft's detail record expired; clients should drop it entirely
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MapWsRemove'

    RunnerRecordsImportedMessage:
      name: RunnerRecordsImportedMessage
      title: Data runner records imported
      summary: Number of records written to Redis during this run
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/RunnerRecordsImported'

    RunnerLastRunAtMessage:
      name: RunnerLastRunAtMessage
      title: Data runner last run at
      summary: UTC ISO-8601 timestamp when the run completed
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/RunnerLastRunAt'

    RunnerLastRunStatusMessage:
      name: RunnerLastRunStatusMessage
      title: Data runner last run status
      summary: Outcome of the run
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/RunnerLastRunStatus'

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------

  schemas:

    StatusPayload:
      type: string
      enum: [ONLINE, OFFLINE]
      description: >
        Component liveness indicator. ONLINE published on connect (retained);
        OFFLINE sent as LWT when the connection drops (retained).

    ComponentStartedAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp of process start; never changes after startup
      example: "2026-01-15T10:00:00+00:00"

    ComponentVersion:
      type: string
      description: Running image version, from the VERSION environment variable ("dev" if unset)
      example: "2026.08.01"

    ReceiverMessagesPerSecond:
      type: number
      description: Average message rate for one sources[] connection since last report (messages received ÷ elapsed seconds)
      example: 12.4

    ReceiverConnectionConnected:
      type: boolean
      description: True when the TCP connection to one sources[] entry's readsb instance is currently open
      example: true

    ReceiverConnectionReconnectCount:
      type: integer
      description: Number of times one sources[] connection has dropped and been re-established since process start
      example: 0

    ReceiverConnectionMessagesTotalHour:
      type: integer
      description: >
        Cumulative message count for one sources[] connection since the
        current UTC hour began. Only published when REDIS_HOST is
        configured; Redis-backed and published by core-health, so it is
        cross-restart-durable and resets only at the real UTC boundary.
      example: 214

    ReceiverConnectionMessagesTotalToday:
      type: integer
      description: >
        Cumulative message count for one sources[] connection since the
        current UTC day began. Only published when REDIS_HOST is
        configured; Redis-backed and published by core-health, so it is
        cross-restart-durable and resets only at the real UTC boundary.
      example: 8452

    ReceiverConnectionMessagesTotalLifetime:
      type: integer
      description: >
        Cumulative message count for one sources[] connection since this
        receiver process started -- not since the receiver was first
        installed. An in-memory figure the receiver publishes directly,
        never Redis-backed, so it resets to zero on every receiver restart
        by design. Published regardless of whether REDIS_HOST is set.
      example: 193822

    ReceiverConnectionConnectedAttributes:
      type: object
      description: JSON attributes for one sources[] connection's _connected sensor
      properties:
        last_message_received:
          type: string
          format: date-time
          description: UTC ISO-8601 timestamp of the last message processed for one sources[] connection
          example: "2026-01-15T10:00:00+00:00"

    ReceiverLocalQueueDepth:
      type: integer
      description: Number of messages queued in the local SQLite fallback (queue.db)
      example: 0

    ReceiverDeadLetterQueueDepth:
      type: integer
      description: Number of messages dead-lettered from the local SQLite fallback (dead_letters/queue/ in data_dir) after repeatedly failing to publish
      example: 0

    ReceiverRabbitmqConnected:
      type: boolean
      description: True when the receiver has an active RabbitMQ connection
      example: true

    ReceiverStartedAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp of process start
      example: "2026-01-15T10:00:00+00:00"

    ReceiverVersion:
      type: string
      description: Running image version, from the VERSION environment variable ("dev" if unset)
      example: "2026.08.01"

    MessageProcessorMessagesPerSecond:
      type: number
      description: Average message processing rate since last report (messages received ÷ elapsed seconds)
      example: 45.1

    MessageProcessorProcessingTimeHwmMs:
      type: number
      description: End-to-end message processing time high-water mark since last publish; resets on publish
      example: 12.3

    MessageProcessorMessageLatencyHwmMs:
      type: number
      description: Receipt-through-processed latency high-water mark since last publish, including RabbitMQ queue wait time (superset of MessageProcessorProcessingTimeHwmMs); wall-clock based, sensitive to NTP drift between hosts; resets on publish
      example: 340.7

    MessageProcessorRulesEngineHwmNs:
      type: number
      description: Rules engine duration high-water mark since last publish, in nanoseconds; resets on publish
      example: 45000

    MessageProcessorLocalArchiveQueueDepth:
      type: integer
      description: Number of completed flights queued in the local SQLite fallback (completed_flights.db)
      example: 0

    MessageProcessorDeadLetterQueueDepth:
      type: integer
      description: Number of completed flights dead-lettered from the local SQLite archive fallback (dead_letters/queue/ in data_dir) after repeatedly failing to publish
      example: 0

    MessageProcessorRegistrationMissesHour:
      type: integer
      description: Aircraft enrichment (registration) Redis cache misses this hour
      example: 2

    MessageProcessorRegistrationMissesToday:
      type: integer
      description: Aircraft enrichment (registration) Redis cache misses today (UTC)
      example: 14

    MessageProcessorRegistrationMissesLifetime:
      type: integer
      description: Aircraft enrichment (registration) Redis cache misses since this process instance started
      example: 214

    MessageProcessorOperatorMissesToday:
      type: integer
      description: operator:{designator} Redis lookup misses today (UTC)
      example: 5

    MessageProcessorOperatorMissesLifetime:
      type: integer
      description: operator:{designator} Redis lookup misses since this process instance started
      example: 61

    MessageProcessorTotalMessagesProcessedHour:
      type: integer
      description: Every message this hour for which an attempt to decode was made
      example: 184320

    MessageProcessorTotalMessagesProcessedToday:
      type: integer
      description: Every message today (UTC) for which an attempt to decode was made
      example: 3512890

    MessageProcessorTotalMessagesProcessedLifetime:
      type: integer
      description: Every message since this process instance started for which an attempt to decode was made
      example: 9021455

    MessageProcessorActiveFlights:
      type: integer
      description: Number of flights currently tracked in the in-memory SQLite store
      example: 8

    MessageProcessorStartedAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp of process start
      example: "2026-01-15T10:00:00+00:00"

    MessageProcessorConfigVersion:
      type: string
      description: >
        Last 8 characters of the SHA-256 hash of a config (rules or areas)
        this instance has actually loaded, or "unknown" before the first
        successful load. Compare against the canonical value to see whether
        this instance is up to date.
      example: "deadbeef"

    MessageProcessorRabbitmqConnected:
      type: boolean
      description: True when the message processor has an active RabbitMQ connection
      example: true

    ComponentRegister:
      description: >
        A component's self-registration, published by
        shared/mqtt_register.py's publish_register() right after it builds
        its own Home Assistant discovery `device` block. Deliberately just
        these two fields -- everything core-health's "update available"
        tracking needs, no more: no separate table anywhere maps a
        component's identity to its container-registry image name.
      type: object
      required: [image, device]
      properties:
        image:
          type: string
          description: >
            Bare GHCR repository name this build published to, from the
            COMPONENT_IMAGE environment variable baked in at build time
            (build-container-images.yaml's `IMAGE=skyfollower-${{ matrix.name }}`
            build-arg). "unknown" (the Dockerfile default for a build with
            no --build-arg IMAGE=...) is never published -- publish_register()
            skips self-registration entirely in that case.
          example: "skyfollower-map"
        device:
          type: object
          description: The component's own Home Assistant discovery device block, verbatim (identifiers, name, model, sw_version, ...)

    HaUpdateEntityDiscovery:
      description: >
        Home Assistant MQTT `update` discovery config, from
        shared/ha_discovery.py's build_ha_update_entity(). The `device`
        block is the component's own, taken directly from its
        componentRegister message, so the entity nests under it; unique_id
        / object_id are "<device.identifiers>_update". No command_topic /
        payload_install / supported_features -- an availability indicator
        only. An empty retained payload on this topic clears the entity.
      type: object
      required: [name, unique_id, object_id, state_topic, device]
      properties:
        name:
          type: string
          example: "SkyFollower Map Update"
        unique_id:
          type: string
          example: "SkyFollower_map_update"
        object_id:
          type: string
          example: "SkyFollower_map_update"
        state_topic:
          type: string
          example: "SkyFollower/register/SkyFollower_map/update"
        entity_category:
          type: string
          enum: [diagnostic]
        device:
          type: object
          description: The component's own Home Assistant discovery device block
        availability_topic:
          type: string
          description: Always core-health's own status topic, not the owning component's -- the registration payload carries no availability topic of its own
          example: "SkyFollower/core-health/status"
        payload_available:
          type: string
          example: "ONLINE"
        payload_not_available:
          type: string
          example: "OFFLINE"

    HaUpdateEntityState:
      description: >
        Single JSON object Home Assistant's MQTT `update` integration reads
        natively (no value template). latest_version equals
        installed_version until core-health's first successful
        container-registry poll, and holds its last-known value across a
        failed poll.
      type: object
      required: [installed_version, latest_version]
      properties:
        installed_version:
          type: string
          description: Running image version from the component's own componentRegister message's device.sw_version, with the "(<commit>)" suffix stripped
          example: "2026.09.10"
        latest_version:
          type: string
          description: Newest YYYY.MM.BB tag of the GHCR image the component's componentRegister message named
          example: "2026.10.01"

    ArchiveFlightsArchivedHour:
      type: integer
      description: Flights successfully written to S3 this hour
      example: 34

    ArchiveFlightsArchivedToday:
      type: integer
      description: Flights successfully written to S3 today (UTC)
      example: 412

    ArchiveFlightsSkippedHour:
      type: integer
      description: External-only flights dropped instead of archived this hour
      example: 118

    ArchiveFlightsSkippedToday:
      type: integer
      description: External-only flights dropped instead of archived today, UTC
      example: 2540

    ArchiveFlightsArchivedLifetime:
      type: integer
      description: >
        Flights successfully written to S3 since this archive-processor
        process started -- not since the container was first installed. An
        in-memory figure the archive processor publishes directly, never
        Redis-backed, so it resets to zero on every archive-processor
        restart by design.
      example: 193822

    ArchiveFlightsSkippedLifetime:
      type: integer
      description: >
        External-only flights dropped instead of archived since this
        archive-processor process started -- not since the container was
        first installed. An in-memory figure the archive processor
        publishes directly, never Redis-backed, so it resets to zero on
        every archive-processor restart by design.
      example: 41230

    ArchiveS3Connected:
      type: boolean
      description: True when the last S3 write attempt succeeded
      example: true

    ArchiveRabbitmqConnected:
      type: boolean
      description: True when the archive processor has an active RabbitMQ connection
      example: true

    ArchiveLocalQueueDepth:
      type: integer
      description: Number of completed flights queued in the local SQLite fallback (s3.db)
      example: 0

    ArchiveLocalIndexQueueDepth:
      type: integer
      description: Number of Parquet index rows queued for retry (index_queue table in s3.db) after their flight object wrote successfully but the index write failed
      example: 0

    ArchiveDeadLetterQueueDepth:
      type: integer
      description: Number of completed flights dead-lettered from the local SQLite fallback (dead_letters/queue/ in data_dir) after repeatedly failing to write to S3
      example: 0

    ArchiveDeadLetterIndexQueueDepth:
      type: integer
      description: Number of Parquet index rows dead-lettered (dead_letters/index_queue/ in data_dir) after repeatedly failing to write
      example: 0

    ArchiveStartedAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp of process start
      example: "2026-01-15T10:00:00+00:00"

    ArchiveCompactionFilesCompacted:
      type: integer
      description: Count of per-flight Parquet index files merged into this run's compacted output
      example: 142

    ArchiveCompactionFilesDeleteFailed:
      type: integer
      description: >
        Count of files included in this run's compacted output whose delete
        call failed and therefore still linger as duplicates
      example: 0

    ArchiveCompactionDaysCompacted:
      type: integer
      description: Number of date partitions successfully compacted this run -- more than one when catching up after a gap
      example: 1

    ArchiveCompactionLastCompactedDate:
      type: string
      format: date
      description: The watermark after this run -- the most recent UTC date whose partition has been fully compacted
      example: "2026-07-23"

    ArchiveCompactionMismatchDate:
      type: string
      format: date
      description: >
        UTC date this run stopped at due to a flight/index parity mismatch.
        Empty string when the run wasn't stopped by one
      example: ""

    ArchiveCompactionMismatchUuids:
      type: string
      description: >
        Comma-separated flight UUIDs missing their Parquet index row on
        mismatch_date. Empty string when the run wasn't stopped by a
        mismatch
      example: ""

    ArchiveCompactionLastRunAt:
      type: string
      format: date-time
      description: >
        UTC ISO-8601 timestamp when this run completed. Home Assistant
        discovery configures this sensor with device_class: timestamp.
      example: "2026-07-25T04:50:03.123456+00:00"

    ArchiveCompactionLastRunStatus:
      type: string
      enum: [Success, Failure, Mismatch]
      description: >
        Outcome of this run. Mismatch means the run completed without
        error but stopped early on a flight/index parity mismatch (see
        mismatch_date/mismatch_uuids); Failure means an actual exception
      example: Success

    RunnerRecordsImported:
      type: integer
      description: >
        Number of records written to Redis during this run. This is the
        common baseline stat every data runner publishes; some runners
        (e.g. mictronics) publish additional stats beyond this one.
      example: 487203

    RunnerLastRunAt:
      type: string
      format: date-time
      description: >
        UTC ISO-8601 timestamp when the run completed. Home Assistant
        discovery configures this sensor with device_class: timestamp.
      example: "2026-01-15T05:12:34+00:00"

    RunnerLastRunStatus:
      type: string
      enum: [Success, Failure]
      description: Outcome of the run
      example: Success

    AirportInfo:
      type: object
      description: >
        Airport metadata as stored in Redis by the ourairports data runner.
        Matches the legacy AROI airport shape. Included in flight notifications
        so consuming systems have phonic names available for announcements.
      required: [icao_code]
      properties:
        icao_code:
          type: string
          example: KATL
        iata_code:
          type: string
          description: IATA 3-character airport code; omitted if blank
          example: ATL
        name:
          type: string
          example: Hartsfield-Jackson Atlanta International Airport
        city:
          type: string
          example: Atlanta
        region:
          type: string
          description: Resolved subdivision display name
          example: Georgia
        region_code:
          type: string
          description: Raw ISO 3166-2 subdivision code, unresolved
          example: US-GA
        country:
          type: string
          description: Resolved country display name
          example: United States
        country_code:
          type: string
          description: Raw ISO 3166-1 alpha-2 country code, unresolved
          example: US
        latitude:
          type: number
          format: float
          example: 33.6367
        longitude:
          type: number
          format: float
          example: -84.4281
        phonic:
          type: string
          description: Voice-friendly spoken name for announcements
          example: Atlanta Hartsfield-Jackson

    AircraftInfo:
      type: object
      description: >
        Aircraft registration and type enrichment. icao_hex is always present.
        military is omitted when false (legacy behaviour — only serialised when true).
      required: [icao_hex]
      properties:
        icao_hex:
          type: string
          example: A1B2C3
        registration:
          type: string
          example: N12345
        type_designator:
          type: string
          description: ICAO type code
          example: B763
        type:
          type: string
          description: Aircraft category
          example: Airplane
        category:
          type: string
          description: Landing-gear category
          example: Land
        manufacturer:
          type: string
          example: Boeing
        model:
          type: string
          example: 767-332ER
        manufacturer_model:
          type: string
          description: Combined manufacturer + model string
          example: BOEING 767-332ER
        description_code:
          type: string
          description: ICAO Doc 8643 aircraft description code (category + engine count + engine type)
          example: L2J
        seats:
          type: integer
          example: 189
        wake_turbulence_category:
          type: string
          example: Heavy
        emitter_category:
          type: string
          description: >
            Raw ADS-B emitter category code the aircraft broadcasts in its
            identification message (1090 DO-260B / UAT DO-282B) -- set letter
            A/B/C/D plus a 1-7 subcategory. Receiver-decoded (like the
            derived wake_turbulence_category), not enrichment; carried in the
            aircraft dict alongside adsb_version, so it is present wherever
            this sub-object is (rule notification, archive object) but its
            only consumer is the map, where it is the last-resort icon-shape
            hint for aircraft with no type enrichment at all.
          example: A5
        military:
          type: boolean
          description: Present and true when the aircraft is military; omitted when false
        serial_number:
          type: string
        manufactured_date:
          type: string
          example: "2005-01-01"
        data_sources:
          type: array
          items:
            type: string
          description: Every data runner that contributed a field to this record, mictronics -> registry -> livery order
          example: [mictronics, us-faa-registry]

    FlightSnapshot:
      type: object
      description: >
        Snapshot of a flight's metadata-relevant fields (message-processor's
        _build_flight_notification_payload -- the CompletedFlight shape,
        minus _id/positions/velocities). Shared base for FlightRuleNotification
        below and the map UDP/WebSocket `metadata` messages, which reuse this
        schema via allOf rather than redefining the same field list a third
        time. icao_hex lives nested at aircraft.icao_hex here, not as a
        top-level key -- unlike the map `position` messages, which do carry
        icao_hex at the top level. operator, registrant, origin, destination,
        and force_archive are omitted when not populated/false rather than
        published as falsy. No properties are marked required at this base
        level -- FlightRuleNotification and the map UDP `metadata` message
        (both always fully populated, since both are built from the same
        _build_flight_notification_payload) declare their own required list
        on top; MapFlightState (the map service's broader, incrementally-
        merged current-state, used by the WebSocket `metadata` message and
        GET /api/flights) reuses these same properties without requiring
        any of them, since a freshly-tracked aircraft may have only
        position fields so far.
      properties:
        aircraft:
          $ref: '#/components/schemas/AircraftInfo'
        ident:
          type: string
          example: DAL659
        operator:
          type: object
          description: Airline operator enrichment. Omitted when empty. source key stripped.
          properties:
            airline_designator:
              type: string
              example: DAL
            name:
              type: string
              example: Delta Air Lines
            callsign:
              type: string
              example: DELTA
            country:
              type: string
              example: United States
            iata:
              type: string
              example: DL
            flight_number:
              type: string
              example: DL659
        registrant:
          type: object
          description: Owner/registrant information from the national civil aircraft registry -- an entity, like operator, not a property of the airframe. Omitted when empty.
          properties:
            names:
              type: array
              items:
                type: string
              example: [Delta Air Lines Inc]
            street:
              type: array
              items:
                type: string
              example: ["1030 Delta Blvd"]
            city:
              type: string
              example: Atlanta
            administrative_area:
              type: string
              example: GA
            postal_code:
              type: string
              example: "30354"
            country:
              type: string
              example: US
            type:
              type: string
              description: Registrant category
              example: Corporation
        squawk:
          type: string
          example: "1200"
        origin:
          $ref: '#/components/schemas/AirportInfo'
          description: Departure airport; omitted when unknown
        destination:
          $ref: '#/components/schemas/AirportInfo'
          description: Arrival airport; omitted when unknown
        receiver_sources:
          type: array
          items:
            type: string
            enum: ["1090", "978", "EXTERNAL"]
          description: Every distinct ADS-B receive source seen for this flight, in first-seen order
          example: ["1090"]
        force_archive:
          type: boolean
          description: True if a matching rule (force_archive) overrides the external-only archive skip for this flight; omitted when false
          example: false
        first_message:
          type: string
          format: date-time
          example: "2026-01-15T10:00:00+00:00"
        last_message:
          type: string
          format: date-time
          example: "2026-01-15T10:45:00+00:00"
        total_messages:
          type: integer
          example: 3842
        matched_rules:
          type: array
          items:
            type: string
          example: [military-aircraft]

    FlightRuleNotification:
      description: >
        Snapshot of a flight at the moment a rule matched -- FlightSnapshot
        plus the rule that matched.
      allOf:
        - $ref: '#/components/schemas/FlightSnapshot'
        - type: object
          required: [aircraft, first_message, last_message, total_messages, receiver_sources, rule]
          properties:
            rule:
              type: object
              required: [name, description, identifier]
              properties:
                name:
                  type: string
                  example: Military Aircraft
                description:
                  type: string
                  example: Matches any aircraft with military=true
                identifier:
                  type: string
                  example: military-aircraft

    # ── Map service ──────────────────────────────────────────────────────

    MapPositionFields:
      type: object
      description: >
        Position/velocity fields carried by a map `position` message
        (message-processor/main.py's `_publish_map_position`, map/main.py's
        WebSocket `position` event) or folded into MapFlightState below.
        Each is independently optional per datagram/event -- a field absent
        from the underlying ADS-B message is omitted entirely here, never
        sent as null. Field names are deliberately abbreviated on this
        wire protocol (unlike shared/models.py's Position/Velocity, which
        keep their full names for the S3 archive/rules engine) since
        `position` is sent on every processed message with no throttling --
        the single highest-frequency payload in the whole system.
      properties:
        lat:
          type: number
          format: float
          example: 33.9425
        lon:
          type: number
          format: float
          example: -118.408
        alt:
          type: integer
          description: feet MSL
          example: 350
        velocity:
          type: number
          format: float
          description: knots
          example: 450
        hdg:
          type: number
          format: float
          description: degrees 0-359
          example: 271.4
        vs:
          type: integer
          description: ft/min; negative = descending
          example: -1200

    MapUdpPosition:
      description: >
        Sent by message-processor on every processed ADS-B message (no
        throttling) once the map UDP feed is enabled (MAP_UDP_HOST
        configured) -- see message-processor/main.py's
        `_publish_map_position`. icao_hex, ts, and processor_id are
        always present; every MapPositionFields property is independently
        optional.
      allOf:
        - $ref: '#/components/schemas/MapPositionFields'
        - type: object
          required: [type, icao_hex, ts, processor_id]
          properties:
            type:
              type: string
              enum: [position]
            icao_hex:
              type: string
              example: A8AE7F
            ts:
              type: number
              format: float
              description: Unix timestamp (seconds) of the source ADS-B message (message-processor's received_at)
              example: 1757000000.0
            processor_id:
              type: string
              description: >
                MESSAGE_PROCESSOR_ID of the sending instance -- same value
                used for the `message_processor:{id}:heartbeat` Redis key
                and MQTT topics. The map service uses this on every message
                type (not just MapUdpHeartbeat) to update that processor's
                liveness roster entry -- see MapUdpHeartbeat's description.
              example: mp-1

    MapUdpMetadata:
      description: >
        Sent by message-processor the first time a flight's metadata-
        relevant fields (ident, aircraft enrichment, operator, registrant,
        squawk, origin, destination) are known, and again only when one of
        them changes -- never on every message. See map/main.py's
        `_maybe_publish_map_metadata`. Same FlightSnapshot fields as
        FlightRuleNotification above (aircraft, first_message, last_message,
        total_messages, and receiver_sources always present -- both are
        built by the same _build_flight_notification_payload), minus that
        schema's `rule` object (this message never carries one), plus this
        message's own `type` and `processor_id` keys. icao_hex lives nested
        at aircraft.icao_hex here, not as a top-level key -- unlike the
        sibling `position` message above, which puts icao_hex at the top
        level. The map service excludes `processor_id` from the fields it
        merges into the aircraft's own state (see MapFlightState) --  it
        describes the sending processor, not the aircraft.
      allOf:
        - $ref: '#/components/schemas/FlightSnapshot'
        - type: object
          required: [type, aircraft, first_message, last_message, total_messages, receiver_sources, processor_id]
          properties:
            type:
              type: string
              enum: [metadata]
            processor_id:
              type: string
              description: MESSAGE_PROCESSOR_ID of the sending instance -- see MapUdpPosition.processor_id
              example: mp-1

    MapUdpHeartbeat:
      description: >
        Fixed 5s liveness beacon from message-processor's dedicated
        `_map_heartbeat_loop`, independent of aircraft traffic -- the only
        one of the three map UDP message types with no flight-related
        fields at all. Traffic reduction: `_MapUdpPublisher` tracks the
        timestamp of the last datagram it sent of *any* type, and the
        heartbeat loop skips sending on a given 5s tick if a `position` or
        `metadata` datagram already went out for this processor within that
        window -- so a busy processor rarely emits a standalone heartbeat;
        only an idle/low-traffic one sees it fire on (almost) every tick.
        Not throttled by MAX_MESSAGE_LAG_SECONDS -- unlike `position`/
        `metadata`, a heartbeat is about the processor being up *now*, not
        about a source message's recency.
      type: object
      required: [type, processor_id, ts]
      properties:
        type:
          type: string
          enum: [heartbeat]
        processor_id:
          type: string
          description: MESSAGE_PROCESSOR_ID of the sending instance -- see MapUdpPosition.processor_id
          example: mp-1
        ts:
          type: number
          format: float
          description: Unix timestamp (seconds) this heartbeat was sent (message-processor's own clock, not a source ADS-B message's)
          example: 1725720000.0

    MapFlightState:
      description: >
        One aircraft's full merged current-state, as held in the map
        service's dedicated Redis (`flight:detail:{icao_hex}`, see
        map/state_store.py's `FlightStateStore`) -- every field known so far
        from that aircraft's `position` and `metadata` UDP messages,
        merged field-by-field so a partial update never clobbers fields it
        didn't carry. Reuses FlightSnapshot and MapPositionFields rather
        than redefining their fields a third/fourth time; unlike both,
        nothing here is required beyond icao_hex -- a freshly-tracked
        aircraft may have only position fields (or only metadata fields) so
        far. This is the exact shape of one `GET /api/flights` array
        element (specs/openapi.yaml) and, with a `type: metadata` key added,
        of the WebSocket `metadata` message below -- kept in sync manually
        between the two spec files since this repo has no cross-file $ref
        tooling for asyncapi.yaml <-> openapi.yaml.
      required: [icao_hex]
      allOf:
        - $ref: '#/components/schemas/FlightSnapshot'
        - $ref: '#/components/schemas/MapPositionFields'
        - type: object
          properties:
            icao_hex:
              type: string
              example: A8AE7F

    MapWsPosition:
      description: >
        WebSocket `position` event (map/main.py's `_handle_packet`) -- same
        optional MapPositionFields as the UDP `position` message, but no
        `timestamp` (this event reflects the merged current-state, not one
        source message's receive time).
      allOf:
        - $ref: '#/components/schemas/MapPositionFields'
        - type: object
          required: [type, icao_hex]
          properties:
            type:
              type: string
              enum: [position]
            icao_hex:
              type: string
              example: A8AE7F

    MapWsMetadata:
      description: >
        WebSocket `metadata` event (map/main.py's `_handle_packet`) --
        MapFlightState plus a `type` key. Deliberately broader than the UDP
        `metadata` message it originated from: includes whatever position
        fields are currently known too, so a client that only just
        connected (and so missed any earlier `position` events) still has
        everything needed to place and label the aircraft.
      allOf:
        - $ref: '#/components/schemas/MapFlightState'
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [metadata]

    MapWsStale:
      type: object
      description: >
        WebSocket `stale` event -- the aircraft's `flight:live:{icao_hex}`
        sentinel expired (no message seen for MAP_STALE_SECONDS), but its
        detail record has not yet been evicted. See map/state_store.py's
        `handle_expired_key`.
      required: [type, icao_hex]
      properties:
        type:
          type: string
          enum: [stale]
        icao_hex:
          type: string
          example: A8AE7F

    MapWsHide:
      type: object
      description: >
        WebSocket `hide` event -- the aircraft's `flight:visible:{icao_hex}`
        sentinel expired (no message seen for MAP_HIDE_SECONDS). Unlike
        `remove`, the aircraft's detail record and trail are left
        untouched server-side; the client must likewise keep the record
        and its accumulated trail, only omitting it from what's drawn, so
        a resumed flight bridges the gap as one continuous trail if
        contact resumes before MAP_EVICT_SECONDS. See
        map/state_store.py's `handle_expired_key`.
      required: [type, icao_hex]
      properties:
        type:
          type: string
          enum: [hide]
        icao_hex:
          type: string
          example: A8AE7F

    MapWsRemove:
      type: object
      description: >
        WebSocket `remove` event -- the aircraft's `flight:detail:{icao_hex}`
        record itself expired (no message seen for MAP_EVICT_SECONDS); the
        client should drop the aircraft entirely. See map/state_store.py's
        `handle_expired_key`.
      required: [type, icao_hex]
      properties:
        type:
          type: string
          enum: [remove]
        icao_hex:
          type: string
          example: A8AE7F

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------

  parameters:

    ReceiverId:
      description: >
        Receiver instance identifier, persisted to {data_dir}/receiver_id
        on first successful startup and reused on every restart after.
        With REDIS_HOST configured, this is the operator-chosen
        RECEIVER_NAME, claimed via Redis SET NX the same way
        MESSAGE_PROCESSOR_ID is claimed (first-boot-only Redis dependency;
        every later boot resumes the persisted value with zero Redis
        calls). With REDIS_HOST unset, this is a randomly generated UUID
        instead, and RECEIVER_NAME stays a purely cosmetic label. Either
        way, allows multiple receiver containers to coexist on the same
        broker.

    MessageProcessorId:
      description: >
        Message processor instance identifier: any unique string, not a
        contiguous ordinal -- commonly ${MESSAGE_PROCESSOR_PREFIX:-<hostname>}-{n},
        set per service in docker-compose.message-processor.yaml.
        MESSAGE_PROCESSOR_PREFIX defaults to the node's own hostname,
        keeping IDs unique across nodes with no coordination needed;
        uniqueness itself is enforced via a Redis NX key at startup, not
        assumed by construction. The same ID names its RabbitMQ queue,
        Redis heartbeat key, and data directory verbatim:
        skyfollower-message-processor-{id}.

    RuleIdentifier:
      description: >
        Unique rule identifier string matching the identifier field of the
        triggered rule. Also the final segment of the rule notification topic.

    RunnerName:
      description: >
        Data runner name identifying which import job published statistics.
        One of: mictronics, us-faa-registry, ca-transport-canada-registry, ourairports.

    ComponentDeviceId:
      description: >
        The `ids` value of a component's Home Assistant discovery device
        block -- e.g. SkyFollower_Core, SkyFollower_map,
        SkyFollower_message_processor_{id}, SkyFollower_receiver_{id},
        SkyFollower_runner_{name}. This is the component's own stable
        identifier, unchanged by core-health: its componentRegister
        message is published at SkyFollower/register/{this}, its update
        entity's state at SkyFollower/register/{this}/update, and that
        entity's discovery config at
        homeassistant/update/{this}_update/config.

    ConnectionHost:
      description: >
        The host (hostname or IP address) of one specific RECEIVER_SOURCES
        entry, as configured -- not resolved or normalized.

    ConnectionPort:
      description: >
        The TCP port of one specific RECEIVER_SOURCES entry, as
        configured.
