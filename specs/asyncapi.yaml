asyncapi: '3.1.0'
info:
  title: SkyFollower
  version: '9999.99.99'
  description: >
    ADS-B aircraft tracking and alerting system.
    Every component publishes one retained MQTT topic per statistic
    (SkyFollower/{component}/statistic/{name}) as a plain-text value —
    booleans as "True"/"False", numbers as their string representation —
    rather than a single combined JSON payload; only structured payloads
    like the rule match notification use application/json. All timestamps
    are UTC ISO-8601.

servers:
  mqtt:
    host: localhost:1883
    protocol: mqtt
    description: >
      MQTT broker (e.g. Home Assistant Mosquitto). Replace host/port with
      your broker's address. TLS and authentication are deployment-specific
      runtime concerns.

# ---------------------------------------------------------------------------
# Channels
# ---------------------------------------------------------------------------

channels:

  # ── Receiver ──────────────────────────────────────────────────────────────

  receiverStatus:
    address: 'SkyFollower/receiver/{receiver_id}/status'
    description: >
      Receiver liveness. Published ONLINE on connect and OFFLINE via LWT.
      Both messages are retained. Multiple receiver instances are
      distinguished by receiver_id.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      StatusMessage:
        $ref: '#/components/messages/StatusMessage'

  # Rather than a single combined-JSON statistics payload, the receiver
  # publishes one retained topic per stat, matching how archive-compaction
  # and every data runner already publish -- each stat gets its own
  # channel/message/schema rather than being folded into one object.

  receiverMessagesPerSecond:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/messages_{connection_host}_{connection_port}_per_second'
    description: >
      Average message rate for one specific sources[] connection since
      last report -- one topic per configured connection, not per source
      tag, so two connections sharing a tag (e.g. two EXTERNAL feeds) get
      independent rates instead of a single summed value. Published every
      MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
      connection_host:
        $ref: '#/components/parameters/ConnectionHost'
      connection_port:
        $ref: '#/components/parameters/ConnectionPort'
    messages:
      ReceiverMessagesPerSecondMessage:
        $ref: '#/components/messages/ReceiverMessagesPerSecondMessage'

  receiverConnectionConnected:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/{connection_host}_{connection_port}_connected'
    description: >
      Whether the TCP connection to one specific sources[] entry's readsb
      instance is currently open -- True right after connect, False on any
      connection error or detected closed connection. Published every
      MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
      connection_host:
        $ref: '#/components/parameters/ConnectionHost'
      connection_port:
        $ref: '#/components/parameters/ConnectionPort'
    messages:
      ReceiverConnectionConnectedMessage:
        $ref: '#/components/messages/ReceiverConnectionConnectedMessage'

  receiverConnectionReconnectCount:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/{connection_host}_{connection_port}_reconnect_count'
    description: >
      Number of times one specific sources[] connection has dropped and
      been re-established since process start -- distinguishes a
      rock-solid connection from one that's currently connected but
      flapping. Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
      connection_host:
        $ref: '#/components/parameters/ConnectionHost'
      connection_port:
        $ref: '#/components/parameters/ConnectionPort'
    messages:
      ReceiverConnectionReconnectCountMessage:
        $ref: '#/components/messages/ReceiverConnectionReconnectCountMessage'

  # The _total_hour / _total_today topics are only published when the
  # receiver has REDIS_HOST configured (they are Redis-backed and published
  # by core-health, not the receiver). Missing entirely (rather than a
  # zero-valued topic) is how a Redis-less deployment signals they don't
  # apply, matching the receiver's own has-no-standalone-entry convention
  # elsewhere in this file rather than inventing a new one. The sibling
  # _total_lifetime topic is unconditional and published by the receiver
  # itself -- see its own entry below.

  receiverConnectionMessagesTotalHour:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/messages_{connection_host}_{connection_port}_total_hour'
    description: >
      Cumulative message count for one specific sources[] connection since
      the current UTC hour began. Only published when REDIS_HOST is
      configured. Backed by shared/lua/incr_period_counter.lua via Redis;
      the receiver flushes its own count into Redis and core-health reads
      Redis and publishes this topic, so the value is cross-restart-durable
      (it survives a receiver restart, resetting only at the real UTC hour
      boundary). Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
      connection_host:
        $ref: '#/components/parameters/ConnectionHost'
      connection_port:
        $ref: '#/components/parameters/ConnectionPort'
    messages:
      ReceiverConnectionMessagesTotalHourMessage:
        $ref: '#/components/messages/ReceiverConnectionMessagesTotalHourMessage'

  receiverConnectionMessagesTotalToday:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/messages_{connection_host}_{connection_port}_total_today'
    description: >
      Cumulative message count for one specific sources[] connection since
      the current UTC day began. Only published when REDIS_HOST is
      configured. Redis-backed and published by core-health, same as the
      sibling _total_hour field above -- cross-restart-durable, resetting
      only at the real UTC day boundary. Published every
      MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
      connection_host:
        $ref: '#/components/parameters/ConnectionHost'
      connection_port:
        $ref: '#/components/parameters/ConnectionPort'
    messages:
      ReceiverConnectionMessagesTotalTodayMessage:
        $ref: '#/components/messages/ReceiverConnectionMessagesTotalTodayMessage'

  receiverConnectionMessagesTotalLifetime:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/messages_{connection_host}_{connection_port}_total_lifetime'
    description: >
      Cumulative message count for one specific sources[] connection since
      this receiver process started -- not since the receiver was first
      installed. A device-local, in-memory figure the receiver publishes
      directly (the same way messages_*_per_second is published), never
      written to or read from Redis, so it resets to zero on every receiver
      restart by design. Published unconditionally, regardless of whether
      REDIS_HOST is set. Published every MQTT_PUBLISH_INTERVAL_SECONDS,
      retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
      connection_host:
        $ref: '#/components/parameters/ConnectionHost'
      connection_port:
        $ref: '#/components/parameters/ConnectionPort'
    messages:
      ReceiverConnectionMessagesTotalLifetimeMessage:
        $ref: '#/components/messages/ReceiverConnectionMessagesTotalLifetimeMessage'

  receiverConnectionConnectedAttributes:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/{connection_host}_{connection_port}_connected_attributes'
    description: >
      JSON attributes for the sibling {connection_host}_{connection_port}_connected
      sensor -- currently just last_message_received, the UTC ISO-8601
      timestamp of the last message processed for one specific sources[]
      connection. Not published at all until the first message on that
      connection arrives. Published every MQTT_PUBLISH_INTERVAL_SECONDS once
      set, retained. Consumed by Home Assistant discovery's
      json_attributes_topic on the _connected sensor rather than backing a
      standalone entity.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
      connection_host:
        $ref: '#/components/parameters/ConnectionHost'
      connection_port:
        $ref: '#/components/parameters/ConnectionPort'
    messages:
      ReceiverConnectionConnectedAttributesMessage:
        $ref: '#/components/messages/ReceiverConnectionConnectedAttributesMessage'

  receiverLocalQueueDepth:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/local_queue_depth'
    description: >
      Number of messages queued in the local SQLite fallback (queue.db).
      Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverLocalQueueDepthMessage:
        $ref: '#/components/messages/ReceiverLocalQueueDepthMessage'

  receiverDeadLetterQueueDepth:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/dead_letter_queue_depth'
    description: >
      Number of messages dead-lettered from the local SQLite fallback after
      repeatedly failing to publish -- files under dead_letters/queue/ in
      data_dir, not counted in local_queue_depth. Published every
      MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverDeadLetterQueueDepthMessage:
        $ref: '#/components/messages/ReceiverDeadLetterQueueDepthMessage'

  receiverRabbitmqConnected:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/rabbitmq_connected'
    description: >
      Whether the receiver currently has an active RabbitMQ connection.
      Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverRabbitmqConnectedMessage:
        $ref: '#/components/messages/ReceiverRabbitmqConnectedMessage'

  receiverStartedAt:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/started_at'
    description: >
      UTC ISO-8601 timestamp of process start; never changes after startup.
      Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverStartedAtMessage:
        $ref: '#/components/messages/ReceiverStartedAtMessage'

  receiverVersion:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/version'
    description: >
      Running image version, from the VERSION environment variable ("dev" if
      unset); never changes after startup. Published every
      MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverVersionMessage:
        $ref: '#/components/messages/ReceiverVersionMessage'

  # ── Message Processor ─────────────────────────────────────────────────────

  messageProcessorStatus:
    address: 'SkyFollower/message-processor/{message_processor_id}/status'
    description: >
      Per-message-processor liveness. Published ONLINE on connect and OFFLINE
      via LWT. Both messages are retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      StatusMessage:
        $ref: '#/components/messages/StatusMessage'

  # One retained topic per stat, matching the receiver above.

  messageProcessorMessagesPerSecond:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/messages_per_second'
    description: >
      Average message processing rate since last report. Published every
      MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorMessagesPerSecondMessage:
        $ref: '#/components/messages/MessageProcessorMessagesPerSecondMessage'

  messageProcessorProcessingTimeHwmMs:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/processing_time_hwm_ms'
    description: >
      End-to-end message processing time high-water mark since last publish;
      resets on publish. Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorProcessingTimeHwmMsMessage:
        $ref: '#/components/messages/MessageProcessorProcessingTimeHwmMsMessage'

  messageProcessorMessageLatencyHwmMs:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/message_latency_hwm_ms'
    description: >
      Receipt-through-processed latency high-water mark since last publish
      -- from the moment the receiver parsed the message off the wire
      through the message processor finishing its work on it, including
      any time spent waiting in RabbitMQ. A superset of
      processing_time_hwm_ms (which only covers message-processor-internal
      decode+state-update work); the two are published side by side.
      Wall-clock based (received_at is stamped on the receiver host and
      crosses the RabbitMQ hop), unlike processing_time_hwm_ms's monotonic
      clock -- sensitive to NTP drift/clock adjustments between the
      receiver and message-processor hosts. Resets on publish. Published
      every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorMessageLatencyHwmMsMessage:
        $ref: '#/components/messages/MessageProcessorMessageLatencyHwmMsMessage'

  messageProcessorRulesEngineHwmNs:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/rules_engine_hwm_ns'
    description: >
      Rules engine duration high-water mark since last publish, in
      nanoseconds (a single rule-evaluation pass is in-process/no-I/O and
      almost always sub-millisecond, so nanoseconds carries the signal
      millisecond resolution would lose); resets on publish. Published
      every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorRulesEngineHwmNsMessage:
        $ref: '#/components/messages/MessageProcessorRulesEngineHwmNsMessage'

  messageProcessorLocalArchiveQueueDepth:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/local_archive_queue_depth'
    description: >
      Number of completed flights queued in the local SQLite fallback
      (completed_flights.db). Published every MQTT_PUBLISH_INTERVAL_SECONDS,
      retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorLocalArchiveQueueDepthMessage:
        $ref: '#/components/messages/MessageProcessorLocalArchiveQueueDepthMessage'

  messageProcessorDeadLetterQueueDepth:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/dead_letter_queue_depth'
    description: >
      Number of completed flights dead-lettered from the local SQLite
      archive fallback after repeatedly failing to publish -- files under
      dead_letters/queue/ in data_dir, not counted in
      local_archive_queue_depth. Published every MQTT_PUBLISH_INTERVAL_SECONDS,
      retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorDeadLetterQueueDepthMessage:
        $ref: '#/components/messages/MessageProcessorDeadLetterQueueDepthMessage'

  messageProcessorRegistrationMissesHour:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/registration_misses_hour'
    description: >
      Aircraft enrichment (registration) Redis cache misses this hour. Message
      processor is write-only for this counter (accumulates in memory,
      flushes to Redis on its own telemetry cadence); core-health is the
      component that actually publishes this topic, on message processor's
      behalf, using the exact address/payload shape below. Published every
      MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorRegistrationMissesHourMessage:
        $ref: '#/components/messages/MessageProcessorRegistrationMissesHourMessage'

  messageProcessorRegistrationMissesToday:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/registration_misses_today'
    description: >
      Aircraft enrichment (registration) Redis cache misses today (UTC).
      Published by core-health on message processor's behalf -- see
      messageProcessorRegistrationMissesHour above. Published every
      MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorRegistrationMissesTodayMessage:
        $ref: '#/components/messages/MessageProcessorRegistrationMissesTodayMessage'

  messageProcessorRegistrationMissesLifetime:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/registration_misses_lifetime'
    description: >
      Aircraft enrichment (registration) Redis cache misses since this
      process instance started (resets to 0 on container restart, not a
      true all-time total). Published by core-health on message processor's
      behalf -- see messageProcessorRegistrationMissesHour above. Published
      every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorRegistrationMissesLifetimeMessage:
        $ref: '#/components/messages/MessageProcessorRegistrationMissesLifetimeMessage'

  messageProcessorOperatorMissesToday:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/operator_misses_today'
    description: >
      operator:{designator} Redis lookup misses today (UTC) -- a distinct
      failure type from a registration miss (see
      messageProcessorRegistrationMissesHour). No hourly period: operator
      misses are lower-volume and only tracked today/lifetime. Published by
      core-health on message processor's behalf, using the exact
      address/payload shape message processor's own code would have used.
      Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorOperatorMissesTodayMessage:
        $ref: '#/components/messages/MessageProcessorOperatorMissesTodayMessage'

  messageProcessorOperatorMissesLifetime:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/operator_misses_lifetime'
    description: >
      operator:{designator} Redis lookup misses since this process instance
      started (resets to 0 on container restart, not a true all-time
      total). Published by core-health on message processor's behalf -- see
      messageProcessorOperatorMissesToday above. Published every
      MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorOperatorMissesLifetimeMessage:
        $ref: '#/components/messages/MessageProcessorOperatorMissesLifetimeMessage'

  messageProcessorTotalMessagesProcessedHour:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/total_messages_processed_hour'
    description: >
      Every message this hour for which an attempt to decode was made
      (including CRC-corrupt/no-content messages) -- counted at the same
      point messages_per_second is, before decoding is attempted. Bucketed
      by wall-clock processing time, not received_at, so a backlog replay
      counts toward the current hour regardless of the messages' original
      timestamps. Published by core-health on message processor's behalf,
      using the exact address/payload shape message processor's own code
      would have used. Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorTotalMessagesProcessedHourMessage:
        $ref: '#/components/messages/MessageProcessorTotalMessagesProcessedHourMessage'

  messageProcessorTotalMessagesProcessedToday:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/total_messages_processed_today'
    description: >
      Every message today (UTC, wall-clock processing time) for which an
      attempt to decode was made. Published by core-health on message
      processor's behalf -- see messageProcessorTotalMessagesProcessedHour
      above. Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorTotalMessagesProcessedTodayMessage:
        $ref: '#/components/messages/MessageProcessorTotalMessagesProcessedTodayMessage'

  messageProcessorTotalMessagesProcessedLifetime:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/total_messages_processed_lifetime'
    description: >
      Every message since this process instance started for which an
      attempt to decode was made (resets to 0 on container restart, not a
      true all-time total). Published by core-health on message
      processor's behalf -- see messageProcessorTotalMessagesProcessedHour
      above. Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorTotalMessagesProcessedLifetimeMessage:
        $ref: '#/components/messages/MessageProcessorTotalMessagesProcessedLifetimeMessage'

  messageProcessorActiveFlights:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/active_flights'
    description: >
      Number of flights currently tracked in the in-memory SQLite store.
      Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorActiveFlightsMessage:
        $ref: '#/components/messages/MessageProcessorActiveFlightsMessage'

  messageProcessorStartedAt:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/started_at'
    description: >
      UTC ISO-8601 timestamp of process start; never changes after startup.
      Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorStartedAtMessage:
        $ref: '#/components/messages/MessageProcessorStartedAtMessage'

  messageProcessorRulesVersion:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/rules_version'
    description: >
      Last 8 characters of the SHA-256 hash of the rules config THIS
      instance has actually loaded ("unknown" until the first successful
      load). Lags the canonical config:rules:version if a bad payload was
      pushed and rejected, or if this instance has not polled since the
      last save. Truncation is publish-boundary only -- the engine keeps
      the full hash for its own comparison. Published every
      MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorRulesVersionMessage:
        $ref: '#/components/messages/MessageProcessorRulesVersionMessage'

  messageProcessorAreasVersion:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/areas_version'
    description: >
      Last 8 characters of the SHA-256 hash of the areas config THIS
      instance has actually loaded ("unknown" until the first successful
      load). Same semantics as rules_version above. Published every
      MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorAreasVersionMessage:
        $ref: '#/components/messages/MessageProcessorAreasVersionMessage'

  # ── Archive processor ─────────────────────────────────────────────────────

  archiveStatus:
    address: SkyFollower/archive/status
    description: >
      Archive processor liveness. Published ONLINE on connect and OFFLINE
      via LWT. Both messages are retained.
    messages:
      StatusMessage:
        $ref: '#/components/messages/StatusMessage'

  # One retained topic per stat, matching the receiver/message processor
  # above.

  archiveFlightsArchivedHour:
    address: SkyFollower/archive/statistic/flights_archived_hour
    description: >
      Flights successfully written to S3 this hour. Published every
      MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    messages:
      ArchiveFlightsArchivedHourMessage:
        $ref: '#/components/messages/ArchiveFlightsArchivedHourMessage'

  archiveFlightsArchivedToday:
    address: SkyFollower/archive/statistic/flights_archived_today
    description: >
      Flights successfully written to S3 today (UTC). Published every
      MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    messages:
      ArchiveFlightsArchivedTodayMessage:
        $ref: '#/components/messages/ArchiveFlightsArchivedTodayMessage'

  archiveFlightsSkippedHour:
    address: SkyFollower/archive/statistic/flights_skipped_hour
    description: >
      External-only flights dropped instead of archived this hour. Published
      every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    messages:
      ArchiveFlightsSkippedHourMessage:
        $ref: '#/components/messages/ArchiveFlightsSkippedHourMessage'

  archiveFlightsSkippedToday:
    address: SkyFollower/archive/statistic/flights_skipped_today
    description: >
      External-only flights dropped instead of archived today (UTC). Published
      every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    messages:
      ArchiveFlightsSkippedTodayMessage:
        $ref: '#/components/messages/ArchiveFlightsSkippedTodayMessage'

  archiveS3Connected:
    address: SkyFollower/archive/statistic/s3_connected
    description: >
      Whether the last S3 write attempt succeeded. Published every
      MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    messages:
      ArchiveS3ConnectedMessage:
        $ref: '#/components/messages/ArchiveS3ConnectedMessage'

  archiveLocalQueueDepth:
    address: SkyFollower/archive/statistic/local_queue_depth
    description: >
      Number of completed flights queued in the local SQLite fallback
      (s3.db). Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    messages:
      ArchiveLocalQueueDepthMessage:
        $ref: '#/components/messages/ArchiveLocalQueueDepthMessage'

  archiveLocalIndexQueueDepth:
    address: SkyFollower/archive/statistic/local_index_queue_depth
    description: >
      Number of Parquet index rows queued for retry (index_queue table in
      s3.db) after their flight object wrote successfully but the index
      write failed. Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    messages:
      ArchiveLocalIndexQueueDepthMessage:
        $ref: '#/components/messages/ArchiveLocalIndexQueueDepthMessage'

  archiveDeadLetterQueueDepth:
    address: SkyFollower/archive/statistic/dead_letter_queue_depth
    description: >
      Number of completed flights dead-lettered from the local SQLite
      fallback (s3.db) after repeatedly failing to write to S3 -- files
      under dead_letters/queue/ in data_dir, not counted in
      local_queue_depth. Published every MQTT_PUBLISH_INTERVAL_SECONDS,
      retained.
    messages:
      ArchiveDeadLetterQueueDepthMessage:
        $ref: '#/components/messages/ArchiveDeadLetterQueueDepthMessage'

  archiveDeadLetterIndexQueueDepth:
    address: SkyFollower/archive/statistic/dead_letter_index_queue_depth
    description: >
      Number of Parquet index rows dead-lettered (index_queue table in
      s3.db) after repeatedly failing to write -- files under
      dead_letters/index_queue/ in data_dir, not counted in
      local_index_queue_depth. Published every MQTT_PUBLISH_INTERVAL_SECONDS,
      retained.
    messages:
      ArchiveDeadLetterIndexQueueDepthMessage:
        $ref: '#/components/messages/ArchiveDeadLetterIndexQueueDepthMessage'

  archiveStartedAt:
    address: SkyFollower/archive/statistic/started_at
    description: >
      UTC ISO-8601 timestamp of process start; never changes after startup.
      Published every MQTT_PUBLISH_INTERVAL_SECONDS, retained.
    messages:
      ArchiveStartedAtMessage:
        $ref: '#/components/messages/ArchiveStartedAtMessage'

  # ── Archive compaction ────────────────────────────────────────────────────
  # Unlike receiver/processor/archive-processor's single combined-JSON
  # statistics payload, archive-compaction is a one-shot job (not a
  # long-running service) and publishes one retained topic per stat,
  # matching how it actually publishes in code -- each stat gets its own
  # channel/message/schema rather than being folded into one object.

  archiveCompactionFilesCompacted:
    address: SkyFollower/archive-compaction/statistic/files_compacted
    description: >
      Count of per-flight Parquet index files merged into this run's
      compacted output(s), summed across every date compacted this run.
      Published once per run, retained.
    messages:
      ArchiveCompactionFilesCompactedMessage:
        $ref: '#/components/messages/ArchiveCompactionFilesCompactedMessage'

  archiveCompactionFilesDeleteFailed:
    address: SkyFollower/archive-compaction/statistic/files_delete_failed
    description: >
      Count of files included in a compacted output whose source delete
      call failed, and therefore still linger as duplicates, summed across
      every date compacted this run. Published once per run, retained.
    messages:
      ArchiveCompactionFilesDeleteFailedMessage:
        $ref: '#/components/messages/ArchiveCompactionFilesDeleteFailedMessage'

  archiveCompactionDaysCompacted:
    address: SkyFollower/archive-compaction/statistic/days_compacted
    description: >
      Number of date partitions successfully compacted this run -- more
      than one when catching up after a gap. Published once per run,
      retained.
    messages:
      ArchiveCompactionDaysCompactedMessage:
        $ref: '#/components/messages/ArchiveCompactionDaysCompactedMessage'

  archiveCompactionLastCompactedDate:
    address: SkyFollower/archive-compaction/statistic/last_compacted_date
    description: >
      The watermark after this run: the most recent UTC date (YYYY-MM-DD)
      whose partition has been fully compacted. Published once per run,
      retained.
    messages:
      ArchiveCompactionLastCompactedDateMessage:
        $ref: '#/components/messages/ArchiveCompactionLastCompactedDateMessage'

  archiveCompactionMismatchDate:
    address: SkyFollower/archive-compaction/statistic/mismatch_date
    description: >
      UTC date (YYYY-MM-DD) this run stopped at due to a flight/index
      parity mismatch. Empty string when the run wasn't stopped by one.
      Published once per run, retained.
    messages:
      ArchiveCompactionMismatchDateMessage:
        $ref: '#/components/messages/ArchiveCompactionMismatchDateMessage'

  archiveCompactionMismatchUuids:
    address: SkyFollower/archive-compaction/statistic/mismatch_uuids
    description: >
      Comma-separated flight UUIDs missing their Parquet index row on
      mismatch_date -- a starting point for manual investigation. Empty
      string when the run wasn't stopped by a mismatch. Published once per
      run, retained.
    messages:
      ArchiveCompactionMismatchUuidsMessage:
        $ref: '#/components/messages/ArchiveCompactionMismatchUuidsMessage'

  archiveCompactionLastRunAt:
    address: SkyFollower/archive-compaction/statistic/last_run_at
    description: >
      UTC ISO-8601 timestamp when this run completed. Published once per
      run, retained. Home Assistant discovery configures this sensor with
      device_class: timestamp.
    messages:
      ArchiveCompactionLastRunAtMessage:
        $ref: '#/components/messages/ArchiveCompactionLastRunAtMessage'

  archiveCompactionLastRunStatus:
    address: SkyFollower/archive-compaction/statistic/last_run_status
    description: >
      Outcome of this run: Success, Failure (an exception, e.g. an S3
      error), or Mismatch (completed without error but stopped early on a
      flight/index parity mismatch -- see mismatch_date/mismatch_uuids).
      Published once per run, retained.
    messages:
      ArchiveCompactionLastRunStatusMessage:
        $ref: '#/components/messages/ArchiveCompactionLastRunStatusMessage'

  archiveCompactionVersion:
    address: SkyFollower/archive-compaction/statistic/version
    description: >
      Running image version, read from the VERSION environment variable
      (falls back to "dev" if unset). Published once per run, retained.
    messages:
      ArchiveCompactionVersionMessage:
        $ref: '#/components/messages/ArchiveCompactionVersionMessage'

  # ── Rule notifications ────────────────────────────────────────────────────

  ruleNotification:
    address: 'SkyFollower/rule/{identifier}'
    description: >
      Published by the message processor when a rule matches a tracked flight. The
      identifier in the topic matches the rule's identifier field. Not
      retained.
    parameters:
      identifier:
        $ref: '#/components/parameters/RuleIdentifier'
    messages:
      FlightRuleNotificationMessage:
        $ref: '#/components/messages/FlightRuleNotificationMessage'

  # ── Data runners ──────────────────────────────────────────────────────────

  # A data runner publishes one retained topic per stat at the end of its
  # run, not a single combined JSON payload -- confirmed in
  # ourairports/main.py's publish_completion_stats(). These three
  # (records_imported, last_run_at, last_run_status) are the common
  # baseline every runner publishes; some runners (e.g. mictronics) publish
  # additional stats beyond this set.

  runnerRecordsImported:
    address: 'SkyFollower/runner/{runner_name}/statistic/records_imported'
    description: >
      Number of records written to Redis during this run. Published once
      per run, retained.
    parameters:
      runner_name:
        $ref: '#/components/parameters/RunnerName'
    messages:
      RunnerRecordsImportedMessage:
        $ref: '#/components/messages/RunnerRecordsImportedMessage'

  runnerLastRunAt:
    address: 'SkyFollower/runner/{runner_name}/statistic/last_run_at'
    description: >
      UTC ISO-8601 timestamp when the run completed. Published once per
      run, retained. Home Assistant discovery configures this sensor with
      device_class: timestamp.
    parameters:
      runner_name:
        $ref: '#/components/parameters/RunnerName'
    messages:
      RunnerLastRunAtMessage:
        $ref: '#/components/messages/RunnerLastRunAtMessage'

  runnerLastRunStatus:
    address: 'SkyFollower/runner/{runner_name}/statistic/last_run_status'
    description: >
      Outcome of the run (Success or Failure). Published once per run,
      retained.
    parameters:
      runner_name:
        $ref: '#/components/parameters/RunnerName'
    messages:
      RunnerLastRunStatusMessage:
        $ref: '#/components/messages/RunnerLastRunStatusMessage'

