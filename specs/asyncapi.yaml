  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------

  schemas:

    StatusPayload:
      type: string
      enum: [ONLINE, OFFLINE]
      description: >
        Component liveness indicator. ONLINE published on connect (retained);
        OFFLINE sent as LWT when the connection drops (retained).

    ReceiverMessages1090PerSecond:
      type: number
      description: Average 1090 MHz message rate since last report (messages received ÷ elapsed seconds)
      example: 12.4

    ReceiverMessages978PerSecond:
      type: number
      description: Average 978 MHz UAT message rate since last report. Only published if a 978 source is configured
      example: 0.0

    ReceiverMessagesMlatPerSecond:
      type: number
      description: Average MLAT message rate since last report. Only published if an MLAT source is configured
      example: 0.0

    ReceiverLocalQueueDepth:
      type: integer
      description: Number of messages queued in the local SQLite fallback (queue.db)
      example: 0

    ReceiverRabbitmqConnected:
      type: boolean
      description: True when the receiver has an active RabbitMQ connection
      example: true

    ReceiverStartedAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp of process start
      example: "2026-01-15T10:00:00+00:00"

    ProcessorMessagesPerSecond:
      type: number
      description: Average message processing rate since last report (messages received ÷ elapsed seconds)
      example: 45.1

    ProcessorProcessingTimeHwmMs:
      type: number
      description: End-to-end message processing time high-water mark since last publish; resets on publish
      example: 12.3

    ProcessorRulesEngineHwmMs:
      type: integer
      description: Rules engine duration high-water mark since last publish; resets on publish
      example: 45

    ProcessorRabbitmqInputQueueDepthHwm:
      type: integer
      description: High-water mark of this processor's RabbitMQ input queue depth since last publish, sampled at most once every 10 seconds; resets on publish. -1 if no valid sample landed this window (e.g. consumer not yet connected)
      example: 0

    ProcessorLocalArchiveQueueDepth:
      type: integer
      description: Number of completed flights queued in the local SQLite fallback (completed_flights.db)
      example: 0

    ProcessorRegistrationMissesHour:
      type: integer
      description: Aircraft Redis cache misses this hour
      example: 2

    ProcessorRegistrationMissesToday:
      type: integer
      description: Aircraft Redis cache misses today (UTC)
      example: 14

    ProcessorAircraftTypeMissesHour:
      type: integer
      description: Aircraft type lookup misses this hour
      example: 0

    ProcessorAircraftTypeMissesToday:
      type: integer
      description: Aircraft type lookup misses today (UTC)
      example: 3

    ProcessorActiveFlights:
      type: integer
      description: Number of flights currently tracked in the in-memory SQLite store
      example: 8

    ProcessorStartedAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp of process start
      example: "2026-01-15T10:00:00+00:00"

    ArchiveFlightsArchivedHour:
      type: integer
      description: Flights successfully written to S3 this hour
      example: 34

    ArchiveFlightsArchivedToday:
      type: integer
      description: Flights successfully written to S3 today (UTC)
      example: 412

    ArchiveFlightsSkippedHour:
      type: integer
      description: MLAT-only flights dropped instead of archived this hour
      example: 118

    ArchiveFlightsSkippedToday:
      type: integer
      description: MLAT-only flights dropped instead of archived today, UTC
      example: 2540

    ArchiveS3Connected:
      type: boolean
      description: True when the last S3 write attempt succeeded
      example: true

    ArchiveLocalQueueDepth:
      type: integer
      description: Number of completed flights queued in the local SQLite fallback (s3.db)
      example: 0

    ArchiveLocalIndexQueueDepth:
      type: integer
      description: Number of Parquet index rows queued for retry (index_queue table in s3.db) after their flight object wrote successfully but the index write failed
      example: 0

    ArchiveRabbitmqArchiveQueueDepthHwm:
      type: integer
      description: High-water mark of the RabbitMQ 'archive' queue's depth since last publish, sampled at most once every 10 seconds; resets on publish. -1 if no valid sample landed this window (e.g. consumer not yet connected)
      example: 0

    ArchiveStartedAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp of process start
      example: "2026-01-15T10:00:00+00:00"

    ArchiveCompactionFilesCompacted:
      type: integer
      description: Count of per-flight Parquet index files merged into this run's compacted output
      example: 142

    ArchiveCompactionFilesDeleteFailed:
      type: integer
      description: >
        Count of files included in this run's compacted output whose delete
        call failed and therefore still linger as duplicates
      example: 0

    ArchiveCompactionLastRunAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp when this run completed
      example: "2026-07-25T04:50:03.123456+00:00"

    ArchiveCompactionLastRunStatus:
      type: string
      enum: [success, failure]
      description: Outcome of this run
      example: success

    RunnerRecordsImported:
      type: integer
      description: >
        Number of records written to Redis during this run. This is the
        common baseline stat every data runner publishes; some runners
        (e.g. mictronics) publish additional stats beyond this one.
      example: 487203

    RunnerLastRunAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp when the run completed
      example: "2026-01-15T05:12:34+00:00"

    RunnerLastRunStatus:
      type: string
      enum: [success, failure]
      description: Outcome of the run
      example: success

    AirportInfo:
      type: object
      description: >
        Airport metadata as stored in Redis by the ourairports data runner.
        Matches the legacy AROI airport shape. Included in flight notifications
        so consuming systems have phonic names available for announcements.
      required: [icao_code]
      properties:
        icao_code:
          type: string
          example: KATL
        name:
          type: string
          example: Hartsfield-Jackson Atlanta International Airport
        city:
          type: string
          example: Atlanta
        region:
          type: string
          description: ISO 3166-2 region code
          example: US-GA
        country:
          type: string
          example: US
        phonic:
          type: string
          description: Voice-friendly spoken name for announcements
          example: Atlanta Hartsfield-Jackson

    AircraftInfo:
      type: object
      description: >
        Aircraft registration and type enrichment. icao_hex is always present.
        military is omitted when false (legacy behaviour — only serialised when true).
      required: [icao_hex]
      properties:
        icao_hex:
          type: string
          example: A1B2C3
        registration:
          type: string
          example: N12345
        type_designator:
          type: string
          description: ICAO type code
          example: B763
        manufacturer:
          type: string
          example: Boeing
        model:
          type: string
          example: 767-332ER
        wake_turbulence_category:
          type: string
          example: Heavy
        military:
          type: boolean
          description: Present and true when the aircraft is military; omitted when false
        operator:
          type: string
          description: Operator or owner name from the registration database
          example: Delta Air Lines
        airline_code:
          type: string
          example: DAL
        serial_number:
          type: string
        year_built:
          type: string
          example: "2005"
        is_private_operator:
          type: boolean
        data_sources:
          type: array
          items:
            type: string
          description: Every data runner that contributed a field to this record, mictronics -> registry -> livery order
          example: [mictronics, us-faa-registry]

    FlightRuleNotification:
      type: object
      description: >
        Snapshot of a flight at the moment a rule matched. Excludes _id,
        positions, and velocities. operator, origin, and destination are
        omitted when not populated.
      required: [aircraft, first_message, last_message, total_messages, receiver_sources, force_archive, matched_rules, rule]
      properties:
        aircraft:
          $ref: '#/components/schemas/AircraftInfo'
        ident:
          type: string
          example: DAL659
        operator:
          type: object
          description: Airline operator enrichment. Omitted when empty. source key stripped.
          properties:
            airline_designator:
              type: string
              example: DAL
            name:
              type: string
              example: Delta Air Lines
            callsign:
              type: string
              example: DELTA
            country:
              type: string
              example: United States
            iata:
              type: string
              example: DL
            flight_number:
              type: string
              example: DL659
        squawk:
          type: string
          example: "1200"
        origin:
          $ref: '#/components/schemas/AirportInfo'
          description: Departure airport; omitted when unknown
        destination:
          $ref: '#/components/schemas/AirportInfo'
          description: Arrival airport; omitted when unknown
        receiver_sources:
          type: array
          items:
            type: string
            enum: ["1090", "978", "MLAT"]
          description: Every distinct ADS-B receive source seen for this flight, in first-seen order
          example: ["1090"]
        force_archive:
          type: boolean
          description: True if a matching rule (force_archive) overrides the MLAT-only archive skip for this flight
          example: false
        first_message:
          type: string
          format: date-time
          example: "2026-01-15T10:00:00+00:00"
        last_message:
          type: string
          format: date-time
          example: "2026-01-15T10:45:00+00:00"
        total_messages:
          type: integer
          example: 3842
        matched_rules:
          type: array
          items:
            type: string
          example: [military-aircraft]
        rule:
          type: object
          required: [name, description, identifier]
          properties:
            name:
              type: string
              example: Military Aircraft
            description:
              type: string
              example: Matches any aircraft with military=true
            identifier:
              type: string
              example: military-aircraft

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------

  parameters:

    ReceiverId:
      description: >
        Integer receiver instance identifier. Set via the RECEIVER_ID
        environment variable (default 0). Allows multiple receiver
        containers to coexist on the same broker.

    ProcessorId:
      description: >
        Integer processor instance identifier. Set via the PROCESSOR_ID
        environment variable. Used to distinguish multiple processor
        containers running simultaneously.

    RuleIdentifier:
      description: >
        Unique rule identifier string matching the identifier field of the
        triggered rule. Also the final segment of the rule notification topic.

    RunnerName:
      description: >
        Data runner name identifying which import job published statistics.
        One of: mictronics, us-faa-registry, ca-transport-canada-registry, ourairports.
