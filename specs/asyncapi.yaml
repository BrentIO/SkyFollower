asyncapi: '3.1.0'
info:
  title: SkyFollower
  version: '9999.99.99'
  description: >
    ADS-B aircraft tracking and alerting system.
    Every component publishes one retained MQTT topic per statistic
    (SkyFollower/{component}/statistic/{name}) as a plain-text value —
    booleans as "True"/"False", numbers as their string representation —
    rather than a single combined JSON payload; only structured payloads
    like the rule match notification use application/json. All timestamps
    are UTC ISO-8601.

servers:
  mqtt:
    host: localhost:1883
    protocol: mqtt
    description: >
      MQTT broker (e.g. Home Assistant Mosquitto). Replace host/port with
      your broker's address. TLS and authentication are deployment-specific
      runtime concerns.

# ---------------------------------------------------------------------------
# Channels
# ---------------------------------------------------------------------------

channels:

  # ── Receiver ──────────────────────────────────────────────────────────────

  receiverStatus:
    address: 'SkyFollower/receiver/{receiver_id}/status'
    description: >
      Receiver liveness. Published ONLINE on connect and OFFLINE via LWT.
      Both messages are retained. Multiple receiver instances are
      distinguished by receiver_id.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      StatusMessage:
        $ref: '#/components/messages/StatusMessage'

  # Rather than a single combined-JSON statistics payload, the receiver
  # publishes one retained topic per stat, matching how archive-compaction
  # and every data runner already publish (see #542) -- each stat gets its
  # own channel/message/schema rather than being folded into one object.

  receiverMessages1090PerSecond:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/messages_1090_per_second'
    description: >
      Average 1090 MHz message rate since last report. Published every
      telemetry_interval_seconds, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverMessages1090PerSecondMessage:
        $ref: '#/components/messages/ReceiverMessages1090PerSecondMessage'

  receiverMessages978PerSecond:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/messages_978_per_second'
    description: >
      Average 978 MHz UAT message rate since last report. Only published if
      a 978 source is configured. Published every telemetry_interval_seconds,
      retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverMessages978PerSecondMessage:
        $ref: '#/components/messages/ReceiverMessages978PerSecondMessage'

  receiverMessagesMlatPerSecond:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/messages_MLAT_per_second'
    description: >
      Average MLAT message rate since last report. Only published if an
      MLAT source is configured. Published every telemetry_interval_seconds,
      retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverMessagesMlatPerSecondMessage:
        $ref: '#/components/messages/ReceiverMessagesMlatPerSecondMessage'

  receiverLocalQueueDepth:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/local_queue_depth'
    description: >
      Number of messages queued in the local SQLite fallback (queue.db).
      Published every telemetry_interval_seconds, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverLocalQueueDepthMessage:
        $ref: '#/components/messages/ReceiverLocalQueueDepthMessage'

  receiverRabbitmqConnected:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/rabbitmq_connected'
    description: >
      Whether the receiver currently has an active RabbitMQ connection.
      Published every telemetry_interval_seconds, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverRabbitmqConnectedMessage:
        $ref: '#/components/messages/ReceiverRabbitmqConnectedMessage'

  receiverStartedAt:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/started_at'
    description: >
      UTC ISO-8601 timestamp of process start; never changes after startup.
      Published every telemetry_interval_seconds, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverStartedAtMessage:
        $ref: '#/components/messages/ReceiverStartedAtMessage'

  # ── Processor ─────────────────────────────────────────────────────────────

  processorStatus:
    address: 'SkyFollower/processor/{processor_id}/status'
    description: >
      Per-processor liveness. Published ONLINE on connect and OFFLINE via
      LWT. Both messages are retained.
    parameters:
      processor_id:
        $ref: '#/components/parameters/ProcessorId'
    messages:
      StatusMessage:
        $ref: '#/components/messages/StatusMessage'

  # One retained topic per stat (see #542), matching the receiver above.

  processorMessagesPerSecond:
    address: 'SkyFollower/processor/{processor_id}/statistic/messages_per_second'
    description: >
      Average message processing rate since last report. Published every
      telemetry_interval_seconds, retained.
    parameters:
      processor_id:
        $ref: '#/components/parameters/ProcessorId'
    messages:
      ProcessorMessagesPerSecondMessage:
        $ref: '#/components/messages/ProcessorMessagesPerSecondMessage'

  processorProcessingTimeHwmMs:
    address: 'SkyFollower/processor/{processor_id}/statistic/processing_time_hwm_ms'
    description: >
      End-to-end message processing time high-water mark since last publish;
      resets on publish. Published every telemetry_interval_seconds, retained.
    parameters:
      processor_id:
        $ref: '#/components/parameters/ProcessorId'
    messages:
      ProcessorProcessingTimeHwmMsMessage:
        $ref: '#/components/messages/ProcessorProcessingTimeHwmMsMessage'

  processorRulesEngineHwmMs:
    address: 'SkyFollower/processor/{processor_id}/statistic/rules_engine_hwm_ms'
    description: >
      Rules engine duration high-water mark since last publish; resets on
      publish. Published every telemetry_interval_seconds, retained.
    parameters:
      processor_id:
        $ref: '#/components/parameters/ProcessorId'
    messages:
      ProcessorRulesEngineHwmMsMessage:
        $ref: '#/components/messages/ProcessorRulesEngineHwmMsMessage'

  processorRabbitmqInputQueueDepthHwm:
    address: 'SkyFollower/processor/{processor_id}/statistic/rabbitmq_input_queue_depth_hwm'
    description: >
      High-water mark of this processor's RabbitMQ input queue depth since
      last publish, sampled at most once every 10 seconds; resets on
      publish. -1 if no valid sample landed this window. Published every
      telemetry_interval_seconds, retained.
    parameters:
      processor_id:
        $ref: '#/components/parameters/ProcessorId'
    messages:
      ProcessorRabbitmqInputQueueDepthHwmMessage:
        $ref: '#/components/messages/ProcessorRabbitmqInputQueueDepthHwmMessage'

  processorLocalArchiveQueueDepth:
    address: 'SkyFollower/processor/{processor_id}/statistic/local_archive_queue_depth'
    description: >
      Number of completed flights queued in the local SQLite fallback
      (completed_flights.db). Published every telemetry_interval_seconds,
      retained.
    parameters:
      processor_id:
        $ref: '#/components/parameters/ProcessorId'
    messages:
      ProcessorLocalArchiveQueueDepthMessage:
        $ref: '#/components/messages/ProcessorLocalArchiveQueueDepthMessage'

  processorRegistrationMissesHour:
    address: 'SkyFollower/processor/{processor_id}/statistic/registration_misses_hour'
    description: >
      Aircraft Redis cache misses this hour. Published every
      telemetry_interval_seconds, retained.
    parameters:
      processor_id:
        $ref: '#/components/parameters/ProcessorId'
    messages:
      ProcessorRegistrationMissesHourMessage:
        $ref: '#/components/messages/ProcessorRegistrationMissesHourMessage'

  processorRegistrationMissesToday:
    address: 'SkyFollower/processor/{processor_id}/statistic/registration_misses_today'
    description: >
      Aircraft Redis cache misses today (UTC). Published every
      telemetry_interval_seconds, retained.
    parameters:
      processor_id:
        $ref: '#/components/parameters/ProcessorId'
    messages:
      ProcessorRegistrationMissesTodayMessage:
        $ref: '#/components/messages/ProcessorRegistrationMissesTodayMessage'

  processorAircraftTypeMissesHour:
    address: 'SkyFollower/processor/{processor_id}/statistic/aircraft_type_misses_hour'
    description: >
      Aircraft type lookup misses this hour. Published every
      telemetry_interval_seconds, retained.
    parameters:
      processor_id:
        $ref: '#/components/parameters/ProcessorId'
    messages:
      ProcessorAircraftTypeMissesHourMessage:
        $ref: '#/components/messages/ProcessorAircraftTypeMissesHourMessage'

  processorAircraftTypeMissesToday:
    address: 'SkyFollower/processor/{processor_id}/statistic/aircraft_type_misses_today'
    description: >
      Aircraft type lookup misses today (UTC). Published every
      telemetry_interval_seconds, retained.
    parameters:
      processor_id:
        $ref: '#/components/parameters/ProcessorId'
    messages:
      ProcessorAircraftTypeMissesTodayMessage:
        $ref: '#/components/messages/ProcessorAircraftTypeMissesTodayMessage'

  processorActiveFlights:
    address: 'SkyFollower/processor/{processor_id}/statistic/active_flights'
    description: >
      Number of flights currently tracked in the in-memory SQLite store.
      Published every telemetry_interval_seconds, retained.
    parameters:
      processor_id:
        $ref: '#/components/parameters/ProcessorId'
    messages:
      ProcessorActiveFlightsMessage:
        $ref: '#/components/messages/ProcessorActiveFlightsMessage'

  processorStartedAt:
    address: 'SkyFollower/processor/{processor_id}/statistic/started_at'
    description: >
      UTC ISO-8601 timestamp of process start; never changes after startup.
      Published every telemetry_interval_seconds, retained.
    parameters:
      processor_id:
        $ref: '#/components/parameters/ProcessorId'
    messages:
      ProcessorStartedAtMessage:
        $ref: '#/components/messages/ProcessorStartedAtMessage'

  # ── Archive processor ─────────────────────────────────────────────────────

  archiveStatus:
    address: SkyFollower/archive/status
    description: >
      Archive processor liveness. Published ONLINE on connect and OFFLINE
      via LWT. Both messages are retained.
    messages:
      StatusMessage:
        $ref: '#/components/messages/StatusMessage'

  # One retained topic per stat (see #542), matching the receiver/processor
  # above.

  archiveFlightsArchivedHour:
    address: SkyFollower/archive/statistic/flights_archived_hour
    description: >
      Flights successfully written to S3 this hour. Published every
      telemetry_interval_seconds, retained.
    messages:
      ArchiveFlightsArchivedHourMessage:
        $ref: '#/components/messages/ArchiveFlightsArchivedHourMessage'

  archiveFlightsArchivedToday:
    address: SkyFollower/archive/statistic/flights_archived_today
    description: >
      Flights successfully written to S3 today (UTC). Published every
      telemetry_interval_seconds, retained.
    messages:
      ArchiveFlightsArchivedTodayMessage:
        $ref: '#/components/messages/ArchiveFlightsArchivedTodayMessage'

  archiveFlightsSkippedHour:
    address: SkyFollower/archive/statistic/flights_skipped_hour
    description: >
      MLAT-only flights dropped instead of archived this hour. Published
      every telemetry_interval_seconds, retained.
    messages:
      ArchiveFlightsSkippedHourMessage:
        $ref: '#/components/messages/ArchiveFlightsSkippedHourMessage'

  archiveFlightsSkippedToday:
    address: SkyFollower/archive/statistic/flights_skipped_today
    description: >
      MLAT-only flights dropped instead of archived today (UTC). Published
      every telemetry_interval_seconds, retained.
    messages:
      ArchiveFlightsSkippedTodayMessage:
        $ref: '#/components/messages/ArchiveFlightsSkippedTodayMessage'

  archiveS3Connected:
    address: SkyFollower/archive/statistic/s3_connected
    description: >
      Whether the last S3 write attempt succeeded. Published every
      telemetry_interval_seconds, retained.
    messages:
      ArchiveS3ConnectedMessage:
        $ref: '#/components/messages/ArchiveS3ConnectedMessage'

  archiveLocalQueueDepth:
    address: SkyFollower/archive/statistic/local_queue_depth
    description: >
      Number of completed flights queued in the local SQLite fallback
      (s3.db). Published every telemetry_interval_seconds, retained.
    messages:
      ArchiveLocalQueueDepthMessage:
        $ref: '#/components/messages/ArchiveLocalQueueDepthMessage'

  archiveLocalIndexQueueDepth:
    address: SkyFollower/archive/statistic/local_index_queue_depth
    description: >
      Number of Parquet index rows queued for retry (index_queue table in
      s3.db) after their flight object wrote successfully but the index
      write failed. Published every telemetry_interval_seconds, retained.
    messages:
      ArchiveLocalIndexQueueDepthMessage:
        $ref: '#/components/messages/ArchiveLocalIndexQueueDepthMessage'

  archiveRabbitmqArchiveQueueDepthHwm:
    address: SkyFollower/archive/statistic/rabbitmq_archive_queue_depth_hwm
    description: >
      High-water mark of the RabbitMQ 'archive' queue's depth since last
      publish, sampled at most once every 10 seconds; resets on publish. -1
      if no valid sample landed this window. Published every
      telemetry_interval_seconds, retained.
    messages:
      ArchiveRabbitmqArchiveQueueDepthHwmMessage:
        $ref: '#/components/messages/ArchiveRabbitmqArchiveQueueDepthHwmMessage'

  archiveStartedAt:
    address: SkyFollower/archive/statistic/started_at
    description: >
      UTC ISO-8601 timestamp of process start; never changes after startup.
      Published every telemetry_interval_seconds, retained.
    messages:
      ArchiveStartedAtMessage:
        $ref: '#/components/messages/ArchiveStartedAtMessage'

  # ── Archive compaction ────────────────────────────────────────────────────
  # Unlike receiver/processor/archive-processor's single combined-JSON
  # statistics payload, archive-compaction is a one-shot job (not a
  # long-running service) and publishes one retained topic per stat,
  # matching how it actually publishes in code -- each stat gets its own
  # channel/message/schema rather than being folded into one object.

  archiveCompactionFilesCompacted:
    address: SkyFollower/archive-compaction/statistic/files_compacted
    description: >
      Count of per-flight Parquet index files merged into this run's
      compacted output. Published once per run, retained.
    messages:
      ArchiveCompactionFilesCompactedMessage:
        $ref: '#/components/messages/ArchiveCompactionFilesCompactedMessage'

  archiveCompactionFilesDeleteFailed:
    address: SkyFollower/archive-compaction/statistic/files_delete_failed
    description: >
      Count of files included in this run's compacted output whose source
      delete call failed, and therefore still linger as duplicates.
      Published once per run, retained.
    messages:
      ArchiveCompactionFilesDeleteFailedMessage:
        $ref: '#/components/messages/ArchiveCompactionFilesDeleteFailedMessage'

  archiveCompactionLastRunAt:
    address: SkyFollower/archive-compaction/statistic/last_run_at
    description: >
      UTC ISO-8601 timestamp when this run completed. Published once per
      run, retained.
    messages:
      ArchiveCompactionLastRunAtMessage:
        $ref: '#/components/messages/ArchiveCompactionLastRunAtMessage'

  archiveCompactionLastRunStatus:
    address: SkyFollower/archive-compaction/statistic/last_run_status
    description: >
      Outcome of this run (success or failure). Published once per run,
      retained.
    messages:
      ArchiveCompactionLastRunStatusMessage:
        $ref: '#/components/messages/ArchiveCompactionLastRunStatusMessage'

  # ── Rule notifications ────────────────────────────────────────────────────

  ruleNotification:
    address: 'SkyFollower/rule/{identifier}'
    description: >
      Published by the processor when a rule matches a tracked flight. The
      identifier in the topic matches the rule's identifier field. Not
      retained.
    parameters:
      identifier:
        $ref: '#/components/parameters/RuleIdentifier'
    messages:
      FlightRuleNotificationMessage:
        $ref: '#/components/messages/FlightRuleNotificationMessage'

  # ── Data runners ──────────────────────────────────────────────────────────

  # A data runner publishes one retained topic per stat at the end of its
  # run, not a single combined JSON payload -- confirmed in
  # ourairports/main.py's publish_completion_stats(). These three
  # (records_imported, last_run_at, last_run_status) are the common
  # baseline every runner publishes; some runners (e.g. mictronics) publish
  # additional stats beyond this set.

  runnerRecordsImported:
    address: 'SkyFollower/runner/{runner_name}/statistic/records_imported'
    description: >
      Number of records written to Redis during this run. Published once
      per run, retained.
    parameters:
      runner_name:
        $ref: '#/components/parameters/RunnerName'
    messages:
      RunnerRecordsImportedMessage:
        $ref: '#/components/messages/RunnerRecordsImportedMessage'

  runnerLastRunAt:
    address: 'SkyFollower/runner/{runner_name}/statistic/last_run_at'
    description: >
      UTC ISO-8601 timestamp when the run completed. Published once per
      run, retained.
    parameters:
      runner_name:
        $ref: '#/components/parameters/RunnerName'
    messages:
      RunnerLastRunAtMessage:
        $ref: '#/components/messages/RunnerLastRunAtMessage'

  runnerLastRunStatus:
    address: 'SkyFollower/runner/{runner_name}/statistic/last_run_status'
    description: >
      Outcome of the run (success or failure). Published once per run,
      retained.
    parameters:
      runner_name:
        $ref: '#/components/parameters/RunnerName'
    messages:
      RunnerLastRunStatusMessage:
        $ref: '#/components/messages/RunnerLastRunStatusMessage'

# ---------------------------------------------------------------------------
# Operations
# ---------------------------------------------------------------------------

operations:

  publishReceiverStatus:
    action: send
    channel:
      $ref: '#/channels/receiverStatus'
    summary: Receiver publishes its online / offline status

  publishReceiverMessages1090PerSecond:
    action: send
    channel:
      $ref: '#/channels/receiverMessages1090PerSecond'
    summary: Receiver publishes the 1090 MHz message rate

  publishReceiverMessages978PerSecond:
    action: send
    channel:
      $ref: '#/channels/receiverMessages978PerSecond'
    summary: Receiver publishes the 978 MHz UAT message rate

  publishReceiverMessagesMlatPerSecond:
    action: send
    channel:
      $ref: '#/channels/receiverMessagesMlatPerSecond'
    summary: Receiver publishes the MLAT message rate

  publishReceiverLocalQueueDepth:
    action: send
    channel:
      $ref: '#/channels/receiverLocalQueueDepth'
    summary: Receiver publishes its local fallback queue depth

  publishReceiverRabbitmqConnected:
    action: send
    channel:
      $ref: '#/channels/receiverRabbitmqConnected'
    summary: Receiver publishes its RabbitMQ connectivity state

  publishReceiverStartedAt:
    action: send
    channel:
      $ref: '#/channels/receiverStartedAt'
    summary: Receiver publishes its process start time

  publishProcessorStatus:
    action: send
    channel:
      $ref: '#/channels/processorStatus'
    summary: Processor publishes its online / offline status

  publishProcessorMessagesPerSecond:
    action: send
    channel:
      $ref: '#/channels/processorMessagesPerSecond'
    summary: Processor publishes its message processing rate

  publishProcessorProcessingTimeHwmMs:
    action: send
    channel:
      $ref: '#/channels/processorProcessingTimeHwmMs'
    summary: Processor publishes its processing time high-water mark

  publishProcessorRulesEngineHwmMs:
    action: send
    channel:
      $ref: '#/channels/processorRulesEngineHwmMs'
    summary: Processor publishes its rules engine duration high-water mark

  publishProcessorRabbitmqInputQueueDepthHwm:
    action: send
    channel:
      $ref: '#/channels/processorRabbitmqInputQueueDepthHwm'
    summary: Processor publishes its RabbitMQ input queue depth high-water mark

  publishProcessorLocalArchiveQueueDepth:
    action: send
    channel:
      $ref: '#/channels/processorLocalArchiveQueueDepth'
    summary: Processor publishes its local archive fallback queue depth

  publishProcessorRegistrationMissesHour:
    action: send
    channel:
      $ref: '#/channels/processorRegistrationMissesHour'
    summary: Processor publishes hourly aircraft registration cache misses

  publishProcessorRegistrationMissesToday:
    action: send
    channel:
      $ref: '#/channels/processorRegistrationMissesToday'
    summary: Processor publishes today's aircraft registration cache misses

  publishProcessorAircraftTypeMissesHour:
    action: send
    channel:
      $ref: '#/channels/processorAircraftTypeMissesHour'
    summary: Processor publishes hourly aircraft type lookup misses

  publishProcessorAircraftTypeMissesToday:
    action: send
    channel:
      $ref: '#/channels/processorAircraftTypeMissesToday'
    summary: Processor publishes today's aircraft type lookup misses

  publishProcessorActiveFlights:
    action: send
    channel:
      $ref: '#/channels/processorActiveFlights'
    summary: Processor publishes its count of currently tracked flights

  publishProcessorStartedAt:
    action: send
    channel:
      $ref: '#/channels/processorStartedAt'
    summary: Processor publishes its process start time

  publishArchiveStatus:
    action: send
    channel:
      $ref: '#/channels/archiveStatus'
    summary: Archive processor publishes its online / offline status

  publishArchiveFlightsArchivedHour:
    action: send
    channel:
      $ref: '#/channels/archiveFlightsArchivedHour'
    summary: Archive processor publishes hourly flights archived

  publishArchiveFlightsArchivedToday:
    action: send
    channel:
      $ref: '#/channels/archiveFlightsArchivedToday'
    summary: Archive processor publishes today's flights archived

  publishArchiveFlightsSkippedHour:
    action: send
    channel:
      $ref: '#/channels/archiveFlightsSkippedHour'
    summary: Archive processor publishes hourly MLAT-only flights skipped

  publishArchiveFlightsSkippedToday:
    action: send
    channel:
      $ref: '#/channels/archiveFlightsSkippedToday'
    summary: Archive processor publishes today's MLAT-only flights skipped

  publishArchiveS3Connected:
    action: send
    channel:
      $ref: '#/channels/archiveS3Connected'
    summary: Archive processor publishes its S3 connectivity state

  publishArchiveLocalQueueDepth:
    action: send
    channel:
      $ref: '#/channels/archiveLocalQueueDepth'
    summary: Archive processor publishes its local fallback queue depth

  publishArchiveLocalIndexQueueDepth:
    action: send
    channel:
      $ref: '#/channels/archiveLocalIndexQueueDepth'
    summary: Archive processor publishes its local index-retry queue depth

  publishArchiveRabbitmqArchiveQueueDepthHwm:
    action: send
    channel:
      $ref: '#/channels/archiveRabbitmqArchiveQueueDepthHwm'
    summary: Archive processor publishes its RabbitMQ archive queue depth high-water mark

  publishArchiveStartedAt:
    action: send
    channel:
      $ref: '#/channels/archiveStartedAt'
    summary: Archive processor publishes its process start time

  publishArchiveCompactionFilesCompacted:
    action: send
    channel:
      $ref: '#/channels/archiveCompactionFilesCompacted'
    summary: Archive compaction publishes the files-compacted count for this run

  publishArchiveCompactionFilesDeleteFailed:
    action: send
    channel:
      $ref: '#/channels/archiveCompactionFilesDeleteFailed'
    summary: Archive compaction publishes the files-delete-failed count for this run

  publishArchiveCompactionLastRunAt:
    action: send
    channel:
      $ref: '#/channels/archiveCompactionLastRunAt'
    summary: Archive compaction publishes the completion timestamp for this run

  publishArchiveCompactionLastRunStatus:
    action: send
    channel:
      $ref: '#/channels/archiveCompactionLastRunStatus'
    summary: Archive compaction publishes the outcome of this run

  publishRuleNotification:
    action: send
    channel:
      $ref: '#/channels/ruleNotification'
    summary: Processor publishes a rule match notification

  publishRunnerRecordsImported:
    action: send
    channel:
      $ref: '#/channels/runnerRecordsImported'
    summary: Data runner publishes its imported record count

  publishRunnerLastRunAt:
    action: send
    channel:
      $ref: '#/channels/runnerLastRunAt'
    summary: Data runner publishes its completion timestamp

  publishRunnerLastRunStatus:
    action: send
    channel:
      $ref: '#/channels/runnerLastRunStatus'
    summary: Data runner publishes its run outcome

components:

  # ---------------------------------------------------------------------------
  # Messages
  # ---------------------------------------------------------------------------

  messages:

    StatusMessage:
      name: StatusMessage
      title: Component status
      summary: LWT-pattern ONLINE / OFFLINE indicator, retained
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/StatusPayload'

    ReceiverMessages1090PerSecondMessage:
      name: ReceiverMessages1090PerSecondMessage
      title: Receiver 1090 MHz message rate
      summary: Average 1090 MHz message rate since last report
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverMessages1090PerSecond'

    ReceiverMessages978PerSecondMessage:
      name: ReceiverMessages978PerSecondMessage
      title: Receiver 978 MHz UAT message rate
      summary: Average 978 MHz UAT message rate since last report
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverMessages978PerSecond'

    ReceiverMessagesMlatPerSecondMessage:
      name: ReceiverMessagesMlatPerSecondMessage
      title: Receiver MLAT message rate
      summary: Average MLAT message rate since last report
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverMessagesMlatPerSecond'

    ReceiverLocalQueueDepthMessage:
      name: ReceiverLocalQueueDepthMessage
      title: Receiver local queue depth
      summary: Messages queued in the local SQLite fallback (queue.db)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverLocalQueueDepth'

    ReceiverRabbitmqConnectedMessage:
      name: ReceiverRabbitmqConnectedMessage
      title: Receiver RabbitMQ connectivity
      summary: Whether the receiver has an active RabbitMQ connection
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverRabbitmqConnected'

    ReceiverStartedAtMessage:
      name: ReceiverStartedAtMessage
      title: Receiver process start time
      summary: UTC ISO-8601 timestamp of process start
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverStartedAt'

    ProcessorMessagesPerSecondMessage:
      name: ProcessorMessagesPerSecondMessage
      title: Processor message rate
      summary: Average message processing rate since last report
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ProcessorMessagesPerSecond'

    ProcessorProcessingTimeHwmMsMessage:
      name: ProcessorProcessingTimeHwmMsMessage
      title: Processor processing time high-water mark
      summary: End-to-end message processing time high-water mark since last publish
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ProcessorProcessingTimeHwmMs'

    ProcessorRulesEngineHwmMsMessage:
      name: ProcessorRulesEngineHwmMsMessage
      title: Processor rules engine duration high-water mark
      summary: Rules engine duration high-water mark since last publish
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ProcessorRulesEngineHwmMs'

    ProcessorRabbitmqInputQueueDepthHwmMessage:
      name: ProcessorRabbitmqInputQueueDepthHwmMessage
      title: Processor RabbitMQ input queue depth high-water mark
      summary: High-water mark of this processor's RabbitMQ input queue depth
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ProcessorRabbitmqInputQueueDepthHwm'

    ProcessorLocalArchiveQueueDepthMessage:
      name: ProcessorLocalArchiveQueueDepthMessage
      title: Processor local archive queue depth
