asyncapi: '3.1.0'
info:
  title: SkyFollower
  version: '9999.99.99'
  description: >
    ADS-B aircraft tracking and alerting system.
    Every component publishes one retained MQTT topic per statistic
    (SkyFollower/{component}/statistic/{name}) as a plain-text value —
    booleans as "True"/"False", numbers as their string representation —
    rather than a single combined JSON payload; only structured payloads
    like the rule match notification use application/json. All timestamps
    are UTC ISO-8601.

servers:
  mqtt:
    host: localhost:1883
    protocol: mqtt
    description: >
      MQTT broker (e.g. Home Assistant Mosquitto). Replace host/port with
      your broker's address. TLS and authentication are deployment-specific
      runtime concerns.

# ---------------------------------------------------------------------------
# Channels
# ---------------------------------------------------------------------------

channels:

  # ── Receiver ──────────────────────────────────────────────────────────────

  receiverStatus:
    address: 'SkyFollower/receiver/{receiver_id}/status'
    description: >
      Receiver liveness. Published ONLINE on connect and OFFLINE via LWT.
      Both messages are retained. Multiple receiver instances are
      distinguished by receiver_id.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      StatusMessage:
        $ref: '#/components/messages/StatusMessage'

  # Rather than a single combined-JSON statistics payload, the receiver
  # publishes one retained topic per stat, matching how archive-compaction
  # and every data runner already publish -- each stat gets its own
  # channel/message/schema rather than being folded into one object.

  receiverMessages1090PerSecond:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/messages_1090_per_second'
    description: >
      Average 1090 MHz message rate since last report. Published every
      telemetry_interval_seconds, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverMessages1090PerSecondMessage:
        $ref: '#/components/messages/ReceiverMessages1090PerSecondMessage'

  receiverMessages978PerSecond:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/messages_978_per_second'
    description: >
      Average 978 MHz UAT message rate since last report. Only published if
      a 978 source is configured. Published every telemetry_interval_seconds,
      retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverMessages978PerSecondMessage:
        $ref: '#/components/messages/ReceiverMessages978PerSecondMessage'

  receiverMessagesMlatPerSecond:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/messages_MLAT_per_second'
    description: >
      Average MLAT message rate since last report. Only published if an
      MLAT source is configured. Published every telemetry_interval_seconds,
      retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverMessagesMlatPerSecondMessage:
        $ref: '#/components/messages/ReceiverMessagesMlatPerSecondMessage'

  receiverLocalQueueDepth:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/local_queue_depth'
    description: >
      Number of messages queued in the local SQLite fallback (queue.db).
      Published every telemetry_interval_seconds, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverLocalQueueDepthMessage:
        $ref: '#/components/messages/ReceiverLocalQueueDepthMessage'

  receiverDeadLetterQueueDepth:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/dead_letter_queue_depth'
    description: >
      Number of messages dead-lettered from the local SQLite fallback after
      repeatedly failing to publish -- files under dead_letters/queue/ in
      data_dir, not counted in local_queue_depth. Published every
      telemetry_interval_seconds, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverDeadLetterQueueDepthMessage:
        $ref: '#/components/messages/ReceiverDeadLetterQueueDepthMessage'

  receiverRabbitmqConnected:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/rabbitmq_connected'
    description: >
      Whether the receiver currently has an active RabbitMQ connection.
      Published every telemetry_interval_seconds, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverRabbitmqConnectedMessage:
        $ref: '#/components/messages/ReceiverRabbitmqConnectedMessage'

  receiverStartedAt:
    address: 'SkyFollower/receiver/{receiver_id}/statistic/started_at'
    description: >
      UTC ISO-8601 timestamp of process start; never changes after startup.
      Published every telemetry_interval_seconds, retained.
    parameters:
      receiver_id:
        $ref: '#/components/parameters/ReceiverId'
    messages:
      ReceiverStartedAtMessage:
        $ref: '#/components/messages/ReceiverStartedAtMessage'

  # ── Message Processor ─────────────────────────────────────────────────────

  messageProcessorStatus:
    address: 'SkyFollower/message-processor/{message_processor_id}/status'
    description: >
      Per-message-processor liveness. Published ONLINE on connect and OFFLINE
      via LWT. Both messages are retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      StatusMessage:
        $ref: '#/components/messages/StatusMessage'

  # One retained topic per stat, matching the receiver above.

  messageProcessorMessagesPerSecond:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/messages_per_second'
    description: >
      Average message processing rate since last report. Published every
      telemetry_interval_seconds, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorMessagesPerSecondMessage:
        $ref: '#/components/messages/MessageProcessorMessagesPerSecondMessage'

  messageProcessorProcessingTimeHwmMs:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/processing_time_hwm_ms'
    description: >
      End-to-end message processing time high-water mark since last publish;
      resets on publish. Published every telemetry_interval_seconds, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorProcessingTimeHwmMsMessage:
        $ref: '#/components/messages/MessageProcessorProcessingTimeHwmMsMessage'

  messageProcessorRulesEngineHwmMs:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/rules_engine_hwm_ms'
    description: >
      Rules engine duration high-water mark since last publish; resets on
      publish. Published every telemetry_interval_seconds, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorRulesEngineHwmMsMessage:
        $ref: '#/components/messages/MessageProcessorRulesEngineHwmMsMessage'

  messageProcessorRabbitmqInputQueueDepthHwm:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/rabbitmq_input_queue_depth_hwm'
    description: >
      High-water mark of this message processor's RabbitMQ input queue depth since
      last publish, sampled at most once every 10 seconds; resets on
      publish. -1 if no valid sample landed this window. Published every
      telemetry_interval_seconds, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorRabbitmqInputQueueDepthHwmMessage:
        $ref: '#/components/messages/MessageProcessorRabbitmqInputQueueDepthHwmMessage'

  messageProcessorLocalArchiveQueueDepth:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/local_archive_queue_depth'
    description: >
      Number of completed flights queued in the local SQLite fallback
      (completed_flights.db). Published every telemetry_interval_seconds,
      retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorLocalArchiveQueueDepthMessage:
        $ref: '#/components/messages/MessageProcessorLocalArchiveQueueDepthMessage'

  messageProcessorDeadLetterQueueDepth:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/dead_letter_queue_depth'
    description: >
      Number of completed flights dead-lettered from the local SQLite
      archive fallback after repeatedly failing to publish -- files under
      dead_letters/queue/ in data_dir, not counted in
      local_archive_queue_depth. Published every telemetry_interval_seconds,
      retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorDeadLetterQueueDepthMessage:
        $ref: '#/components/messages/MessageProcessorDeadLetterQueueDepthMessage'

  messageProcessorRegistrationMissesHour:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/registration_misses_hour'
    description: >
      Aircraft Redis cache misses this hour. Published every
      telemetry_interval_seconds, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorRegistrationMissesHourMessage:
        $ref: '#/components/messages/MessageProcessorRegistrationMissesHourMessage'

  messageProcessorRegistrationMissesToday:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/registration_misses_today'
    description: >
      Aircraft Redis cache misses today (UTC). Published every
      telemetry_interval_seconds, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorRegistrationMissesTodayMessage:
        $ref: '#/components/messages/MessageProcessorRegistrationMissesTodayMessage'

  messageProcessorAircraftTypeMissesHour:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/aircraft_type_misses_hour'
    description: >
      Aircraft type lookup misses this hour. Published every
      telemetry_interval_seconds, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorAircraftTypeMissesHourMessage:
        $ref: '#/components/messages/MessageProcessorAircraftTypeMissesHourMessage'

  messageProcessorAircraftTypeMissesToday:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/aircraft_type_misses_today'
    description: >
      Aircraft type lookup misses today (UTC). Published every
      telemetry_interval_seconds, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorAircraftTypeMissesTodayMessage:
        $ref: '#/components/messages/MessageProcessorAircraftTypeMissesTodayMessage'

  messageProcessorActiveFlights:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/active_flights'
    description: >
      Number of flights currently tracked in the in-memory SQLite store.
      Published every telemetry_interval_seconds, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorActiveFlightsMessage:
        $ref: '#/components/messages/MessageProcessorActiveFlightsMessage'

  messageProcessorStartedAt:
    address: 'SkyFollower/message-processor/{message_processor_id}/statistic/started_at'
    description: >
      UTC ISO-8601 timestamp of process start; never changes after startup.
      Published every telemetry_interval_seconds, retained.
    parameters:
      message_processor_id:
        $ref: '#/components/parameters/MessageProcessorId'
    messages:
      MessageProcessorStartedAtMessage:
        $ref: '#/components/messages/MessageProcessorStartedAtMessage'

  # ── Archive processor ─────────────────────────────────────────────────────

  archiveStatus:
    address: SkyFollower/archive/status
    description: >
      Archive processor liveness. Published ONLINE on connect and OFFLINE
      via LWT. Both messages are retained.
    messages:
      StatusMessage:
        $ref: '#/components/messages/StatusMessage'

  # One retained topic per stat, matching the receiver/message processor
  # above.

  archiveFlightsArchivedHour:
    address: SkyFollower/archive/statistic/flights_archived_hour
    description: >
      Flights successfully written to S3 this hour. Published every
      telemetry_interval_seconds, retained.
    messages:
      ArchiveFlightsArchivedHourMessage:
        $ref: '#/components/messages/ArchiveFlightsArchivedHourMessage'

  archiveFlightsArchivedToday:
    address: SkyFollower/archive/statistic/flights_archived_today
    description: >
      Flights successfully written to S3 today (UTC). Published every
      telemetry_interval_seconds, retained.
    messages:
      ArchiveFlightsArchivedTodayMessage:
        $ref: '#/components/messages/ArchiveFlightsArchivedTodayMessage'

  archiveFlightsSkippedHour:
    address: SkyFollower/archive/statistic/flights_skipped_hour
    description: >
      MLAT-only flights dropped instead of archived this hour. Published
      every telemetry_interval_seconds, retained.
    messages:
      ArchiveFlightsSkippedHourMessage:
        $ref: '#/components/messages/ArchiveFlightsSkippedHourMessage'

  archiveFlightsSkippedToday:
    address: SkyFollower/archive/statistic/flights_skipped_today
    description: >
      MLAT-only flights dropped instead of archived today (UTC). Published
      every telemetry_interval_seconds, retained.
    messages:
      ArchiveFlightsSkippedTodayMessage:
        $ref: '#/components/messages/ArchiveFlightsSkippedTodayMessage'

  archiveS3Connected:
    address: SkyFollower/archive/statistic/s3_connected
    description: >
      Whether the last S3 write attempt succeeded. Published every
      telemetry_interval_seconds, retained.
    messages:
      ArchiveS3ConnectedMessage:
        $ref: '#/components/messages/ArchiveS3ConnectedMessage'

  archiveLocalQueueDepth:
    address: SkyFollower/archive/statistic/local_queue_depth
    description: >
      Number of completed flights queued in the local SQLite fallback
      (s3.db). Published every telemetry_interval_seconds, retained.
    messages:
      ArchiveLocalQueueDepthMessage:
        $ref: '#/components/messages/ArchiveLocalQueueDepthMessage'

  archiveLocalIndexQueueDepth:
    address: SkyFollower/archive/statistic/local_index_queue_depth
    description: >
      Number of Parquet index rows queued for retry (index_queue table in
      s3.db) after their flight object wrote successfully but the index
      write failed. Published every telemetry_interval_seconds, retained.
    messages:
      ArchiveLocalIndexQueueDepthMessage:
        $ref: '#/components/messages/ArchiveLocalIndexQueueDepthMessage'

  archiveDeadLetterQueueDepth:
    address: SkyFollower/archive/statistic/dead_letter_queue_depth
    description: >
      Number of completed flights dead-lettered from the local SQLite
      fallback (s3.db) after repeatedly failing to write to S3 -- files
      under dead_letters/queue/ in data_dir, not counted in
      local_queue_depth. Published every telemetry_interval_seconds,
      retained.
    messages:
      ArchiveDeadLetterQueueDepthMessage:
        $ref: '#/components/messages/ArchiveDeadLetterQueueDepthMessage'

  archiveDeadLetterIndexQueueDepth:
    address: SkyFollower/archive/statistic/dead_letter_index_queue_depth
    description: >
      Number of Parquet index rows dead-lettered (index_queue table in
      s3.db) after repeatedly failing to write -- files under
      dead_letters/index_queue/ in data_dir, not counted in
      local_index_queue_depth. Published every telemetry_interval_seconds,
      retained.
    messages:
      ArchiveDeadLetterIndexQueueDepthMessage:
        $ref: '#/components/messages/ArchiveDeadLetterIndexQueueDepthMessage'

  archiveRabbitmqArchiveQueueDepthHwm:
    address: SkyFollower/archive/statistic/rabbitmq_archive_queue_depth_hwm
    description: >
      High-water mark of the RabbitMQ 'archive' queue's depth since last
      publish, sampled at most once every 10 seconds; resets on publish. -1
      if no valid sample landed this window. Published every
      telemetry_interval_seconds, retained.
    messages:
      ArchiveRabbitmqArchiveQueueDepthHwmMessage:
        $ref: '#/components/messages/ArchiveRabbitmqArchiveQueueDepthHwmMessage'

  archiveStartedAt:
    address: SkyFollower/archive/statistic/started_at
    description: >
      UTC ISO-8601 timestamp of process start; never changes after startup.
      Published every telemetry_interval_seconds, retained.
    messages:
      ArchiveStartedAtMessage:
        $ref: '#/components/messages/ArchiveStartedAtMessage'

  # ── Archive compaction ────────────────────────────────────────────────────
  # Unlike receiver/processor/archive-processor's single combined-JSON
  # statistics payload, archive-compaction is a one-shot job (not a
  # long-running service) and publishes one retained topic per stat,
  # matching how it actually publishes in code -- each stat gets its own
  # channel/message/schema rather than being folded into one object.

  archiveCompactionFilesCompacted:
    address: SkyFollower/archive-compaction/statistic/files_compacted
    description: >
      Count of per-flight Parquet index files merged into this run's
      compacted output(s), summed across every date compacted this run.
      Published once per run, retained.
    messages:
      ArchiveCompactionFilesCompactedMessage:
        $ref: '#/components/messages/ArchiveCompactionFilesCompactedMessage'

  archiveCompactionFilesDeleteFailed:
    address: SkyFollower/archive-compaction/statistic/files_delete_failed
    description: >
      Count of files included in a compacted output whose source delete
      call failed, and therefore still linger as duplicates, summed across
      every date compacted this run. Published once per run, retained.
    messages:
      ArchiveCompactionFilesDeleteFailedMessage:
        $ref: '#/components/messages/ArchiveCompactionFilesDeleteFailedMessage'

  archiveCompactionDaysCompacted:
    address: SkyFollower/archive-compaction/statistic/days_compacted
    description: >
      Number of date partitions successfully compacted this run -- more
      than one when catching up after a gap. Published once per run,
      retained.
    messages:
      ArchiveCompactionDaysCompactedMessage:
        $ref: '#/components/messages/ArchiveCompactionDaysCompactedMessage'

  archiveCompactionLastCompactedDate:
    address: SkyFollower/archive-compaction/statistic/last_compacted_date
    description: >
      The watermark after this run: the most recent UTC date (YYYY-MM-DD)
      whose partition has been fully compacted. Published once per run,
      retained.
    messages:
      ArchiveCompactionLastCompactedDateMessage:
        $ref: '#/components/messages/ArchiveCompactionLastCompactedDateMessage'

  archiveCompactionMismatchDate:
    address: SkyFollower/archive-compaction/statistic/mismatch_date
    description: >
      UTC date (YYYY-MM-DD) this run stopped at due to a flight/index
      parity mismatch. Empty string when the run wasn't stopped by one.
      Published once per run, retained.
    messages:
      ArchiveCompactionMismatchDateMessage:
        $ref: '#/components/messages/ArchiveCompactionMismatchDateMessage'

  archiveCompactionMismatchUuids:
    address: SkyFollower/archive-compaction/statistic/mismatch_uuids
    description: >
      Comma-separated flight UUIDs missing their Parquet index row on
      mismatch_date -- a starting point for manual investigation. Empty
      string when the run wasn't stopped by a mismatch. Published once per
      run, retained.
    messages:
      ArchiveCompactionMismatchUuidsMessage:
        $ref: '#/components/messages/ArchiveCompactionMismatchUuidsMessage'

  archiveCompactionLastRunAt:
    address: SkyFollower/archive-compaction/statistic/last_run_at
    description: >
      UTC ISO-8601 timestamp when this run completed. Published once per
      run, retained. Home Assistant discovery configures this sensor with
      device_class: timestamp.
    messages:
      ArchiveCompactionLastRunAtMessage:
        $ref: '#/components/messages/ArchiveCompactionLastRunAtMessage'

  archiveCompactionLastRunStatus:
    address: SkyFollower/archive-compaction/statistic/last_run_status
    description: >
      Outcome of this run: Success, Failure (an exception, e.g. an S3
      error), or Mismatch (completed without error but stopped early on a
      flight/index parity mismatch -- see mismatch_date/mismatch_uuids).
      Published once per run, retained.
    messages:
      ArchiveCompactionLastRunStatusMessage:
        $ref: '#/components/messages/ArchiveCompactionLastRunStatusMessage'

  # ── Rule notifications ────────────────────────────────────────────────────

  ruleNotification:
    address: 'SkyFollower/rule/{identifier}'
    description: >
      Published by the message processor when a rule matches a tracked flight. The
      identifier in the topic matches the rule's identifier field. Not
      retained.
    parameters:
      identifier:
        $ref: '#/components/parameters/RuleIdentifier'
    messages:
      FlightRuleNotificationMessage:
        $ref: '#/components/messages/FlightRuleNotificationMessage'

  # ── Data runners ──────────────────────────────────────────────────────────

  # A data runner publishes one retained topic per stat at the end of its
  # run, not a single combined JSON payload -- confirmed in
  # ourairports/main.py's publish_completion_stats(). These three
  # (records_imported, last_run_at, last_run_status) are the common
  # baseline every runner publishes; some runners (e.g. mictronics) publish
  # additional stats beyond this set.

  runnerRecordsImported:
    address: 'SkyFollower/runner/{runner_name}/statistic/records_imported'
    description: >
      Number of records written to Redis during this run. Published once
      per run, retained.
    parameters:
      runner_name:
        $ref: '#/components/parameters/RunnerName'
    messages:
      RunnerRecordsImportedMessage:
        $ref: '#/components/messages/RunnerRecordsImportedMessage'

  runnerLastRunAt:
    address: 'SkyFollower/runner/{runner_name}/statistic/last_run_at'
    description: >
      UTC ISO-8601 timestamp when the run completed. Published once per
      run, retained. Home Assistant discovery configures this sensor with
      device_class: timestamp.
    parameters:
      runner_name:
        $ref: '#/components/parameters/RunnerName'
    messages:
      RunnerLastRunAtMessage:
        $ref: '#/components/messages/RunnerLastRunAtMessage'

  runnerLastRunStatus:
    address: 'SkyFollower/runner/{runner_name}/statistic/last_run_status'
    description: >
      Outcome of the run (Success or Failure). Published once per run,
      retained.
    parameters:
      runner_name:
        $ref: '#/components/parameters/RunnerName'
    messages:
      RunnerLastRunStatusMessage:
        $ref: '#/components/messages/RunnerLastRunStatusMessage'

# ---------------------------------------------------------------------------
# Operations
# ---------------------------------------------------------------------------

operations:

  publishReceiverStatus:
    action: send
    channel:
      $ref: '#/channels/receiverStatus'
    summary: Receiver publishes its online / offline status

  publishReceiverMessages1090PerSecond:
    action: send
    channel:
      $ref: '#/channels/receiverMessages1090PerSecond'
    summary: Receiver publishes the 1090 MHz message rate

  publishReceiverMessages978PerSecond:
    action: send
    channel:
      $ref: '#/channels/receiverMessages978PerSecond'
    summary: Receiver publishes the 978 MHz UAT message rate

  publishReceiverMessagesMlatPerSecond:
    action: send
    channel:
      $ref: '#/channels/receiverMessagesMlatPerSecond'
    summary: Receiver publishes the MLAT message rate

  publishReceiverLocalQueueDepth:
    action: send
    channel:
      $ref: '#/channels/receiverLocalQueueDepth'
    summary: Receiver publishes its local fallback queue depth

  publishReceiverDeadLetterQueueDepth:
    action: send
    channel:
      $ref: '#/channels/receiverDeadLetterQueueDepth'
    summary: Receiver publishes its dead-lettered (permanently poison) message count

  publishReceiverRabbitmqConnected:
    action: send
    channel:
      $ref: '#/channels/receiverRabbitmqConnected'
    summary: Receiver publishes its RabbitMQ connectivity state

  publishReceiverStartedAt:
    action: send
    channel:
      $ref: '#/channels/receiverStartedAt'
    summary: Receiver publishes its process start time

  publishMessageProcessorStatus:
    action: send
    channel:
      $ref: '#/channels/messageProcessorStatus'
    summary: Message processor publishes its online / offline status

  publishMessageProcessorMessagesPerSecond:
    action: send
    channel:
      $ref: '#/channels/messageProcessorMessagesPerSecond'
    summary: Message processor publishes its message processing rate

  publishMessageProcessorProcessingTimeHwmMs:
    action: send
    channel:
      $ref: '#/channels/messageProcessorProcessingTimeHwmMs'
    summary: Message processor publishes its processing time high-water mark

  publishMessageProcessorRulesEngineHwmMs:
    action: send
    channel:
      $ref: '#/channels/messageProcessorRulesEngineHwmMs'
    summary: Message processor publishes its rules engine duration high-water mark

  publishMessageProcessorRabbitmqInputQueueDepthHwm:
    action: send
    channel:
      $ref: '#/channels/messageProcessorRabbitmqInputQueueDepthHwm'
    summary: Message processor publishes its RabbitMQ input queue depth high-water mark

  publishMessageProcessorLocalArchiveQueueDepth:
    action: send
    channel:
      $ref: '#/channels/messageProcessorLocalArchiveQueueDepth'
    summary: Message processor publishes its local archive fallback queue depth

  publishMessageProcessorDeadLetterQueueDepth:
    action: send
    channel:
      $ref: '#/channels/messageProcessorDeadLetterQueueDepth'
    summary: Message processor publishes its dead-lettered (permanently poison) flight count

  publishMessageProcessorRegistrationMissesHour:
    action: send
    channel:
      $ref: '#/channels/messageProcessorRegistrationMissesHour'
    summary: Message processor publishes hourly aircraft registration cache misses

  publishMessageProcessorRegistrationMissesToday:
    action: send
    channel:
      $ref: '#/channels/messageProcessorRegistrationMissesToday'
    summary: Message processor publishes today's aircraft registration cache misses

  publishMessageProcessorAircraftTypeMissesHour:
    action: send
    channel:
      $ref: '#/channels/messageProcessorAircraftTypeMissesHour'
    summary: Message processor publishes hourly aircraft type lookup misses

  publishMessageProcessorAircraftTypeMissesToday:
    action: send
    channel:
      $ref: '#/channels/messageProcessorAircraftTypeMissesToday'
    summary: Message processor publishes today's aircraft type lookup misses

  publishMessageProcessorActiveFlights:
    action: send
    channel:
      $ref: '#/channels/messageProcessorActiveFlights'
    summary: Message processor publishes its count of currently tracked flights

  publishMessageProcessorStartedAt:
    action: send
    channel:
      $ref: '#/channels/messageProcessorStartedAt'
    summary: Message processor publishes its process start time

  publishArchiveStatus:
    action: send
    channel:
      $ref: '#/channels/archiveStatus'
    summary: Archive processor publishes its online / offline status

  publishArchiveFlightsArchivedHour:
    action: send
    channel:
      $ref: '#/channels/archiveFlightsArchivedHour'
    summary: Archive processor publishes hourly flights archived

  publishArchiveFlightsArchivedToday:
    action: send
    channel:
      $ref: '#/channels/archiveFlightsArchivedToday'
    summary: Archive processor publishes today's flights archived

  publishArchiveFlightsSkippedHour:
    action: send
    channel:
      $ref: '#/channels/archiveFlightsSkippedHour'
    summary: Archive processor publishes hourly MLAT-only flights skipped

  publishArchiveFlightsSkippedToday:
    action: send
    channel:
      $ref: '#/channels/archiveFlightsSkippedToday'
    summary: Archive processor publishes today's MLAT-only flights skipped

  publishArchiveS3Connected:
    action: send
    channel:
      $ref: '#/channels/archiveS3Connected'
    summary: Archive processor publishes its S3 connectivity state

  publishArchiveLocalQueueDepth:
    action: send
    channel:
      $ref: '#/channels/archiveLocalQueueDepth'
    summary: Archive processor publishes its local fallback queue depth

  publishArchiveLocalIndexQueueDepth:
    action: send
    channel:
      $ref: '#/channels/archiveLocalIndexQueueDepth'
    summary: Archive processor publishes its local index-retry queue depth

  publishArchiveDeadLetterQueueDepth:
    action: send
    channel:
      $ref: '#/channels/archiveDeadLetterQueueDepth'
    summary: Archive processor publishes its dead-lettered (permanently poison) flight count

  publishArchiveDeadLetterIndexQueueDepth:
    action: send
    channel:
      $ref: '#/channels/archiveDeadLetterIndexQueueDepth'
    summary: Archive processor publishes its dead-lettered (permanently poison) index-row count

  publishArchiveRabbitmqArchiveQueueDepthHwm:
    action: send
    channel:
      $ref: '#/channels/archiveRabbitmqArchiveQueueDepthHwm'
    summary: Archive processor publishes its RabbitMQ archive queue depth high-water mark

  publishArchiveStartedAt:
    action: send
    channel:
      $ref: '#/channels/archiveStartedAt'
    summary: Archive processor publishes its process start time

  publishArchiveCompactionFilesCompacted:
    action: send
    channel:
      $ref: '#/channels/archiveCompactionFilesCompacted'
    summary: Archive compaction publishes the files-compacted count for this run

  publishArchiveCompactionFilesDeleteFailed:
    action: send
    channel:
      $ref: '#/channels/archiveCompactionFilesDeleteFailed'
    summary: Archive compaction publishes the files-delete-failed count for this run

  publishArchiveCompactionDaysCompacted:
    action: send
    channel:
      $ref: '#/channels/archiveCompactionDaysCompacted'
    summary: Archive compaction publishes the number of date partitions compacted this run

  publishArchiveCompactionLastCompactedDate:
    action: send
    channel:
      $ref: '#/channels/archiveCompactionLastCompactedDate'
    summary: Archive compaction publishes its watermark date

  publishArchiveCompactionMismatchDate:
    action: send
    channel:
      $ref: '#/channels/archiveCompactionMismatchDate'
    summary: Archive compaction publishes the date it stopped at, if a parity mismatch occurred

  publishArchiveCompactionMismatchUuids:
    action: send
    channel:
      $ref: '#/channels/archiveCompactionMismatchUuids'
    summary: Archive compaction publishes the flight UUIDs missing their index row, if a parity mismatch occurred

  publishArchiveCompactionLastRunAt:
    action: send
    channel:
      $ref: '#/channels/archiveCompactionLastRunAt'
    summary: Archive compaction publishes the completion timestamp for this run

  publishArchiveCompactionLastRunStatus:
    action: send
    channel:
      $ref: '#/channels/archiveCompactionLastRunStatus'
    summary: Archive compaction publishes the outcome of this run

  publishRuleNotification:
    action: send
    channel:
      $ref: '#/channels/ruleNotification'
    summary: Message processor publishes a rule match notification

  publishRunnerRecordsImported:
    action: send
    channel:
      $ref: '#/channels/runnerRecordsImported'
    summary: Data runner publishes its imported record count

  publishRunnerLastRunAt:
    action: send
    channel:
      $ref: '#/channels/runnerLastRunAt'
    summary: Data runner publishes its completion timestamp

  publishRunnerLastRunStatus:
    action: send
    channel:
      $ref: '#/channels/runnerLastRunStatus'
    summary: Data runner publishes its run outcome

components:

  # ---------------------------------------------------------------------------
  # Messages
  # ---------------------------------------------------------------------------

  messages:

    StatusMessage:
      name: StatusMessage
      title: Component status
      summary: LWT-pattern ONLINE / OFFLINE indicator, retained
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/StatusPayload'

    ReceiverMessages1090PerSecondMessage:
      name: ReceiverMessages1090PerSecondMessage
      title: Receiver 1090 MHz message rate
      summary: Average 1090 MHz message rate since last report
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverMessages1090PerSecond'

    ReceiverMessages978PerSecondMessage:
      name: ReceiverMessages978PerSecondMessage
      title: Receiver 978 MHz UAT message rate
      summary: Average 978 MHz UAT message rate since last report
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverMessages978PerSecond'

    ReceiverMessagesMlatPerSecondMessage:
      name: ReceiverMessagesMlatPerSecondMessage
      title: Receiver MLAT message rate
      summary: Average MLAT message rate since last report
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverMessagesMlatPerSecond'

    ReceiverLocalQueueDepthMessage:
      name: ReceiverLocalQueueDepthMessage
      title: Receiver local queue depth
      summary: Messages queued in the local SQLite fallback (queue.db)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverLocalQueueDepth'

    ReceiverDeadLetterQueueDepthMessage:
      name: ReceiverDeadLetterQueueDepthMessage
      title: Receiver dead-letter queue depth
      summary: Messages dead-lettered from the local SQLite fallback after repeatedly failing to publish
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverDeadLetterQueueDepth'

    ReceiverRabbitmqConnectedMessage:
      name: ReceiverRabbitmqConnectedMessage
      title: Receiver RabbitMQ connectivity
      summary: Whether the receiver has an active RabbitMQ connection
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverRabbitmqConnected'

    ReceiverStartedAtMessage:
      name: ReceiverStartedAtMessage
      title: Receiver process start time
      summary: UTC ISO-8601 timestamp of process start
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ReceiverStartedAt'

    MessageProcessorMessagesPerSecondMessage:
      name: MessageProcessorMessagesPerSecondMessage
      title: Message Processor message rate
      summary: Average message processing rate since last report
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorMessagesPerSecond'

    MessageProcessorProcessingTimeHwmMsMessage:
      name: MessageProcessorProcessingTimeHwmMsMessage
      title: Message Processor processing time high-water mark
      summary: End-to-end message processing time high-water mark since last publish
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorProcessingTimeHwmMs'

    MessageProcessorRulesEngineHwmMsMessage:
      name: MessageProcessorRulesEngineHwmMsMessage
      title: Message Processor rules engine duration high-water mark
      summary: Rules engine duration high-water mark since last publish
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorRulesEngineHwmMs'

    MessageProcessorRabbitmqInputQueueDepthHwmMessage:
      name: MessageProcessorRabbitmqInputQueueDepthHwmMessage
      title: Message Processor RabbitMQ input queue depth high-water mark
      summary: High-water mark of this message processor's RabbitMQ input queue depth
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorRabbitmqInputQueueDepthHwm'

    MessageProcessorLocalArchiveQueueDepthMessage:
      name: MessageProcessorLocalArchiveQueueDepthMessage
      title: Message Processor local archive queue depth
      summary: Completed flights queued in the local SQLite fallback (completed_flights.db)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorLocalArchiveQueueDepth'

    MessageProcessorDeadLetterQueueDepthMessage:
      name: MessageProcessorDeadLetterQueueDepthMessage
      title: Message Processor dead-letter queue depth
      summary: Completed flights dead-lettered from the local SQLite archive fallback after repeatedly failing to publish
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorDeadLetterQueueDepth'

    MessageProcessorRegistrationMissesHourMessage:
      name: MessageProcessorRegistrationMissesHourMessage
      title: Message Processor registration misses this hour
      summary: Aircraft Redis cache misses this hour
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorRegistrationMissesHour'

    MessageProcessorRegistrationMissesTodayMessage:
      name: MessageProcessorRegistrationMissesTodayMessage
      title: Message Processor registration misses today
      summary: Aircraft Redis cache misses today (UTC)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorRegistrationMissesToday'

    MessageProcessorAircraftTypeMissesHourMessage:
      name: MessageProcessorAircraftTypeMissesHourMessage
      title: Message Processor aircraft type misses this hour
      summary: Aircraft type lookup misses this hour
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorAircraftTypeMissesHour'

    MessageProcessorAircraftTypeMissesTodayMessage:
      name: MessageProcessorAircraftTypeMissesTodayMessage
      title: Message Processor aircraft type misses today
      summary: Aircraft type lookup misses today (UTC)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorAircraftTypeMissesToday'

    MessageProcessorActiveFlightsMessage:
      name: MessageProcessorActiveFlightsMessage
      title: Message Processor active flights
      summary: Flights currently tracked in the in-memory SQLite store
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorActiveFlights'

    MessageProcessorStartedAtMessage:
      name: MessageProcessorStartedAtMessage
      title: Message Processor process start time
      summary: UTC ISO-8601 timestamp of process start
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorStartedAt'

    ArchiveFlightsArchivedHourMessage:
      name: ArchiveFlightsArchivedHourMessage
      title: Archive flights archived this hour
      summary: Flights successfully written to S3 this hour
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveFlightsArchivedHour'

    ArchiveFlightsArchivedTodayMessage:
      name: ArchiveFlightsArchivedTodayMessage
      title: Archive flights archived today
      summary: Flights successfully written to S3 today (UTC)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveFlightsArchivedToday'

    ArchiveFlightsSkippedHourMessage:
      name: ArchiveFlightsSkippedHourMessage
      title: Archive flights skipped this hour
      summary: MLAT-only flights dropped instead of archived this hour
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveFlightsSkippedHour'

    ArchiveFlightsSkippedTodayMessage:
      name: ArchiveFlightsSkippedTodayMessage
      title: Archive flights skipped today
      summary: MLAT-only flights dropped instead of archived today (UTC)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveFlightsSkippedToday'

    ArchiveS3ConnectedMessage:
      name: ArchiveS3ConnectedMessage
      title: Archive S3 connectivity
      summary: Whether the last S3 write attempt succeeded
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveS3Connected'

    ArchiveLocalQueueDepthMessage:
      name: ArchiveLocalQueueDepthMessage
      title: Archive local queue depth
      summary: Completed flights queued in the local SQLite fallback (s3.db)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveLocalQueueDepth'

    ArchiveLocalIndexQueueDepthMessage:
      name: ArchiveLocalIndexQueueDepthMessage
      title: Archive local index queue depth
      summary: Parquet index rows queued for retry (index_queue table in s3.db)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveLocalIndexQueueDepth'

    ArchiveDeadLetterQueueDepthMessage:
      name: ArchiveDeadLetterQueueDepthMessage
      title: Archive dead-letter queue depth
      summary: Completed flights dead-lettered from the local SQLite fallback after repeatedly failing to write to S3
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveDeadLetterQueueDepth'

    ArchiveDeadLetterIndexQueueDepthMessage:
      name: ArchiveDeadLetterIndexQueueDepthMessage
      title: Archive dead-letter index queue depth
      summary: Parquet index rows dead-lettered after repeatedly failing to write
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveDeadLetterIndexQueueDepth'

    ArchiveRabbitmqArchiveQueueDepthHwmMessage:
      name: ArchiveRabbitmqArchiveQueueDepthHwmMessage
      title: Archive RabbitMQ archive queue depth high-water mark
      summary: High-water mark of the RabbitMQ 'archive' queue's depth since last publish
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveRabbitmqArchiveQueueDepthHwm'

    ArchiveStartedAtMessage:
      name: ArchiveStartedAtMessage
      title: Archive processor process start time
      summary: UTC ISO-8601 timestamp of process start
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveStartedAt'

    ArchiveCompactionFilesCompactedMessage:
      name: ArchiveCompactionFilesCompactedMessage
      title: Archive compaction files compacted
      summary: Count of per-flight files merged into this run's compacted output
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionFilesCompacted'

    ArchiveCompactionFilesDeleteFailedMessage:
      name: ArchiveCompactionFilesDeleteFailedMessage
      title: Archive compaction files delete failed
      summary: Count of compacted-but-undeleted source files this run
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionFilesDeleteFailed'

    ArchiveCompactionDaysCompactedMessage:
      name: ArchiveCompactionDaysCompactedMessage
      title: Archive compaction days compacted
      summary: Number of date partitions successfully compacted this run
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionDaysCompacted'

    ArchiveCompactionLastCompactedDateMessage:
      name: ArchiveCompactionLastCompactedDateMessage
      title: Archive compaction last compacted date
      summary: The watermark after this run
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionLastCompactedDate'

    ArchiveCompactionMismatchDateMessage:
      name: ArchiveCompactionMismatchDateMessage
      title: Archive compaction mismatch date
      summary: Date this run stopped at due to a flight/index parity mismatch
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionMismatchDate'

    ArchiveCompactionMismatchUuidsMessage:
      name: ArchiveCompactionMismatchUuidsMessage
      title: Archive compaction mismatch flight UUIDs
      summary: Flight UUIDs missing their Parquet index row on mismatch_date
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionMismatchUuids'

    ArchiveCompactionLastRunAtMessage:
      name: ArchiveCompactionLastRunAtMessage
      title: Archive compaction last run at
      summary: UTC timestamp this run completed
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionLastRunAt'

    ArchiveCompactionLastRunStatusMessage:
      name: ArchiveCompactionLastRunStatusMessage
      title: Archive compaction last run status
      summary: Outcome of this run
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionLastRunStatus'

    FlightRuleNotificationMessage:
      name: FlightRuleNotificationMessage
      title: Rule match notification
      summary: JSON snapshot of a flight at the moment a rule matched
      contentType: application/json
      payload:
        $ref: '#/components/schemas/FlightRuleNotification'

    RunnerRecordsImportedMessage:
      name: RunnerRecordsImportedMessage
      title: Data runner records imported
      summary: Number of records written to Redis during this run
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/RunnerRecordsImported'

    RunnerLastRunAtMessage:
      name: RunnerLastRunAtMessage
      title: Data runner last run at
      summary: UTC ISO-8601 timestamp when the run completed
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/RunnerLastRunAt'

    RunnerLastRunStatusMessage:
      name: RunnerLastRunStatusMessage
      title: Data runner last run status
      summary: Outcome of the run
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/RunnerLastRunStatus'

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------

  schemas:

    StatusPayload:
      type: string
      enum: [ONLINE, OFFLINE]
      description: >
        Component liveness indicator. ONLINE published on connect (retained);
        OFFLINE sent as LWT when the connection drops (retained).

    ReceiverMessages1090PerSecond:
      type: number
      description: Average 1090 MHz message rate since last report (messages received ÷ elapsed seconds)
      example: 12.4

    ReceiverMessages978PerSecond:
      type: number
      description: Average 978 MHz UAT message rate since last report. Only published if a 978 source is configured
      example: 0.0

    ReceiverMessagesMlatPerSecond:
      type: number
      description: Average MLAT message rate since last report. Only published if an MLAT source is configured
      example: 0.0

    ReceiverLocalQueueDepth:
      type: integer
      description: Number of messages queued in the local SQLite fallback (queue.db)
      example: 0

    ReceiverDeadLetterQueueDepth:
      type: integer
      description: Number of messages dead-lettered from the local SQLite fallback (dead_letters/queue/ in data_dir) after repeatedly failing to publish
      example: 0

    ReceiverRabbitmqConnected:
      type: boolean
      description: True when the receiver has an active RabbitMQ connection
      example: true

    ReceiverStartedAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp of process start
      example: "2026-01-15T10:00:00+00:00"

    MessageProcessorMessagesPerSecond:
      type: number
      description: Average message processing rate since last report (messages received ÷ elapsed seconds)
      example: 45.1

    MessageProcessorProcessingTimeHwmMs:
      type: number
      description: End-to-end message processing time high-water mark since last publish; resets on publish
      example: 12.3

    MessageProcessorRulesEngineHwmMs:
      type: integer
      description: Rules engine duration high-water mark since last publish; resets on publish
      example: 45

    MessageProcessorRabbitmqInputQueueDepthHwm:
      type: integer
      description: High-water mark of this message processor's RabbitMQ input queue depth since last publish, sampled at most once every 10 seconds; resets on publish. -1 if no valid sample landed this window (e.g. consumer not yet connected)
      example: 0

    MessageProcessorLocalArchiveQueueDepth:
      type: integer
      description: Number of completed flights queued in the local SQLite fallback (completed_flights.db)
      example: 0

    MessageProcessorDeadLetterQueueDepth:
      type: integer
      description: Number of completed flights dead-lettered from the local SQLite archive fallback (dead_letters/queue/ in data_dir) after repeatedly failing to publish
      example: 0

    MessageProcessorRegistrationMissesHour:
      type: integer
      description: Aircraft Redis cache misses this hour
      example: 2

    MessageProcessorRegistrationMissesToday:
      type: integer
      description: Aircraft Redis cache misses today (UTC)
      example: 14

    MessageProcessorAircraftTypeMissesHour:
      type: integer
      description: Aircraft type lookup misses this hour
      example: 0

    MessageProcessorAircraftTypeMissesToday:
      type: integer
      description: Aircraft type lookup misses today (UTC)
      example: 3

    MessageProcessorActiveFlights:
      type: integer
      description: Number of flights currently tracked in the in-memory SQLite store
      example: 8

    MessageProcessorStartedAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp of process start
      example: "2026-01-15T10:00:00+00:00"

    ArchiveFlightsArchivedHour:
      type: integer
      description: Flights successfully written to S3 this hour
      example: 34

    ArchiveFlightsArchivedToday:
      type: integer
      description: Flights successfully written to S3 today (UTC)
      example: 412

    ArchiveFlightsSkippedHour:
      type: integer
      description: MLAT-only flights dropped instead of archived this hour
      example: 118

    ArchiveFlightsSkippedToday:
      type: integer
      description: MLAT-only flights dropped instead of archived today, UTC
      example: 2540

    ArchiveS3Connected:
      type: boolean
      description: True when the last S3 write attempt succeeded
      example: true

    ArchiveLocalQueueDepth:
      type: integer
      description: Number of completed flights queued in the local SQLite fallback (s3.db)
      example: 0

    ArchiveLocalIndexQueueDepth:
      type: integer
      description: Number of Parquet index rows queued for retry (index_queue table in s3.db) after their flight object wrote successfully but the index write failed
      example: 0

    ArchiveDeadLetterQueueDepth:
      type: integer
      description: Number of completed flights dead-lettered from the local SQLite fallback (dead_letters/queue/ in data_dir) after repeatedly failing to write to S3
      example: 0

    ArchiveDeadLetterIndexQueueDepth:
      type: integer
      description: Number of Parquet index rows dead-lettered (dead_letters/index_queue/ in data_dir) after repeatedly failing to write
      example: 0

    ArchiveRabbitmqArchiveQueueDepthHwm:
      type: integer
      description: High-water mark of the RabbitMQ 'archive' queue's depth since last publish, sampled at most once every 10 seconds; resets on publish. -1 if no valid sample landed this window (e.g. consumer not yet connected)
      example: 0

    ArchiveStartedAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp of process start
      example: "2026-01-15T10:00:00+00:00"

    ArchiveCompactionFilesCompacted:
      type: integer
      description: Count of per-flight Parquet index files merged into this run's compacted output
      example: 142

    ArchiveCompactionFilesDeleteFailed:
      type: integer
      description: >
        Count of files included in this run's compacted output whose delete
        call failed and therefore still linger as duplicates
      example: 0

    ArchiveCompactionDaysCompacted:
      type: integer
      description: Number of date partitions successfully compacted this run -- more than one when catching up after a gap
      example: 1

    ArchiveCompactionLastCompactedDate:
      type: string
      format: date
      description: The watermark after this run -- the most recent UTC date whose partition has been fully compacted
      example: "2026-07-23"

    ArchiveCompactionMismatchDate:
      type: string
      format: date
      description: >
        UTC date this run stopped at due to a flight/index parity mismatch.
        Empty string when the run wasn't stopped by one
      example: ""

    ArchiveCompactionMismatchUuids:
      type: string
      description: >
        Comma-separated flight UUIDs missing their Parquet index row on
        mismatch_date. Empty string when the run wasn't stopped by a
        mismatch
      example: ""

    ArchiveCompactionLastRunAt:
      type: string
      format: date-time
      description: >
        UTC ISO-8601 timestamp when this run completed. Home Assistant
        discovery configures this sensor with device_class: timestamp.
      example: "2026-07-25T04:50:03.123456+00:00"

    ArchiveCompactionLastRunStatus:
      type: string
      enum: [Success, Failure, Mismatch]
      description: >
        Outcome of this run. Mismatch means the run completed without
        error but stopped early on a flight/index parity mismatch (see
        mismatch_date/mismatch_uuids); Failure means an actual exception
      example: Success

    RunnerRecordsImported:
      type: integer
      description: >
        Number of records written to Redis during this run. This is the
        common baseline stat every data runner publishes; some runners
        (e.g. mictronics) publish additional stats beyond this one.
      example: 487203

    RunnerLastRunAt:
      type: string
      format: date-time
      description: >
        UTC ISO-8601 timestamp when the run completed. Home Assistant
        discovery configures this sensor with device_class: timestamp.
      example: "2026-01-15T05:12:34+00:00"

    RunnerLastRunStatus:
      type: string
      enum: [Success, Failure]
      description: Outcome of the run
      example: Success

    AirportInfo:
      type: object
      description: >
        Airport metadata as stored in Redis by the ourairports data runner.
        Matches the legacy AROI airport shape. Included in flight notifications
        so consuming systems have phonic names available for announcements.
      required: [icao_code]
      properties:
        icao_code:
          type: string
          example: KATL
        name:
          type: string
          example: Hartsfield-Jackson Atlanta International Airport
        city:
          type: string
          example: Atlanta
        region:
          type: string
          description: ISO 3166-2 region code
          example: US-GA
        country:
          type: string
          example: US
        phonic:
          type: string
          description: Voice-friendly spoken name for announcements
          example: Atlanta Hartsfield-Jackson

    AircraftInfo:
      type: object
      description: >
        Aircraft registration and type enrichment. icao_hex is always present.
        military is omitted when false (legacy behaviour — only serialised when true).
      required: [icao_hex]
      properties:
        icao_hex:
          type: string
          example: A1B2C3
        registration:
          type: string
          example: N12345
        type_designator:
          type: string
          description: ICAO type code
          example: B763
        type:
          type: string
          description: Aircraft category
          example: Airplane
        category:
          type: string
          description: Landing-gear category
          example: Land
        manufacturer:
          type: string
          example: Boeing
        model:
          type: string
          example: 767-332ER
        manufacturer_model:
          type: string
          description: Combined manufacturer + model string
          example: BOEING 767-332ER
        seats:
          type: integer
          example: 189
        wake_turbulence_category:
          type: string
          example: Heavy
        military:
          type: boolean
          description: Present and true when the aircraft is military; omitted when false
        operator:
          type: string
          description: Operator or owner name from the registration database
          example: Delta Air Lines
        airline_code:
          type: string
          example: DAL
        serial_number:
          type: string
        manufactured_date:
          type: string
          example: "2005-01-01"
        is_private_operator:
          type: boolean
        registrant:
          type: object
          description: Owner/registrant information from the national civil aircraft registry
          properties:
            names:
              type: array
              items:
                type: string
              example: [Delta Air Lines Inc]
            street:
              type: array
              items:
                type: string
              example: ["1030 Delta Blvd"]
            city:
              type: string
              example: Atlanta
            administrative_area:
              type: string
              example: GA
            postal_code:
              type: string
              example: "30354"
            country:
              type: string
              example: US
            type:
              type: string
              description: Registrant category
              example: Corporation
        data_sources:
          type: array
          items:
            type: string
          description: Every data runner that contributed a field to this record, mictronics -> registry -> livery order
          example: [mictronics, us-faa-registry]

    FlightRuleNotification:
      type: object
      description: >
        Snapshot of a flight at the moment a rule matched. Excludes _id,
        positions, and velocities. operator, origin, and destination are
        omitted when not populated.
      required: [aircraft, first_message, last_message, total_messages, receiver_sources, force_archive, matched_rules, rule]
      properties:
        aircraft:
          $ref: '#/components/schemas/AircraftInfo'
        ident:
          type: string
          example: DAL659
        operator:
          type: object
          description: Airline operator enrichment. Omitted when empty. source key stripped.
          properties:
            airline_designator:
              type: string
              example: DAL
            name:
              type: string
              example: Delta Air Lines
            callsign:
              type: string
              example: DELTA
            country:
              type: string
              example: United States
            iata:
              type: string
              example: DL
            flight_number:
              type: string
              example: DL659
        squawk:
          type: string
          example: "1200"
        origin:
          $ref: '#/components/schemas/AirportInfo'
          description: Departure airport; omitted when unknown
        destination:
          $ref: '#/components/schemas/AirportInfo'
          description: Arrival airport; omitted when unknown
        receiver_sources:
          type: array
          items:
            type: string
            enum: ["1090", "978", "MLAT"]
          description: Every distinct ADS-B receive source seen for this flight, in first-seen order
          example: ["1090"]
        force_archive:
          type: boolean
          description: True if a matching rule (force_archive) overrides the MLAT-only archive skip for this flight
          example: false
        first_message:
          type: string
          format: date-time
          example: "2026-01-15T10:00:00+00:00"
        last_message:
          type: string
          format: date-time
          example: "2026-01-15T10:45:00+00:00"
        total_messages:
          type: integer
          example: 3842
        matched_rules:
          type: array
          items:
            type: string
          example: [military-aircraft]
        rule:
          type: object
          required: [name, description, identifier]
          properties:
            name:
              type: string
              example: Military Aircraft
            description:
              type: string
              example: Matches any aircraft with military=true
            identifier:
              type: string
              example: military-aircraft

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------

  parameters:

    ReceiverId:
      description: >
        UUID receiver instance identifier, generated on first startup and
        persisted to {data_dir}/receiver_id -- not operator-set. Allows
        multiple receiver containers to coexist on the same broker.

    MessageProcessorId:
      description: >
        Integer message processor instance identifier. Set via the
        MESSAGE_PROCESSOR_ID environment variable. Used to distinguish
        multiple message processor containers running simultaneously.

    RuleIdentifier:
      description: >
        Unique rule identifier string matching the identifier field of the
        triggered rule. Also the final segment of the rule notification topic.

    RunnerName:
      description: >
        Data runner name identifying which import job published statistics.
        One of: mictronics, us-faa-registry, ca-transport-canada-registry, ourairports.
