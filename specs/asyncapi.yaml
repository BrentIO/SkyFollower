    MessageProcessorOperatorMissesLifetimeMessage:
      name: MessageProcessorOperatorMissesLifetimeMessage
      title: Message Processor operator misses lifetime
      summary: operator:{designator} Redis lookup misses since this process instance started, published by core-health
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorOperatorMissesLifetime'

    MessageProcessorTotalMessagesProcessedHourMessage:
      name: MessageProcessorTotalMessagesProcessedHourMessage
      title: Message Processor total messages processed this hour
      summary: Every message this hour attempted to decode, published by core-health
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorTotalMessagesProcessedHour'

    MessageProcessorTotalMessagesProcessedTodayMessage:
      name: MessageProcessorTotalMessagesProcessedTodayMessage
      title: Message Processor total messages processed today
      summary: Every message today (UTC) attempted to decode, published by core-health
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorTotalMessagesProcessedToday'

    MessageProcessorTotalMessagesProcessedLifetimeMessage:
      name: MessageProcessorTotalMessagesProcessedLifetimeMessage
      title: Message Processor total messages processed lifetime
      summary: Every message since this process instance started attempted to decode, published by core-health
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorTotalMessagesProcessedLifetime'

    MessageProcessorActiveFlightsMessage:
      name: MessageProcessorActiveFlightsMessage
      title: Message Processor active flights
      summary: Flights currently tracked in the in-memory SQLite store
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorActiveFlights'

    MessageProcessorStartedAtMessage:
      name: MessageProcessorStartedAtMessage
      title: Message Processor process start time
      summary: UTC ISO-8601 timestamp of process start
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorStartedAt'

    MessageProcessorRulesVersionMessage:
      name: MessageProcessorRulesVersionMessage
      title: Message Processor loaded rules config version
      summary: Last 8 characters of the SHA-256 hash of the rules config this instance has actually loaded
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorConfigVersion'

    MessageProcessorAreasVersionMessage:
      name: MessageProcessorAreasVersionMessage
      title: Message Processor loaded areas config version
      summary: Last 8 characters of the SHA-256 hash of the areas config this instance has actually loaded
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/MessageProcessorConfigVersion'

    ArchiveFlightsArchivedHourMessage:
      name: ArchiveFlightsArchivedHourMessage
      title: Archive flights archived this hour
      summary: Flights successfully written to S3 this hour
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveFlightsArchivedHour'

    ArchiveFlightsArchivedTodayMessage:
      name: ArchiveFlightsArchivedTodayMessage
      title: Archive flights archived today
      summary: Flights successfully written to S3 today (UTC)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveFlightsArchivedToday'

    ArchiveFlightsSkippedHourMessage:
      name: ArchiveFlightsSkippedHourMessage
      title: Archive flights skipped this hour
      summary: External-only flights dropped instead of archived this hour
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveFlightsSkippedHour'

    ArchiveFlightsSkippedTodayMessage:
      name: ArchiveFlightsSkippedTodayMessage
      title: Archive flights skipped today
      summary: External-only flights dropped instead of archived today (UTC)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveFlightsSkippedToday'

    ArchiveS3ConnectedMessage:
      name: ArchiveS3ConnectedMessage
      title: Archive S3 connectivity
      summary: Whether the last S3 write attempt succeeded
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveS3Connected'

    ArchiveLocalQueueDepthMessage:
      name: ArchiveLocalQueueDepthMessage
      title: Archive local queue depth
      summary: Completed flights queued in the local SQLite fallback (s3.db)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveLocalQueueDepth'

    ArchiveLocalIndexQueueDepthMessage:
      name: ArchiveLocalIndexQueueDepthMessage
      title: Archive local index queue depth
      summary: Parquet index rows queued for retry (index_queue table in s3.db)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveLocalIndexQueueDepth'

    ArchiveDeadLetterQueueDepthMessage:
      name: ArchiveDeadLetterQueueDepthMessage
      title: Archive dead-letter queue depth
      summary: Completed flights dead-lettered from the local SQLite fallback after repeatedly failing to write to S3
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveDeadLetterQueueDepth'

    ArchiveDeadLetterIndexQueueDepthMessage:
      name: ArchiveDeadLetterIndexQueueDepthMessage
      title: Archive dead-letter index queue depth
      summary: Parquet index rows dead-lettered after repeatedly failing to write
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveDeadLetterIndexQueueDepth'

    ArchiveStartedAtMessage:
      name: ArchiveStartedAtMessage
      title: Archive processor process start time
      summary: UTC ISO-8601 timestamp of process start
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveStartedAt'

    ArchiveCompactionFilesCompactedMessage:
      name: ArchiveCompactionFilesCompactedMessage
      title: Archive compaction files compacted
      summary: Count of per-flight files merged into this run's compacted output
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionFilesCompacted'

    ArchiveCompactionFilesDeleteFailedMessage:
      name: ArchiveCompactionFilesDeleteFailedMessage
      title: Archive compaction files delete failed
      summary: Count of compacted-but-undeleted source files this run
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionFilesDeleteFailed'

    ArchiveCompactionDaysCompactedMessage:
      name: ArchiveCompactionDaysCompactedMessage
      title: Archive compaction days compacted
      summary: Number of date partitions successfully compacted this run
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionDaysCompacted'

    ArchiveCompactionLastCompactedDateMessage:
      name: ArchiveCompactionLastCompactedDateMessage
      title: Archive compaction last compacted date
      summary: The watermark after this run
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionLastCompactedDate'

    ArchiveCompactionMismatchDateMessage:
      name: ArchiveCompactionMismatchDateMessage
      title: Archive compaction mismatch date
      summary: Date this run stopped at due to a flight/index parity mismatch
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionMismatchDate'

    ArchiveCompactionMismatchUuidsMessage:
      name: ArchiveCompactionMismatchUuidsMessage
      title: Archive compaction mismatch flight UUIDs
      summary: Flight UUIDs missing their Parquet index row on mismatch_date
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionMismatchUuids'

    ArchiveCompactionLastRunAtMessage:
      name: ArchiveCompactionLastRunAtMessage
      title: Archive compaction last run at
      summary: UTC timestamp this run completed
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionLastRunAt'

    ArchiveCompactionLastRunStatusMessage:
      name: ArchiveCompactionLastRunStatusMessage
      title: Archive compaction last run status
      summary: Outcome of this run
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionLastRunStatus'

    ArchiveCompactionVersionMessage:
      name: ArchiveCompactionVersionMessage
      title: Archive compaction version
      summary: Running image version
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/ArchiveCompactionVersion'

    FlightRuleNotificationMessage:
      name: FlightRuleNotificationMessage
      title: Rule match notification
      summary: JSON snapshot of a flight at the moment a rule matched
      contentType: application/json
      payload:
        $ref: '#/components/schemas/FlightRuleNotification'

    RunnerRecordsImportedMessage:
      name: RunnerRecordsImportedMessage
      title: Data runner records imported
      summary: Number of records written to Redis during this run
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/RunnerRecordsImported'

    RunnerLastRunAtMessage:
      name: RunnerLastRunAtMessage
      title: Data runner last run at
      summary: UTC ISO-8601 timestamp when the run completed
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/RunnerLastRunAt'

    RunnerLastRunStatusMessage:
      name: RunnerLastRunStatusMessage
      title: Data runner last run status
      summary: Outcome of the run
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/RunnerLastRunStatus'

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------

  schemas:

    StatusPayload:
      type: string
      enum: [ONLINE, OFFLINE]
      description: >
        Component liveness indicator. ONLINE published on connect (retained);
        OFFLINE sent as LWT when the connection drops (retained).

    ReceiverMessagesPerSecond:
      type: number
      description: Average message rate for one sources[] connection since last report (messages received ÷ elapsed seconds)
      example: 12.4

    ReceiverConnectionConnected:
      type: boolean
      description: True when the TCP connection to one sources[] entry's readsb instance is currently open
      example: true

    ReceiverConnectionReconnectCount:
      type: integer
      description: Number of times one sources[] connection has dropped and been re-established since process start
      example: 0

    ReceiverConnectionMessagesTotalHour:
      type: integer
      description: >
        Cumulative message count for one sources[] connection since the
        current UTC hour began. Only published when REDIS_HOST is
        configured; Redis-backed and published by core-health, so it is
        cross-restart-durable and resets only at the real UTC boundary.
      example: 214

    ReceiverConnectionMessagesTotalToday:
      type: integer
      description: >
        Cumulative message count for one sources[] connection since the
        current UTC day began. Only published when REDIS_HOST is
        configured; Redis-backed and published by core-health, so it is
        cross-restart-durable and resets only at the real UTC boundary.
      example: 8452

    ReceiverConnectionMessagesTotalLifetime:
      type: integer
      description: >
        Cumulative message count for one sources[] connection since this
        receiver process started -- not since the receiver was first
        installed. An in-memory figure the receiver publishes directly,
        never Redis-backed, so it resets to zero on every receiver restart
        by design. Published regardless of whether REDIS_HOST is set.
      example: 193822

    ReceiverConnectionConnectedAttributes:
      type: object
      description: JSON attributes for one sources[] connection's _connected sensor
      properties:
        last_message_received:
          type: string
          format: date-time
          description: UTC ISO-8601 timestamp of the last message processed for one sources[] connection
          example: "2026-01-15T10:00:00+00:00"

    ReceiverLocalQueueDepth:
      type: integer
      description: Number of messages queued in the local SQLite fallback (queue.db)
      example: 0

    ReceiverDeadLetterQueueDepth:
      type: integer
      description: Number of messages dead-lettered from the local SQLite fallback (dead_letters/queue/ in data_dir) after repeatedly failing to publish
      example: 0

    ReceiverRabbitmqConnected:
      type: boolean
      description: True when the receiver has an active RabbitMQ connection
      example: true

    ReceiverStartedAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp of process start
      example: "2026-01-15T10:00:00+00:00"

    ReceiverVersion:
      type: string
      description: Running image version, from the VERSION environment variable ("dev" if unset)
      example: "2026.08.01"

    MessageProcessorMessagesPerSecond:
      type: number
      description: Average message processing rate since last report (messages received ÷ elapsed seconds)
      example: 45.1

    MessageProcessorProcessingTimeHwmMs:
      type: number
      description: End-to-end message processing time high-water mark since last publish; resets on publish
      example: 12.3

    MessageProcessorMessageLatencyHwmMs:
      type: number
      description: Receipt-through-processed latency high-water mark since last publish, including RabbitMQ queue wait time (superset of MessageProcessorProcessingTimeHwmMs); wall-clock based, sensitive to NTP drift between hosts; resets on publish
      example: 340.7

    MessageProcessorRulesEngineHwmNs:
      type: number
      description: Rules engine duration high-water mark since last publish, in nanoseconds; resets on publish
      example: 45000

    MessageProcessorLocalArchiveQueueDepth:
      type: integer
      description: Number of completed flights queued in the local SQLite fallback (completed_flights.db)
      example: 0

    MessageProcessorDeadLetterQueueDepth:
      type: integer
      description: Number of completed flights dead-lettered from the local SQLite archive fallback (dead_letters/queue/ in data_dir) after repeatedly failing to publish
      example: 0

    MessageProcessorRegistrationMissesHour:
      type: integer
      description: Aircraft enrichment (registration) Redis cache misses this hour
      example: 2

    MessageProcessorRegistrationMissesToday:
      type: integer
      description: Aircraft enrichment (registration) Redis cache misses today (UTC)
      example: 14

    MessageProcessorRegistrationMissesLifetime:
      type: integer
      description: Aircraft enrichment (registration) Redis cache misses since this process instance started
      example: 214

    MessageProcessorOperatorMissesToday:
      type: integer
      description: operator:{designator} Redis lookup misses today (UTC)
      example: 5

    MessageProcessorOperatorMissesLifetime:
      type: integer
      description: operator:{designator} Redis lookup misses since this process instance started
      example: 61

    MessageProcessorTotalMessagesProcessedHour:
      type: integer
      description: Every message this hour for which an attempt to decode was made
      example: 184320

    MessageProcessorTotalMessagesProcessedToday:
      type: integer
      description: Every message today (UTC) for which an attempt to decode was made
      example: 3512890

    MessageProcessorTotalMessagesProcessedLifetime:
      type: integer
      description: Every message since this process instance started for which an attempt to decode was made
      example: 9021455

    MessageProcessorActiveFlights:
      type: integer
      description: Number of flights currently tracked in the in-memory SQLite store
      example: 8

    MessageProcessorStartedAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp of process start
      example: "2026-01-15T10:00:00+00:00"

    MessageProcessorConfigVersion:
      type: string
      description: >
        Last 8 characters of the SHA-256 hash of a config (rules or areas)
        this instance has actually loaded, or "unknown" before the first
        successful load. Compare against the canonical value to see whether
        this instance is up to date.
      example: "deadbeef"

    ArchiveFlightsArchivedHour:
      type: integer
      description: Flights successfully written to S3 this hour
      example: 34

    ArchiveFlightsArchivedToday:
      type: integer
      description: Flights successfully written to S3 today (UTC)
      example: 412

    ArchiveFlightsSkippedHour:
      type: integer
      description: External-only flights dropped instead of archived this hour
      example: 118

    ArchiveFlightsSkippedToday:
      type: integer
      description: External-only flights dropped instead of archived today, UTC
      example: 2540

    ArchiveS3Connected:
      type: boolean
      description: True when the last S3 write attempt succeeded
      example: true

    ArchiveLocalQueueDepth:
      type: integer
      description: Number of completed flights queued in the local SQLite fallback (s3.db)
      example: 0

    ArchiveLocalIndexQueueDepth:
      type: integer
      description: Number of Parquet index rows queued for retry (index_queue table in s3.db) after their flight object wrote successfully but the index write failed
      example: 0

    ArchiveDeadLetterQueueDepth:
      type: integer
      description: Number of completed flights dead-lettered from the local SQLite fallback (dead_letters/queue/ in data_dir) after repeatedly failing to write to S3
      example: 0

    ArchiveDeadLetterIndexQueueDepth:
      type: integer
      description: Number of Parquet index rows dead-lettered (dead_letters/index_queue/ in data_dir) after repeatedly failing to write
      example: 0

    ArchiveStartedAt:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp of process start
      example: "2026-01-15T10:00:00+00:00"

    ArchiveCompactionFilesCompacted:
      type: integer
      description: Count of per-flight Parquet index files merged into this run's compacted output
      example: 142

    ArchiveCompactionFilesDeleteFailed:
      type: integer
      description: >
        Count of files included in this run's compacted output whose delete
        call failed and therefore still linger as duplicates
      example: 0

    ArchiveCompactionDaysCompacted:
      type: integer
      description: Number of date partitions successfully compacted this run -- more than one when catching up after a gap
      example: 1

    ArchiveCompactionLastCompactedDate:
      type: string
      format: date
      description: The watermark after this run -- the most recent UTC date whose partition has been fully compacted
      example: "2026-07-23"

    ArchiveCompactionMismatchDate:
      type: string
      format: date
      description: >
        UTC date this run stopped at due to a flight/index parity mismatch.
        Empty string when the run wasn't stopped by one
      example: ""

    ArchiveCompactionMismatchUuids:
      type: string
      description: >
        Comma-separated flight UUIDs missing their Parquet index row on
        mismatch_date. Empty string when the run wasn't stopped by a
        mismatch
      example: ""

    ArchiveCompactionLastRunAt:
      type: string
      format: date-time
      description: >
        UTC ISO-8601 timestamp when this run completed. Home Assistant
        discovery configures this sensor with device_class: timestamp.
      example: "2026-07-25T04:50:03.123456+00:00"

    ArchiveCompactionLastRunStatus:
      type: string
      enum: [Success, Failure, Mismatch]
      description: >
        Outcome of this run. Mismatch means the run completed without
        error but stopped early on a flight/index parity mismatch (see
        mismatch_date/mismatch_uuids); Failure means an actual exception
      example: Success

    ArchiveCompactionVersion:
      type: string
      description: >
        Running image version, read from the VERSION environment variable.
        Falls back to "dev" when unset (e.g. a local, non-release build)
      example: "2026.08.01"

    RunnerRecordsImported:
      type: integer
      description: >
        Number of records written to Redis during this run. This is the
        common baseline stat every data runner publishes; some runners
        (e.g. mictronics) publish additional stats beyond this one.
      example: 487203

    RunnerLastRunAt:
      type: string
      format: date-time
      description: >
        UTC ISO-8601 timestamp when the run completed. Home Assistant
        discovery configures this sensor with device_class: timestamp.
      example: "2026-01-15T05:12:34+00:00"

    RunnerLastRunStatus:
      type: string
      enum: [Success, Failure]
      description: Outcome of the run
      example: Success

    AirportInfo:
      type: object
      description: >
        Airport metadata as stored in Redis by the ourairports data runner.
        Matches the legacy AROI airport shape. Included in flight notifications
        so consuming systems have phonic names available for announcements.
      required: [icao_code]
      properties:
        icao_code:
          type: string
          example: KATL
        name:
          type: string
          example: Hartsfield-Jackson Atlanta International Airport
        city:
          type: string
          example: Atlanta
        region:
          type: string
          description: ISO 3166-2 region code
          example: US-GA
        country:
          type: string
          example: US
        phonic:
          type: string
          description: Voice-friendly spoken name for announcements
          example: Atlanta Hartsfield-Jackson

    AircraftInfo:
      type: object
      description: >
        Aircraft registration and type enrichment. icao_hex is always present.
        military is omitted when false (legacy behaviour — only serialised when true).
      required: [icao_hex]
      properties:
        icao_hex:
          type: string
          example: A1B2C3
        registration:
          type: string
          example: N12345
        type_designator:
          type: string
          description: ICAO type code
          example: B763
        type:
          type: string
          description: Aircraft category
          example: Airplane
        category:
          type: string
          description: Landing-gear category
          example: Land
        manufacturer:
          type: string
          example: Boeing
        model:
          type: string
          example: 767-332ER
        manufacturer_model:
          type: string
          description: Combined manufacturer + model string
          example: BOEING 767-332ER
        seats:
          type: integer
          example: 189
        wake_turbulence_category:
          type: string
          example: Heavy
        military:
          type: boolean
          description: Present and true when the aircraft is military; omitted when false
        operator:
          type: string
          description: Operator or owner name from the registration database
          example: Delta Air Lines
        airline_code:
          type: string
          example: DAL
        serial_number:
          type: string
        manufactured_date:
          type: string
          example: "2005-01-01"
        is_private_operator:
          type: boolean
        registrant:
          type: object
          description: Owner/registrant information from the national civil aircraft registry
          properties:
            names:
              type: array
              items:
                type: string
              example: [Delta Air Lines Inc]
            street:
              type: array
              items:
                type: string
              example: ["1030 Delta Blvd"]
            city:
              type: string
              example: Atlanta
            administrative_area:
              type: string
              example: GA
            postal_code:
              type: string
              example: "30354"
            country:
              type: string
              example: US
            type:
              type: string
              description: Registrant category
              example: Corporation
        data_sources:
          type: array
          items:
            type: string
          description: Every data runner that contributed a field to this record, mictronics -> registry -> livery order
          example: [mictronics, us-faa-registry]

    FlightRuleNotification:
      type: object
      description: >
        Snapshot of a flight at the moment a rule matched. Excludes _id,
        positions, and velocities. operator, origin, and destination are
        omitted when not populated.
      required: [aircraft, first_message, last_message, total_messages, receiver_sources, force_archive, matched_rules, rule]
      properties:
        aircraft:
          $ref: '#/components/schemas/AircraftInfo'
        ident:
          type: string
          example: DAL659
        operator:
          type: object
          description: Airline operator enrichment. Omitted when empty. source key stripped.
          properties:
            airline_designator:
              type: string
              example: DAL
            name:
              type: string
              example: Delta Air Lines
            callsign:
              type: string
              example: DELTA
            country:
              type: string
              example: United States
            iata:
              type: string
              example: DL
            flight_number:
              type: string
              example: DL659
        squawk:
          type: string
          example: "1200"
        origin:
          $ref: '#/components/schemas/AirportInfo'
          description: Departure airport; omitted when unknown
        destination:
          $ref: '#/components/schemas/AirportInfo'
          description: Arrival airport; omitted when unknown
        receiver_sources:
          type: array
          items:
            type: string
            enum: ["1090", "978", "EXTERNAL"]
          description: Every distinct ADS-B receive source seen for this flight, in first-seen order
          example: ["1090"]
        force_archive:
          type: boolean
          description: True if a matching rule (force_archive) overrides the external-only archive skip for this flight
          example: false
        first_message:
          type: string
          format: date-time
          example: "2026-01-15T10:00:00+00:00"
        last_message:
          type: string
          format: date-time
          example: "2026-01-15T10:45:00+00:00"
        total_messages:
          type: integer
          example: 3842
        matched_rules:
          type: array
          items:
            type: string
          example: [military-aircraft]
        rule:
          type: object
          required: [name, description, identifier]
          properties:
            name:
              type: string
              example: Military Aircraft
            description:
              type: string
              example: Matches any aircraft with military=true
            identifier:
              type: string
              example: military-aircraft

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------

  parameters:

    ReceiverId:
      description: >
        Receiver instance identifier, persisted to {data_dir}/receiver_id
        on first successful startup and reused on every restart after.
        With REDIS_HOST configured, this is the operator-chosen
        RECEIVER_NAME, claimed via Redis SET NX the same way
        MESSAGE_PROCESSOR_ID is claimed (first-boot-only Redis dependency;
        every later boot resumes the persisted value with zero Redis
        calls). With REDIS_HOST unset, this is a randomly generated UUID
        instead, and RECEIVER_NAME stays a purely cosmetic label. Either
        way, allows multiple receiver containers to coexist on the same
        broker.

    MessageProcessorId:
      description: >
        Message processor instance identifier: a single flat, fleet-wide
        sequential number (e.g. "7"), not a per-node prefix plus a local
        index. Set via the MESSAGE_PROCESSOR_ID environment variable as a
        literal in that instance's generated compose service block. The
        same ID names its RabbitMQ queue, Redis heartbeat key, and data
        directory verbatim: skyfollower-message-processor-{id}.

    RuleIdentifier:
      description: >
        Unique rule identifier string matching the identifier field of the
        triggered rule. Also the final segment of the rule notification topic.

    RunnerName:
      description: >
        Data runner name identifying which import job published statistics.
        One of: mictronics, us-faa-registry, ca-transport-canada-registry, ourairports.

    ConnectionHost:
      description: >
        The host (hostname or IP address) of one specific RECEIVER_SOURCES
        entry, as configured -- not resolved or normalized.

    ConnectionPort:
      description: >
        The TCP port of one specific RECEIVER_SOURCES entry, as
        configured.
