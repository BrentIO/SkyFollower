name: skyfollower-core

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Tuned for a constrained host (Raspberry Pi CM4, 8GB RAM/32GB eMMC)
      # shared with Redis and the rest of Host B -- absolute memory/disk
      # watermarks instead of the relative-to-host-RAM default, and the
      # unused rabbitmq_prometheus plugin (SkyFollower's telemetry is
      # entirely MQTT-based) dropped from the stock enabled-plugins set.
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-skyfollower.conf:ro
      - ./config/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    environment:
      RABBITMQ_DEFAULT_USER: skyfollower
      RABBITMQ_DEFAULT_PASS: change_me

  redis:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # Tuned for a constrained host (Raspberry Pi CM4, 8GB RAM/32GB eMMC):
    # AOF is the sole durability mechanism (--save "" disables the default
    # periodic RDB snapshot, redundant with AOF's own rdb-preamble rewrite);
    # fsync pauses during AOF rewrite to avoid contending with the rewrite's
    # own disk I/O; RediSearch's fork-based GC interval is raised from its
    # 30s default to 5 minutes, since a bigger process forking that often
    # costs proportionally more on a smaller host. Re-measure once real
    # traffic is flowing — these are starting points, not measured values.
    environment:
      REDISEARCH_ARGS: "MAXSEARCHRESULTS 10000 MAXAGGREGATERESULTS 10000 FORK_GC_RUN_INTERVAL 300"
    command: redis-stack-server --appendonly yes --save "" --no-appendfsync-on-rewrite yes --dir /data

  # ---------------------------------------------------------------------------
  # Scheduler
  # ---------------------------------------------------------------------------

  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    profiles: ["runners"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/ofelia/config.ini:/etc/ofelia/config.ini:ro
    depends_on:
      - runner-mictronics
      - runner-ourairports
      - runner-us-faa-registry
      - runner-ca-transport-canada-registry
      - runner-nz-caa-registry
      - runner-no-caa-registry
      - runner-au-casa-registry
      - runner-fr-dgac-registry
      - runner-nl-ilt-registry
      - runner-bs-caa-registry
      - runner-ch-bazl-registry
      - runner-at-austrocontrol-registry
      - runner-ky-caa-registry
      - runner-uk-caa-registry
      - runner-br-anac-registry
      - runner-is-samgongustofa-registry
      - runner-lu-dac-registry
      - runner-bz-bdca-registry
      - runner-im-ardis-registry
      - runner-es-aesa-registry
      - runner-kr-koca-registry
      - runner-hu-kozhaf-registry
      - runner-cz-caa-registry
      - runner-ee-transpordiamet-registry
      - runner-ge-gcaa-registry
      - runner-gg-2reg-registry
      - runner-kg-caa-registry
      - runner-lv-caa-registry
      - runner-md-caa-registry
      - runner-me-caa-registry
      - runner-mv-caa-registry
      - runner-mk-caa-registry
      - runner-pg-casapng-registry
      - runner-rs-cad-registry
      - runner-sg-caas-registry
      - runner-sk-nsat-registry
      - runner-tc-caa-registry
      - runner-cy-dca-registry
      - runner-hr-ccaa-registry
      - runner-bg-caa-registry
      - runner-airportwebcams-special-liveries
      - runner-vrs-standing-data

  # ---------------------------------------------------------------------------
  # Data runners — created stopped; started on schedule by ofelia.
  #
  # To initialise before first scheduled run:
  #   docker compose -f docker-compose.core.yaml --profile runners up --no-start
  # To run a runner manually, or bulk-load every runner once on a fresh
  # install (mictronics first, then the rest), see README.md's Quick Start.
  # ---------------------------------------------------------------------------

  runner-mictronics:
    image: ghcr.io/brentio/skyfollower-runner-mictronics:latest
    container_name: skyfollower-runner-mictronics
    profiles: ["runners"]
    volumes:
      - ./config/runners/settings.json:/app/settings.json:ro
    depends_on:
      - redis

  runner-ourairports:
    image: ghcr.io/brentio/skyfollower-runner-ourairports:latest
    container_name: skyfollower-runner-ourairports
    profiles: ["runners"]
    volumes:
      - ./config/runners/settings.json:/app/settings.json:ro
      # Mounted as a directory (not a single file) so an optional
      # phonic_overrides.json placed alongside settings.json here can be
      # added, edited, or removed without needing to recreate the container --
      # a single-file mount would fail to start if its source were deleted.
      - ./config/runners:/app/config:ro
    depends_on:
      - redis

  runner-us-faa-registry:
    image: ghcr.io/brentio/skyfollower-runner-us-faa-registry:latest
