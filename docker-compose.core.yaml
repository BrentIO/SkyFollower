name: skyfollower-core

# Interpolated from this host's .env (written by
# scripts/install.sh). Each carries a fallback so the file is
# still usable without one, except SKYFOLLOWER_ROOT -- Ofelia's job-run
# creates containers through the Docker Engine API, which accepts only an
# absolute host path as a bind-mount source, and there is no sensible
# default for "wherever this host was deployed to".
x-ofelia-runner-defaults:
  network: &ofelia-runner-network "${COMPOSE_PROJECT_NAME:-skyfollower-core}_default"
  environment: &ofelia-runner-environment '["LOG_LEVEL=${LOG_LEVEL:-info}", "REDIS_HOST=${REDIS_HOST}", "REDIS_PORT=${REDIS_PORT:-6379}", "REDIS_PASSWORD=${REDIS_PASSWORD}", "REDIS_TTL_DAYS=${REDIS_TTL_DAYS:-14}", "MQTT_HOST=${MQTT_HOST}", "MQTT_PORT=${MQTT_PORT:-1883}", "MQTT_USERNAME=${MQTT_USERNAME}", "MQTT_PASSWORD=${MQTT_PASSWORD}"]'
  delete: &ofelia-runner-delete "true"

# Every runner reads the same set, so the services below alias this block
# rather than merging into it. Deliberately not `env_file: .env`: that would
# hand this host's whole file -- AWS credentials included -- to rabbitmq and
# redis, the two most exposed services here, neither of which reads any of it.
x-runner-environment: &runner-environment
  LOG_LEVEL: ${LOG_LEVEL:-info}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_TTL_DAYS: ${REDIS_TTL_DAYS:-14}
  MQTT_HOST: ${MQTT_HOST}
  MQTT_PORT: ${MQTT_PORT:-1883}
  MQTT_USERNAME: ${MQTT_USERNAME}
  MQTT_PASSWORD: ${MQTT_PASSWORD}

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  rabbitmq:
    image: rabbitmq:4.3-management-alpine@sha256:44bf7eb50fe1765885659e49ccfdc775f8e531964d979321aee380a071f49f94
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
      # Tuned for a constrained host (Raspberry Pi CM4, 8GB RAM/32GB eMMC)
      # shared with Redis and the rest of Host B -- absolute memory/disk
      # watermarks instead of the relative-to-host-RAM default, and the
      # unused rabbitmq_prometheus plugin (SkyFollower's telemetry is
      # entirely MQTT-based) dropped from the stock enabled-plugins set.
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-skyfollower.conf:ro
      - ./config/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    # The same two variables every client authenticates with, so the broker
    # and its clients can no longer be started from different credentials.
    # RabbitMQ always creates this user as a full administrator on first
    # boot -- there is no env var that creates it scoped from the start.
    # scripts/install.sh's provision_rabbitmq_users demotes it to
    # SkyFollower's own resources (and creates a separate administrator for
    # the dashboard) once the container reports healthy.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis/redis-stack-server:7.4.0-v8@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    # Tuned for a constrained host (Raspberry Pi CM4, 8GB RAM/32GB eMMC):
    # AOF is the sole durability mechanism (--save "" disables the default
    # periodic RDB snapshot, redundant with AOF's own rdb-preamble rewrite);
    # fsync pauses during AOF rewrite to avoid contending with the rewrite's
    # own disk I/O; RediSearch's fork-based GC interval is raised from its
    # 30s default to 5 minutes, since a bigger process forking that often
    # costs proportionally more on a smaller host. Re-measure once real
    # traffic is flowing — these are starting points, not measured values.
    environment:
      REDISEARCH_ARGS: "MAXSEARCHRESULTS 10000 MAXAGGREGATERESULTS 10000 FORK_GC_RUN_INTERVAL 300"
    command: redis-stack-server --appendonly yes --save "" --no-appendfsync-on-rewrite yes --dir /data --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Always-on, no `profiles:` -- matches ofelia below, not the runner-*
  # services further down. Polls RabbitMQ's Management API and Redis's
  # INFO/MEMORY STATS on its own connections (never the rabbitmq/redis
  # containers' own internals), so no depends_on: both clients simply retry
  # on their own poll cadence until each backend is reachable.
  core-health:
    image: ghcr.io/brentio/skyfollower-core-health:${SKYFOLLOWER_VERSION:-latest}
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_MANAGEMENT_PORT: ${RABBITMQ_MANAGEMENT_PORT:-15672}
      RABBITMQ_MONITORING_USERNAME: ${RABBITMQ_MONITORING_USERNAME}
      RABBITMQ_MONITORING_PASSWORD: ${RABBITMQ_MONITORING_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    # RAM-backed, not the container's writable layer -- matching every
    # other long-running component's healthcheck heartbeat file. core-health
    # keeps no state of its own (a pure poller/republisher), so this is its
    # only tmpfs/volume of any kind.
    tmpfs:
      - /app/health
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Scheduler
  # ---------------------------------------------------------------------------

  # Runs in label mode (`daemon --docker`), overriding the image's default
  # `daemon --config /etc/ofelia/config.ini` CMD. Ofelia requires job-run
  # definitions to live as labels on its own container, since each run
  # creates a brand new container rather than reusing an existing one --
  # and Compose interpolates ${...} inside label values, which Ofelia's
  # INI parser never did.
  #
  # No depends_on -- job-run creates a fresh, disposable container per
  # scheduled run from its `image` label, so no runner-* container needs
  # to exist beforehand. Listing all runner-* services as dependencies
  # would be actively wrong: Compose starts a service's depends_on
  # alongside it, which would launch every runner concurrently and out of
  # the mictronics-first order the bulk-load sequence (see the Getting
  # Started docs) depends on.
  #
  # No profile either -- this is a long-running service that always
  # belongs up, unlike the runner-* services below.
  #
  # Ofelia 0.3.x's cron parser REQUIRES 6 fields with a leading seconds
  # value: "sec min hour dom month dow". Standard 5-field cron (no
  # seconds) is only auto-detected starting in Ofelia 0.4.x, which has
  # never left beta -- there is no stable tag to pin to instead. A
  # 5-field schedule silently left-aligns into the wrong fields rather
  # than erroring (e.g. "50 4 * * *", intended as daily at 04:50,
  # misparses as hourly at :04:50), so every schedule below keeps its
  # leading "0" (or whatever second is actually wanted). Don't drop back
  # to 5 fields when adding a job.
  ofelia:
    image: mcuadros/ofelia:v3.0.8@sha256:c36048db84b0b54d47a689f723f6f5d19281ac4b87d90fa6433a4582b93f1a5b
    restart: unless-stopped
    command: ["daemon", "--docker"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.enabled: "true"

      # The only job with a volume at all: the runners config directory,
      # mounted whole so an optional phonic_overrides.json can be added or
      # removed without recreating the container.
      ofelia.job-run.runner-ourairports.schedule: "0 10 5 * * 1"
      ofelia.job-run.runner-ourairports.image: "ghcr.io/brentio/skyfollower-runner-ourairports:${SKYFOLLOWER_VERSION:-latest}"
      ofelia.job-run.runner-ourairports.network: *ofelia-runner-network
      ofelia.job-run.runner-ourairports.volume: '["${SKYFOLLOWER_ROOT}/config/runners:/app/config:ro"]'
      ofelia.job-run.runner-ourairports.environment: *ofelia-runner-environment
      ofelia.job-run.runner-ourairports.delete: *ofelia-runner-delete

      # uk-caa-registry makes 676 prefix search calls + per-aircraft detail fetches and takes several hours.
      # Schedule it as the last runner of the day.
      ofelia.job-run.runner-uk-caa-registry.schedule: "0 10 6 * * 1"
      ofelia.job-run.runner-uk-caa-registry.image: "ghcr.io/brentio/skyfollower-runner-uk-caa-registry:${SKYFOLLOWER_VERSION:-latest}"
      ofelia.job-run.runner-uk-caa-registry.network: *ofelia-runner-network
      ofelia.job-run.runner-uk-caa-registry.environment: *ofelia-runner-environment
      ofelia.job-run.runner-uk-caa-registry.delete: *ofelia-runner-delete

      ofelia.job-run.runner-mictronics.schedule: "0 10 5 * * 2"
      ofelia.job-run.runner-mictronics.image: "ghcr.io/brentio/skyfollower-runner-mictronics:${SKYFOLLOWER_VERSION:-latest}"
      ofelia.job-run.runner-mictronics.network: *ofelia-runner-network
      ofelia.job-run.runner-mictronics.environment: *ofelia-runner-environment
      ofelia.job-run.runner-mictronics.delete: *ofelia-runner-delete

      ofelia.job-run.runner-nz-caa-registry.schedule: "0 10 5 * * 3"
      ofelia.job-run.runner-nz-caa-registry.image: "ghcr.io/brentio/skyfollower-runner-nz-caa-registry:${SKYFOLLOWER_VERSION:-latest}"
