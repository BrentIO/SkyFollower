  # ---------------------------------------------------------------------------
  # Data runners — not started by `up`. Ofelia's job-run labels schedule
  # these by image (see the ofelia service above), creating and destroying
  # its own container per scheduled run rather than starting one of these.
  # These service definitions exist solely for the manual/bulk-load path:
  # `docker compose run --rm runner-x`, or to bulk-load every runner once
  # on a fresh install (mictronics first, then the rest) — see README.md's
  # Quick Start.
