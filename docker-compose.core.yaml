      ofelia.job-run.runner-no-caa-registry.image: "ghcr.io/brentio/skyfollower-runner-no-caa-registry:${SKYFOLLOWER_VERSION:-latest}"
      ofelia.job-run.runner-no-caa-registry.network: *ofelia-runner-network
      ofelia.job-run.runner-no-caa-registry.environment: *ofelia-runner-environment
      ofelia.job-run.runner-no-caa-registry.delete: *ofelia-runner-delete

