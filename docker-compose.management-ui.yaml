name: skyfollower-management-ui

# Runs on Host B (core) alongside docker-compose.core.yaml, not on
# the archive host -- management-ui's only dependency is Redis, which already
# lives on Host B. Kept as its own compose file (rather than folded into
# docker-compose.core.yaml) so it can move to a different host later
# without disturbing the rabbitmq/redis/runner stack.

services:

  management-ui:
    image: ghcr.io/brentio/skyfollower-management-ui:${SKYFOLLOWER_VERSION:-latest}
    restart: unless-stopped
    # nginx serves the built React frontend at / and proxies /api/* to
    # uvicorn, which listens on 127.0.0.1:8000 inside the container only.
    ports:
      - "80:80"
    volumes:
      - ./config/management-ui/settings.json:/app/settings.json:ro
      # config:rules/config:areas are the only Redis keys holding
      # user-authored state with no automatic regeneration path -- this
      # backend backs them up here on every write and restores from here
      # at startup if the Redis key is missing (see management-ui/README.md).
      # Bind mount, matching rabbitmq/redis on the core host -- the data
      # directory stays directly readable by the operator on the host.
      - ./data/management-ui:/app/data
    # No curl/wget in the image (only nginx is apt-get installed on top of
    # python:3.14-slim) -- use Python's built-in urllib instead of adding a
    # package just for this. Hits nginx's / (a real static file, index.html
    # via try_files fallback) to confirm nginx is actually serving traffic.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
