name: 🧪 Run Tests
run-name: "Run Tests ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

# Each component (58 today, one per requirements.txt found via `find`) gets
# its own job with its own pip resolve and its own pytest run -- so a new
# component/runner is picked up automatically with no workflow change
# (mirroring the discovery convention already established in
# build-container-images.yaml's discover-images job), and a version-pin
# bump in one component's requirements.txt can never fail another
# component's job. That used to be possible: this workflow previously
# concatenated every requirements.txt into one combined pip install, which
# was faster but meant Dependabot bumping a shared package (pika, boto3,
# pyarrow) in just one file broke the single combined resolve for
# everything else, repeatedly (#931, #942-#947). Slower total CI wall-clock
# is the accepted tradeoff for permanently removing that failure class --
# see #949.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # redis/redis-stack-server is pinned independently here and in
  # docker-compose.core.yaml (dependabot's docker-compose ecosystem only
  # scans compose files, not workflow `services:` blocks -- see
  # .github/dependabot.yml) so a bump to one without the other would
  # silently drift the test-time Redis version from what's actually
  # deployed. This job hard-fails the workflow when the two pins disagree.
  check-redis-image-pin:
    name: 🔒 Check redis-stack-server pin matches docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare redis/redis-stack-server pin against docker-compose.core.yaml
        run: |
          set -euo pipefail
          # Anchored on "image: " (not just the bare image name) so this
          # doesn't match its own pattern text below when grepping this
          # workflow file, and doesn't match the explanatory comment above
          # this job.
          workflow_image=$(grep -ohE 'image: *redis/redis-stack-server:[^[:space:]]+' .github/workflows/run-tests.yaml | sed 's/^image: *//' | head -n1)
          compose_image=$(grep -ohE 'image: *redis/redis-stack-server:[^[:space:]]+' docker-compose.core.yaml | sed 's/^image: *//' | head -n1)

          if [ -z "$workflow_image" ] || [ -z "$compose_image" ]; then
            echo "::error::Could not find a redis/redis-stack-server image reference in one of the two files (workflow='${workflow_image}', compose='${compose_image}')."
            exit 1
          fi

          echo "run-tests.yaml:            $workflow_image"
          echo "docker-compose.core.yaml:  $compose_image"

          if [ "$workflow_image" != "$compose_image" ]; then
            echo "::error::redis/redis-stack-server pin mismatch -- .github/workflows/run-tests.yaml ($workflow_image) does not match docker-compose.core.yaml ($compose_image). Update both to the same tag@digest in the same PR."
            exit 1
          fi

  # Every Dockerfile base image must be pinned to image:tag@sha256:<digest>,
  # not a bare floating tag. Docker Hub re-pushes tags like python:3.14-slim
  # under the same name on every upstream Debian/Python patch, and
  # Dependabot's docker ecosystem only opens a PR for a digest that is
  # already present in the FROM line -- an unpinned tag gets no
  # security/bugfix-rebuild signal at all. This job hard-fails the workflow
  # if any Dockerfile's FROM line for an external image lacks a digest; a
  # FROM that refers back to an earlier "AS <stage>" in the same file is an
  # internal stage reference and is exempt.
  check-dockerfile-digest-pins:
    name: 🔒 Check every Dockerfile base image is digest-pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Verify every external FROM line carries an @sha256 digest"
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' dockerfile; do
            # Names introduced by "... AS <stage>" in this file -- a later
            # "FROM <stage>" referring back to one of these is an internal
            # stage reference, not an external image, and needs no digest.
            stages=$(grep -iE '^[[:space:]]*FROM[[:space:]]+.+[[:space:]]+AS[[:space:]]+' "$dockerfile" \
              | sed -E 's/.*[[:space:]][Aa][Ss][[:space:]]+([A-Za-z0-9_.-]+).*/\1/' | sort -u || true)
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              ref=$(echo "$line" | sed -E 's/^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]+(--platform=[^[:space:]]+[[:space:]]+)?([^[:space:]]+).*/\2/')
              if [ -n "$stages" ] && echo "$stages" | grep -qxF "$ref"; then
                continue
              fi
              if ! echo "$ref" | grep -q '@sha256:'; then
                echo "::error file=$dockerfile::FROM '$ref' is not digest-pinned (expected image:tag@sha256:<digest>)."
                fail=1
              fi
            done < <(grep -iE '^[[:space:]]*FROM[[:space:]]' "$dockerfile")
          done < <(find . -name Dockerfile -not -path './.venv/*' -not -path '*/node_modules/*' -print0)
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more Dockerfiles have an unpinned base image. Resolve the current digest (docker buildx imagetools inspect <image>:<tag>) and rewrite the FROM line as image:tag@sha256:<digest>."
            exit 1
          fi
          echo "Every Dockerfile's external FROM line is digest-pinned."

  # .github/dependabot.yml is a fully-manual, one-entry-per-directory file
  # with no auto-discovery of its own (unlike this workflow's `discover` job
  # below, or build-container-images.yaml's discover-images job) -- a new
  # component is added by copying an existing one's structure
  # (requirements.txt/Dockerfile/package.json), but nothing forces
  # dependabot.yml to be updated in the same PR. This job hard-fails the
  # workflow if it ever drifts again, in either direction: a directory with
  # a manifest file but no matching entry (a new/renamed component that
  # Dependabot silently isn't watching), or an entry whose directory no
  # longer exists or no longer has the relevant manifest file (a stale
  # entry left behind by a removed/renamed component).
  check-dependabot-sync:
    name: 🔒 Check dependabot.yml matches repo layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare dependabot.yml pip/docker/npm entries against actual manifest locations
        run: |
          set -euo pipefail
          fail=0

          # Same `find` pattern used by this workflow's own `discover` job
          # and by build-container-images.yaml's discover-images job.
          pip_actual=$(find . -maxdepth 3 -name requirements.txt -not -path './.venv/*' -print0 \
            | xargs -0 -n1 dirname | sed 's|^\./|/|' | sort -u)
          docker_actual=$(find . -name Dockerfile -not -path './.venv/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 dirname | sed 's|^\./|/|' | sort -u)
          npm_actual=$(find . -name package.json -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 dirname | sed 's|^\./|/|' | sort -u)

          # dependabot.yml's format is a strict, regular list of stanzas --
          # each entry has exactly one "package-ecosystem" line immediately
          # followed (after the intervening non-matching "schedule"/
          # "interval" lines) by exactly one "directory" line -- so pairing
          # the two grep matches in file order is equivalent to parsing the
          # YAML, without a YAML parser dependency in this job.
          pairs=$(grep -oE 'package-ecosystem: "[^"]+"|directory: "[^"]+"' .github/dependabot.yml \
            | paste - - \
            | sed -E 's/package-ecosystem: "([^"]+)"\t?directory: "([^"]+)"/\1\t\2/')

          get_dirs() {
            echo "$pairs" | awk -F'\t' -v eco="$1" '$1 == eco { print $2 }' | sort -u
          }

          pip_declared=$(get_dirs "pip")
          docker_declared=$(get_dirs "docker")
          npm_declared=$(get_dirs "npm")

          check_ecosystem() {
            local name="$1" actual="$2" declared="$3"

            local missing
            missing=$(comm -23 <(echo "$actual") <(echo "$declared") | sed '/^$/d')
            if [ -n "$missing" ]; then
              echo "::error::.github/dependabot.yml is missing '$name' entries for these directories (they have the relevant manifest file but no matching entry):"
              echo "$missing" | sed 's/^/  /'
              fail=1
            fi

            local stale
            stale=$(comm -13 <(echo "$actual") <(echo "$declared") | sed '/^$/d')
            if [ -n "$stale" ]; then
              echo "::error::.github/dependabot.yml has stale '$name' entries pointing at directories that no longer exist or no longer have the relevant manifest file:"
              echo "$stale" | sed 's/^/  /'
              fail=1
            fi
          }

          check_ecosystem "pip" "$pip_actual" "$pip_declared"
          check_ecosystem "docker" "$docker_actual" "$docker_declared"
          check_ecosystem "npm" "$npm_actual" "$npm_declared"

          if [ "$fail" -ne 0 ]; then
            echo "::error::.github/dependabot.yml has drifted from the repo's actual requirements.txt/Dockerfile/package.json locations. Update it in the same PR that added/removed the component."
            exit 1
          fi

          echo "dependabot.yml pip/docker/npm entries match the repo's actual requirements.txt/Dockerfile/package.json locations."

  # Discovers every component directory with its own requirements.txt, same
  # `find` pattern this workflow always used for the (now-removed) combined
  # install, then filters that list down to only the directories touched by
  # this trigger's diff. `fetch-depth: 0` is required here (unlike the other
  # jobs' default shallow checkout) so that both endpoints of the diff below
  # -- the PR's base/head commits, or a push's before/after commits -- are
  # guaranteed to be present as local objects for `git diff` to compare.
  discover:
    name: 🔎 Discover components
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Find every component with its own requirements.txt
        id: discover
        run: |
          set -euo pipefail
          dirs=()
          while IFS= read -r -d '' f; do
            dirs+=("$(dirname "$f")")
          done < <(find . -maxdepth 3 -name requirements.txt -not -path './.venv/*' -print0 | sort -z)
          json=$(printf '%s\n' "${dirs[@]}" | sed 's|^\./||' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Discovered $(echo "$json" | jq 'length') component(s)."
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

      # A manual workflow_dispatch run always gets the full matrix (an
      # intentional full run, not something to diff against). Otherwise the
      # matrix is filtered to only the discovered component directories that
      # contain at least one file from this trigger's diff -- pull_request
      # diffs the PR's base/head commits, push diffs the pushed commit's
      # before/after -- with a fallback to the full, unfiltered matrix
      # whenever a file under shared/ changed (nearly every component
      # imports it) or this workflow file itself changed (a bug in this
      # filtering logic should be caught by the full matrix it's supposedly
      # filtering, not trusted blindly). A diff that matches neither
      # fallback and touches none of the discovered directories legitimately
      # produces an empty matrix.
      - name: Filter matrix to components touched by this diff
        id: filter
        run: |
          set -euo pipefail
          full_matrix='${{ steps.discover.outputs.matrix }}'
          event_name="${{ github.event_name }}"

          use_full_matrix() {
            echo "Using full matrix ($(echo "$full_matrix" | jq 'length') component(s)): $1"
            echo "matrix=$full_matrix" >> "$GITHUB_OUTPUT"
          }

          if [ "$event_name" = "workflow_dispatch" ]; then
            use_full_matrix "manual workflow_dispatch run"
            exit 0
          fi

          if [ "$event_name" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files=$(git diff --name-only "$base_sha" "$head_sha")
          elif [ "$event_name" = "push" ]; then
            before_sha="${{ github.event.before }}"
            after_sha="${{ github.event.after }}"
            if [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
              use_full_matrix "push 'before' SHA is all-zeros (new branch); nothing to diff against"
              exit 0
            fi
            changed_files=$(git diff --name-only "$before_sha" "$after_sha")
          else
            use_full_matrix "unrecognized event '$event_name'"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed_files"

          if echo "$changed_files" | grep -q '^shared/'; then
            use_full_matrix "a file under shared/ changed"
            exit 0
          fi

          if echo "$changed_files" | grep -qxF '.github/workflows/run-tests.yaml'; then
            use_full_matrix "the run-tests.yaml workflow file itself changed"
            exit 0
          fi

          changed_json=$(printf '%s\n' "$changed_files" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          filtered=$(echo "$full_matrix" | jq -c --argjson changed "$changed_json" \
            'map(select(. as $dir | $changed | any(startswith($dir + "/"))))')

          echo "Filtered to $(echo "$filtered" | jq 'length') component(s): $filtered"
          echo "matrix=$filtered" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.dir }})
    needs: discover
    # A literally empty strategy.matrix (e.g. a docs-only diff) doesn't just
    # skip this job cleanly -- GitHub Actions reports the *workflow run's*
    # own top-level conclusion as failure even though every listed job
    # passed (see the all-tests-passed job below, which independently
    # already handles this correctly). Explicitly skipping via `if:` avoids
    # ever entering that zero-combination-matrix state at all.
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.matrix) }}
    # RedisJSON + Lua scripting support, matching docker-compose.core.yaml.
    # Attached to every job rather than only the ones that use Redis --
    # simpler than teaching the discovery step which components need it,
    # and the container is cheap enough that the cost of attaching it
    # everywhere is negligible. shared/tests/test_merge_aircraft_lua.py
    # already defaults to localhost:6379, which is where Actions exposes a
    # job-scoped service container. Without the healthcheck, that suite would
    # intermittently skip (not fail) on a cold container instead of running.
    services:
      redis:
        image: redis/redis-stack-server:7.4.0-v8@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "${{ matrix.dir }}/requirements.txt"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # pytest + pytest-xdist + pyyaml + httpx2 are test-only, installed
          # uniformly for every component rather than special-cased per
          # directory (httpx2 in particular is only actually exercised by
          # management-ui/backend/tests/, as FastAPI TestClient's HTTP
          # transport) -- keeping the step identical across all 58 jobs is
          # simpler than tracking which components need which test-only
          # extra, and none of these four are heavyweight.
          python -m pip install pytest pytest-xdist pyyaml httpx2
          python -m pip install -r "${{ matrix.dir }}/requirements.txt"

      - name: Run tests
        # --dist=loadgroup (not the plain -n auto default of --dist=load) is
        # required for the @pytest.mark.xdist_group markers used by tests
        # that share live, mutable state (e.g. shared/tests/test_route_airports_lua.py's
        # seeded Redis keys) to actually pin those tests onto one worker --
        # otherwise the marker is silently ignored and every worker's own
        # module-scoped fixture instance can race the others. Applied
        # uniformly across the matrix rather than only shared/'s job since
        # it's a no-op for components with no xdist_group markers.
        run: python -m pytest -q "${{ matrix.dir }}/tests" -n auto --dist=loadgroup

  # Single stable required check for branch protection, so it doesn't need
  # updating every time a component is added or removed from the matrix.
  all-tests-passed:
    name: ✅ All component tests passed
    runs-on: ubuntu-latest
    needs: [check-redis-image-pin, check-dockerfile-digest-pins, check-dependabot-sync, discover, test]
    if: always()
    steps:
      - name: Check that every required job succeeded
        run: |
          set -euo pipefail
          if [ "${{ needs.check-redis-image-pin.result }}" != "success" ]; then
            echo "::error::check-redis-image-pin did not succeed (${{ needs.check-redis-image-pin.result }})."
            exit 1
          fi
          if [ "${{ needs.check-dockerfile-digest-pins.result }}" != "success" ]; then
            echo "::error::check-dockerfile-digest-pins did not succeed (${{ needs.check-dockerfile-digest-pins.result }})."
            exit 1
          fi
          if [ "${{ needs.check-dependabot-sync.result }}" != "success" ]; then
            echo "::error::check-dependabot-sync did not succeed (${{ needs.check-dependabot-sync.result }})."
            exit 1
          fi
          # An empty filtered matrix (e.g. a docs-only diff) makes the `test`
          # job's own result unreliable -- observed as "failure" in practice
          # (not "skipped" as GitHub Actions docs might suggest) when its
          # matrix has zero entries, since a zero-entry matrix strategy
          # produces no runs to succeed. So an empty matrix short-circuits
          # this check entirely rather than trusting needs.test.result.
          if [ '${{ needs.discover.outputs.matrix }}' = '[]' ]; then
            echo "Empty test matrix (no component touched by this diff) -- nothing to check."
            exit 0
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::One or more component test jobs did not succeed (${{ needs.test.result }})."
            exit 1
          fi
