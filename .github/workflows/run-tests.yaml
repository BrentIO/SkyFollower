name: 🧪 Run Tests
run-name: "Run Tests ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

# Runs every pytest suite in the repo. Dependencies are installed by
# concatenating every component's requirements.txt found via `find` — so
# adding a new component (data runner or otherwise) with its own
# requirements.txt and tests/ directory is picked up automatically, with no
# workflow change needed, mirroring the discovery convention already
# established in build-container-images.yaml's discover-images job.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # RedisJSON + Lua scripting support, matching docker-compose.core.yaml.
    # Exposed on the default port; shared/tests/test_merge_aircraft_lua.py
    # already defaults to localhost:6379, which is where Actions exposes a
    # job-scoped service container. Without the healthcheck, that suite would
    # intermittently skip (not fail) on a cold container instead of running.
    services:
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # pytest + pytest-xdist + pyyaml are test-only — kept out of
          # shared/requirements.txt so they don't get pulled into every
          # runner's Docker image. httpx2 is FastAPI TestClient's HTTP
          # transport for management-ui/backend/tests/, also test-only —
          # the ui backend image itself never makes outbound calls.
          python -m pip install pytest pytest-xdist pyyaml httpx2
          # One combined pip install, not one per file: every requirements.txt
          # in the repo resolves to only ~19 distinct packages with no
          # conflicting version pins between components, so installing them
          # separately (50 files today) was 50 redundant resolver passes.
          find . -maxdepth 3 -name requirements.txt -not -path './.venv/*' -print0 \
            | xargs -0 cat > /tmp/combined-requirements.txt
          python -m pip install -r /tmp/combined-requirements.txt

      - name: Run tests
        run: python -m pytest -q -n auto
