name: 🛠️ Build Container Images
run-name: "Build container images ${{ github.ref_name }}"

# Two ways in:
#   1. workflow_dispatch, --ref <tag> — how release.yaml triggers this. A tag
#      pushed with GITHUB_TOKEN does not itself fire the `push: tags:` trigger
#      below (GitHub suppresses that to avoid workflow recursion), so
#      release.yaml calls `gh workflow run build-container-images.yaml --ref <version>`
#      explicitly once the tag exists.
#   2. push: tags — fallback for a tag pushed some other way (e.g. a human
#      pushing with their own credentials).
#
# workflow_dispatch also accepts test_mode, for dry-running workflow changes
# (e.g. cache behavior, matrix concurrency) against an arbitrary ref like
# `main` without cutting a real release tag or publishing to GHCR.
on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode: build only, don't push, skip version-tag validation (for dry-running against a branch)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if [[ "${{ inputs.test_mode }}" == "true" ]]; then
            echo "⚠️ test_mode enabled — skipping version format validation (ref: ${{ github.ref_name }})"
            exit 0
          fi
          if [[ ! "${{ github.ref_name }}" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[1-9][0-9])$ ]]; then
            echo "❌ Invalid version format: ${{ github.ref_name }}. Expected YYYY.MM.BB"
            exit 1
          fi
          echo "✅ Version format is valid: ${{ github.ref_name }}"

  discover-images:
    needs: validate-version
    # Every component with a Dockerfile is built and published — the matrix
    # below is generated from the repo tree, not hardcoded. A new data
    # runner needs no workflow change (runners/* is wildcard-matched
    # below); any other new top-level component (e.g. management-ui) needs
    # one new line in the case statement mapping its directory to an image
    # name.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Discover images to build
        id: discover
        run: |
          set -euo pipefail
          matrix="[]"
          while IFS= read -r -d '' dockerfile; do
            dockerfile="${dockerfile#./}"
            dir="$(dirname "$dockerfile")"
            case "$dir" in
              receiver) name="receiver" ;;
              message-processor) name="message-processor" ;;
              archive-processor) name="archive" ;;
              management-ui) name="management-ui" ;;
              runners/*) name="runner-$(basename "$dir")" ;;
              *) echo "Skipping unrecognized Dockerfile: $dockerfile" >&2; continue ;;
            esac
            image="ghcr.io/brentio/skyfollower-${name}"
            matrix=$(jq -c --arg name "$name" --arg dockerfile "$dockerfile" --arg image "$image" \
              '. + [{"name": $name, "dockerfile": $dockerfile, "image": $image}]' <<<"$matrix")
          done < <(find . -mindepth 2 -maxdepth 3 -name Dockerfile -print0 | sort -z)

          echo "Discovered $(jq 'length' <<<"$matrix") image(s):" >&2
          jq -c '.[] | .name' <<<"$matrix" >&2

          echo "matrix=$(jq -c -n --argjson entries "$matrix" '{include: $entries}')" >> "$GITHUB_OUTPUT"

  build:
    needs: discover-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # QEMU setup's binfmt image is cached via actions/cache and reachable
      # from any ref via GitHub's default-branch fallback, so most runs
      # never hit Docker Hub for it. Kept below the matrix size (~48
      # images) for the residual case where that cache is cold and several
      # jobs would otherwise race a real Docker Hub pull at once.
      max-parallel: 8
      matrix: ${{ fromJson(needs.discover-images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No image currently bundles specs/*.yaml, so there's nothing to stamp
      # here. release.yaml stamps version-substituted copies once and
      # attaches them to the GitHub Release directly instead of repeating
      # that work in every one of this job's matrix entries.

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64,linux/amd64
          # In test_mode, nothing is pushed to GHCR — the tags below are
          # still computed but unused, since push is the gate that matters.
          push: ${{ !inputs.test_mode }}
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:latest
          # Scoped per image so one component's cache can't evict another's
          # in the shared GHA cache namespace.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
