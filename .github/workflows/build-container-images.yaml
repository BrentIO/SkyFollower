name: 🛠️ Build Container Images
run-name: "Build container images ${{ github.ref_name }}${{ inputs.dev_mode && ' (dev)' || '' }}"

# Two ways in:
#   1. workflow_dispatch, --ref <tag> — how release.yaml triggers this. A tag
#      pushed with GITHUB_TOKEN does not itself fire the `push: tags:` trigger
#      below (GitHub suppresses that to avoid workflow recursion), so
#      release.yaml calls `gh workflow run build-container-images.yaml --ref <version>`
#      explicitly once the tag exists.
#   2. push: tags — fallback for a tag pushed some other way (e.g. a human
#      pushing with their own credentials).
#
# workflow_dispatch also accepts test_mode, for dry-running workflow changes
# (e.g. cache behavior, matrix concurrency) against an arbitrary ref like
# `main` without cutting a real release tag or publishing to GHCR, and
# dev_mode, for actually publishing a real, pullable dev build from `main`
# or any branch without cutting a release at all -- e.g.
# `gh workflow run build-container-images.yaml --ref my-branch -f dev_mode=true`.
# dev_mode images are tagged `:dev-{branch}` and the floating `:dev`, never
# `:latest` or the raw ref name, so a dev build can never be mistaken for
# (or overwrite) a real release tag that a fresh production install
# defaults to. Both dev_mode and test_mode also stamp the image's baked-in
# VERSION as `9999.99.99` rather than the ref name — the same sentinel
# specs/*.yaml carry on main. See docs/getting-started/index.md's "Testing
# a dev build".
on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode: build only, don't push, skip version-tag validation (for dry-running against a branch)"
        type: boolean
        default: false
      dev_mode:
        description: "Dev mode: build AND push, tagged :dev-{branch} and :dev, skip version-tag validation (for real dev/host testing against main or any branch)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if [[ "${{ inputs.test_mode }}" == "true" && "${{ inputs.dev_mode }}" == "true" ]]; then
            echo "❌ test_mode and dev_mode can't both be true — test_mode never pushes, dev_mode always does. Pick one."
            exit 1
          fi
          if [[ "${{ inputs.test_mode }}" == "true" ]]; then
            echo "⚠️ test_mode enabled — skipping version format validation (ref: ${{ github.ref_name }})"
            exit 0
          fi
          if [[ "${{ inputs.dev_mode }}" == "true" ]]; then
            echo "⚠️ dev_mode enabled — skipping version format validation, will publish :dev-* tags (ref: ${{ github.ref_name }})"
            exit 0
          fi
          if [[ ! "${{ github.ref_name }}" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[1-9][0-9])$ ]]; then
            echo "❌ Invalid version format: ${{ github.ref_name }}. Expected YYYY.MM.BB"
            exit 1
          fi
          echo "✅ Version format is valid: ${{ github.ref_name }}"

  discover-images:
    needs: validate-version
    # Every component with a Dockerfile is built and published — the matrix
    # below is generated from the repo tree, not hardcoded. A new data
    # runner needs no workflow change (runners/* is wildcard-matched
    # below); any other new top-level component (e.g. management-ui) needs
    # one new line in the case statement mapping its directory to an image
    # name.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Discover images to build
        id: discover
        run: |
          set -euo pipefail
          matrix="[]"
          while IFS= read -r -d '' dockerfile; do
            dockerfile="${dockerfile#./}"
            dir="$(dirname "$dockerfile")"
            case "$dir" in
              receiver) name="receiver" ;;
              message-processor) name="message-processor" ;;
              archive-processor) name="archive" ;;
              archive-compaction) name="archive-compaction" ;;
              aws-setup) name="aws-setup" ;;
              core-health) name="core-health" ;;
              management-ui) name="management-ui" ;;
              runners/*) name="runner-$(basename "$dir")" ;;
              *) echo "Skipping unrecognized Dockerfile: $dockerfile" >&2; continue ;;
            esac
            image="ghcr.io/brentio/skyfollower-${name}"
            matrix=$(jq -c --arg name "$name" --arg dockerfile "$dockerfile" --arg image "$image" \
              '. + [{"name": $name, "dockerfile": $dockerfile, "image": $image}]' <<<"$matrix")
          done < <(find . -mindepth 2 -maxdepth 3 -name Dockerfile -print0 | sort -z)

          echo "Discovered $(jq 'length' <<<"$matrix") image(s):" >&2
          jq -c '.[] | .name' <<<"$matrix" >&2

          echo "matrix=$(jq -c -n --argjson entries "$matrix" '{include: $entries}')" >> "$GITHUB_OUTPUT"

  build:
    needs: discover-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # QEMU setup's binfmt image is cached via actions/cache and reachable
      # from any ref via GitHub's default-branch fallback, so most runs
      # never hit Docker Hub for it. Kept below the matrix size (~48
      # images) for the residual case where that cache is cold and several
      # jobs would otherwise race a real Docker Hub pull at once.
      max-parallel: 8
      matrix: ${{ fromJson(needs.discover-images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No image currently bundles specs/*.yaml, so there's nothing to stamp
      # here. release.yaml stamps version-substituted copies once and
      # attaches them to the GitHub Release directly instead of repeating
      # that work in every one of this job's matrix entries.

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        # dev_mode tags as :dev-{branch} (pin to a specific branch's most
        # recent build) and the floating :dev (whatever was built most
        # recently, any branch) -- never :latest or the raw ref name, so a
        # dev build can never be mistaken for a real release tag. Branch
        # names can contain `/` (e.g. feature/foo), which Docker tags
        # don't allow, so it's sanitized first. Built with $'\n' rather
        # than a literal multi-line string so this run block's own
        # indentation never leaks into the tag value.
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dev_mode }}" == "true" ]]; then
            sanitized_ref="$(printf '%s' '${{ github.ref_name }}' | tr '/' '-')"
            tags="${{ matrix.image }}:dev-${sanitized_ref}"$'\n'"${{ matrix.image }}:dev"
          else
            tags="${{ matrix.image }}:${{ github.ref_name }}"$'\n'"${{ matrix.image }}:latest"
          fi
          {
            echo "list<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64,linux/amd64
          # BuildKit's default provenance/SBOM attestations attach a second
          # manifest per platform to the pushed image index. Nothing here
          # consumes them, and some tooling (including GHCR's own package
          # page) doesn't recognize attestation manifests and displays them
          # as a phantom "unknown/unknown" platform instead of hiding them.
          provenance: false
          sbom: false
          # A release build stamps the real YYYY.MM.BB tag. A dev_mode or
          # test_mode build is not a release, so it stamps the same
          # 9999.99.99 sentinel that specs/*.yaml carry on main — a
          # version-shaped value that reads unambiguously as "not a
          # release" wherever VERSION surfaces (e.g. Home Assistant
          # sw_version via shared/ha_discovery.py). Branch provenance for a
          # dev build is still in its :dev-{branch} image tag.
          build-args: |
            VERSION=${{ (inputs.dev_mode || inputs.test_mode) && '9999.99.99' || github.ref_name }}
          # In test_mode, nothing is pushed to GHCR — the tags below are
          # still computed but unused, since push is the gate that matters.
          # dev_mode always pushes (that's the point); validate-version
          # already rejects test_mode and dev_mode both being true.
          push: ${{ !inputs.test_mode }}
          tags: ${{ steps.tags.outputs.list }}
          # Scoped per image so one component's cache can't evict another's
          # in the shared GHA cache namespace.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
